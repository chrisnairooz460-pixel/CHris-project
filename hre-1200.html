<title>Rex Romanorum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--panel:#f3efe5;--panel-2:#e8e2d3;--rule:#cdc5b2;--ink:#1b1a17;--ink-2:#4a473f;--ink-3:#7b776c;--sea:#1e3a4a;--gold:#a67c1c;--gold2:#d8b14a;--sable:#1c1a15;--blood:#962330;--good:#476f45;--warn:#a8701b;--bad:#9c2a28;--staufen:#b3272d;--welf:#2f5d8c;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1a1917;--panel-2:#23221e;--rule:#3a382f;--ink:#ece7da;--ink-2:#b4ae9e;--ink-3:#86806f;--gold:#d8b14a;--gold2:#eccd7a;--sable:#0d0c08;--blood:#c4414b;--good:#78a874;--warn:#d6a147;--bad:#d46360;--staufen:#d9494f;--welf:#5f92c4;color-scheme:dark;}}
:root[data-theme="dark"]{--panel:#1a1917;--panel-2:#23221e;--rule:#3a382f;--ink:#ece7da;--ink-2:#b4ae9e;--ink-3:#86806f;--gold:#d8b14a;--gold2:#eccd7a;--sable:#0d0c08;--blood:#c4414b;--good:#78a874;--warn:#d6a147;--bad:#d46360;--staufen:#d9494f;--welf:#5f92c4;color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--panel);color:var(--ink);overflow:hidden}
#app{display:flex;height:100%;width:100%}
#side{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
#head{padding:16px 20px 13px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:25px;line-height:1.08;margin:0 0 3px}
#head p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
#body{flex:1;overflow-y:auto;padding:16px 20px 22px}
#ph{color:var(--ink-3);font-size:13.5px;line-height:1.65}
#top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
#sel h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;margin:0 0 2px;line-height:1.14}
#rank{font-size:12px;margin:0}
#hl{font-size:11.5px;color:var(--ink-3);margin:0 0 2px}
#house{font-size:15px;margin:0 0 13px;font-weight:500}
#note{font-size:14px;line-height:1.68;color:var(--ink-2);margin:0 0 14px}
#dis{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin:0;border-top:1px solid var(--rule);padding-top:10px}
#legend{border-top:1px solid var(--rule);padding:11px 20px 14px;display:flex;flex-wrap:wrap;gap:7px 13px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.sw{width:11px;height:11px;border-radius:2px;opacity:.85}
#stage{flex:1;position:relative;background:var(--sea);overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
svg#map{display:block;width:100%;height:100%}
.terr{cursor:pointer}
.terr path.f{transition:fill .25s,fill-opacity .14s}
.terr:hover path.o{stroke-opacity:.85!important}
.terr.dim path.f{fill-opacity:.42!important}
.terr.dim path.s{stroke-opacity:.5}
text{font-family:Inter,sans-serif;paint-order:stroke;pointer-events:none}
#tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{background:var(--panel-2)}
button.off{color:var(--ink-3)}
button:focus-visible{outline:2px solid #c48a2a;outline-offset:1px}
#hint{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:#e8e2d3;background:rgba(12,22,28,.6);padding:4px 9px;border-radius:5px}
@media (max-width:860px){
 #app{flex-direction:column-reverse}
 #side{width:100%;flex:0 0 auto;max-height:48%;border-right:none;border-top:1px solid var(--rule)}
 #stage{flex:1;min-height:0}
 h1{font-size:20px}#head{padding:11px 15px 9px}#body{padding:12px 15px 16px}#legend{padding:8px 15px 10px}
}
/* ============ simulation layer ============ */
#shell{display:flex;flex-direction:column;height:100%}
#app{flex:1;min-height:0;height:auto}
h1,h2,h3,h4{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
#bar{flex:0 0 auto;display:flex;align-items:stretch;background:var(--sable);border-bottom:2px solid var(--gold);
 min-height:50px;padding-top:env(safe-area-inset-top,0px)}
#crest{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:6px 13px;border-right:1px solid #ffffff1f}
#crest .ttl{font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;font-weight:700;color:var(--gold2);line-height:1.05}
#crest .sub{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#ffffff7a;margin-top:1px}
#stats{flex:1;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#stats::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;padding:5px 14px;border-right:1px solid #ffffff14;min-width:82px}
.st .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#ffffff6b;white-space:nowrap}
.st .v{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-variant-numeric:tabular-nums;color:#f0e4c4;white-space:nowrap;margin-top:1px}
.st .v.g{color:#9ed49a}.st .v.b{color:#e8928e}.st .v.w{color:var(--gold2)}
#endwrap{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 11px;border-left:1px solid #ffffff1f}
#end{background:var(--blood);color:#fff;border:1px solid #ffffff38;border-radius:4px;padding:8px 16px;
 font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:600;white-space:nowrap}
#end:hover{background:var(--blood);filter:brightness(1.15)}
#end:disabled{opacity:.45;cursor:default}
#themeb{background:none;border:1px solid #ffffff2e;color:#ffffff9c;padding:5px 7px;font-size:13px;line-height:1;border-radius:4px}
#themeb:hover{background:#ffffff14}
#tabs{flex:0 0 auto;display:flex;overflow-x:auto;background:var(--panel-2);border-bottom:1px solid var(--rule);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;border-right:1px solid var(--rule);border-bottom:2px solid transparent;
 border-radius:0;padding:8px 11px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tab:hover{background:var(--panel)}
.tab[aria-selected=true]{color:var(--ink);background:var(--panel);border-bottom-color:var(--blood);font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blood);margin-left:5px;vertical-align:1px}
/* panel furniture */
.sec{margin:0 0 19px}
.sh{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:9px}
.sh h3{font-size:18px}
.sh .hr{margin-left:auto;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.lead{font-size:13px;line-height:1.62;color:var(--ink-2);margin:0 0 11px}
.fine{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin:7px 0 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dotted var(--rule)}
.kv:last-child{border-bottom:none}
.kv .k{font-size:12px;color:var(--ink-2);flex:1;min-width:0}
.kv .v{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv .v.wd{font-family:Inter,sans-serif;font-size:12px}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}.mu{color:var(--ink-3)}
.bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.card{background:var(--panel-2);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;margin:0 0 9px}
.card.hi{border-left:3px solid var(--blood)}
.card h4{font-size:15px;margin-bottom:3px}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
.btn{background:var(--panel-2);border:1px solid var(--rule);border-radius:5px;padding:5px 10px;font-size:12px}
.btn.p{background:var(--blood);color:#fff;border-color:#0003}
.btn.p:hover{background:var(--blood);filter:brightness(1.1)}
.btn.sm{padding:3px 7px;font-size:11px}
.btn:disabled{opacity:.42;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{font-size:12.5px;color:var(--ink-3);font-style:italic;padding:9px 0;line-height:1.6}
.tr{padding:7px 0;border-bottom:1px dotted var(--rule)}
.selrow,#p-diplo .tr{content-visibility:auto;contain-intrinsic-size:auto 58px}
.tr:last-child{border-bottom:none}
.trh{display:flex;align-items:baseline;gap:8px}
.tr .n{font-size:12.5px;flex:1;min-width:0}
.tr .d{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:2px}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;cursor:pointer;line-height:1.5}
textarea{width:100%;font-family:Inter,sans-serif;font-size:13px;background:var(--panel);color:var(--ink);
 border:1px solid var(--rule);border-radius:5px;padding:8px 9px;line-height:1.55;resize:vertical;min-height:66px}
#ovbtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:min(420px,52vw)}
#tools button{font-size:11.5px;padding:5px 9px;border-radius:5px}
#tools button.on{background:var(--sable);color:var(--gold2);border-color:var(--gold)}
#legend .lt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);width:100%;margin-bottom:-2px}
/* modal */
#veil[hidden]{display:none}
#veil{position:fixed;inset:0;background:#0b0a07d9;display:flex;align-items:center;justify-content:center;z-index:40;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);backdrop-filter:blur(3px)}
#modal{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:6px;
 max-width:650px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 18px 60px #00000080}
#mbody{padding:20px 24px 22px}
#modal h2{font-size:26px;margin-bottom:3px}
#modal .ey{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--blood);font-weight:600;margin-bottom:8px}
#modal p{font-size:13.5px;line-height:1.72;color:var(--ink-2);margin:0 0 12px}
#modal p.q{border-left:2px solid var(--gold);padding-left:12px;font-family:"Cormorant Garamond",Georgia,serif;
 font-size:16.5px;color:var(--ink);font-style:italic}
.opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:5px;
 padding:10px 13px;margin:0 0 7px}
.opt:hover{border-color:var(--gold);background:var(--panel-2)}
.opt .ot{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:600;display:block;margin-bottom:2px}
.opt .od{font-size:11.5px;color:var(--ink-3);line-height:1.55;display:block}
.opt:disabled{opacity:.45}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:3px 0 13px}
.side2 .opt{margin:0}
.side2 .sa{display:flex;align-items:center;gap:9px;margin-bottom:6px}
/* chronicle */
.ent{border-left:2px solid var(--rule);padding:0 0 12px 12px}
.ent:last-child{padding-bottom:1px}
.ent .yr{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--gold);letter-spacing:.04em}
.ent .tx{font-size:12.5px;line-height:1.62;color:var(--ink-2);margin-top:2px}
.ent .tx b{color:var(--ink);font-weight:600}
.ent.say{border-left-color:var(--blood)}
.ent.say .tx{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;font-style:italic;color:var(--ink)}
@media (max-width:860px){
 #tools{left:8px;right:8px;max-width:none;align-items:stretch}
 #ovbtns,#tools>div{flex-wrap:nowrap;overflow-x:auto;max-width:none;justify-content:flex-start;scrollbar-width:none}
 #ovbtns::-webkit-scrollbar,#tools>div::-webkit-scrollbar{display:none}
 #tools button{flex:0 0 auto}
 #crest .sub{display:none}
 .side2{grid-template-columns:1fr}
 #mbody{padding:16px 16px 18px}
 #modal h2{font-size:22px}
 #ovbtns{max-width:58vw}
}
.effs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.eff{font-size:10.5px;line-height:1.35;padding:2px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.eff.g{color:var(--good)}.eff.b{color:var(--bad)}
.eff.u{color:var(--gold);border-color:var(--gold);font-weight:600}
#btwrap{position:relative;margin:4px 0 10px;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:#3c4a30}
#btc{display:block;width:100%;touch-action:none;cursor:crosshair}
#btmsg{position:absolute;left:8px;bottom:7px;font-size:11.5px;color:#f2ead8;
 background:#000000a8;padding:3px 8px;border-radius:3px;pointer-events:none}
.btbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.unitmk{pointer-events:none}
body.sel #tabs{display:none}
body.sel #ovbtns{display:none}
body.sel #side{width:430px;flex:0 0 430px}
body.sel #end{background:var(--gold);color:#1c1a15;font-weight:700}
body.sel #end:disabled{background:none;color:#ffffff7a;border-color:#ffffff2e}
body.sel .tr:hover{background:var(--panel-2)}
.selrow.on{background:var(--panel-2)}
@media (max-width:860px){body.sel #side{width:100%;flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="shell">
<header id="bar">
 <div id="crest"><span id="imparms2"></span>
  <div><div class="ttl">Rex Romanorum</div><div class="sub" id="reign">The Double Election</div></div></div>
 <div id="stats"></div>
 <div id="endwrap">
  <button id="themeb" title="Light or dark" aria-label="Toggle light or dark">&#9680;</button>
  <button id="end">End Year</button></div>
</header>
<div id="app">
<aside id="side">
 <div id="head"><span id="imparms"></span>
  <div><h1>The Holy Roman Empire, 1200</h1>
  <p id="subt">Pick a claimant to begin.</p></div>
 </div>
 <div id="tabs" role="tablist"></div>
 <div id="body">
  <div class="pane" id="p-realm"></div>
  <div class="pane" id="p-ledger" hidden></div>
  <div class="pane" id="p-standing" hidden></div>
  <div class="pane" id="p-research" hidden></div>
  <div class="pane" id="p-laws" hidden></div>
  <div class="pane" id="p-gov" hidden></div>
  <div class="pane" id="p-diplo" hidden></div>
  <div class="pane" id="p-trade" hidden></div>
  <div class="pane" id="p-mil" hidden></div>
  <div class="pane" id="p-court" hidden></div>
  <div class="pane" id="p-chron" hidden></div>
 </div>
 <div id="legend"></div>
</aside>

 556.5L462.8 562.0L454.0 563.8L449.5 566.8L444.5 568.2L440.5 571.8L436.0 572.8L432.0 576.2L429.5 572.8L422.0 570.8L416.5 568.2L410.0 563.2L397.5 556.2L396.8 555.0L400.2 551.0L403.5 545.2L405.5 545.2L408.0 546.8L411.5 546.8L416.5 543.2L424.5 543.2L434.5 537.8L440.0 536.8L445.0 533.2Z", "c": [430.0, 557.0], "a": 1366, "h": "Ulrich II of Sponheim", "x": "The oldest duchy in the eastern Alps, with a ritual that survives nowhere else: the new duke must come dressed as a peasant to the Prince's Stone at Karnburg and be questioned by a free farmer before he is let through. Ulrich II dies in 1202 and his brother Bernhard, a Staufen loyalist, takes over.", "g": {"half": [{"f": "#d6a62c", "ch": ["pass3", "#1e1c19"]}, {"f": "#b3272d", "o": [["fess", "#efe9da"]]}]}}, {"n": "March of Carniola", "r": "C", "d": "M461.5 562.2L466.0 562.2L473.5 566.2L487.5 569.8L491.8 574.0L493.8 579.5L492.5 580.2L475.8 582.0L464.8 623.0L464.0 624.2L452.0 630.2L451.0 629.8L451.5 628.2L455.0 626.2L458.2 623.0L458.2 620.5L457.2 619.0L453.5 613.8L450.5 613.8L447.0 617.2L439.5 614.2L436.0 614.2L432.5 619.2L428.0 618.2L421.5 623.8L420.8 623.5L420.8 621.0L423.8 615.5L423.8 604.0L431.8 576.5L436.0 572.8L440.5 571.8L446.5 567.2L449.5 566.8L454.0 563.8L461.5 562.2Z", "c": [450.5, 591.5], "a": 2533, "h": "The counts of Andechs, dukes of Merania", "x": "A Slovene-speaking frontier march rather than a full duchy, held in 1200 by the Andechs family, who also style themselves dukes of Merania on the Adriatic. The Andechs are about to overreach badly: in 1208 two of them are accused of murdering King Philip and the family is outlawed.", "g": {"f": "#efe9da", "ch": ["eagle", "#27509b"]}}, {"n": "County of Tyrol", "r": "C", "d": "M332.5 498.2L335.2 500.5L336.5 503.2L337.8 503.0L338.2 500.0L339.5 498.8L342.5 498.2L344.2 500.5L344.2 504.5L347.5 507.8L354.0 510.8L358.5 514.8L365.0 512.8L369.5 514.2L370.2 515.0L369.8 520.0L377.8 532.5L382.0 537.8L388.5 541.2L390.8 543.5L394.2 551.5L396.8 555.0L395.2 558.0L392.5 560.8L38 9da"]]}]}}, {"n": "Duchy of Bavaria", "r": "D", "d": "M407.0 360.8L413.2 369.5L420.2 376.5L422.2 381.5L427.2 387.0L429.2 391.0L438.8 399.5L441.2 406.0L447.2 410.5L450.2 417.5L456.8 423.0L457.2 426.0L455.8 430.0L455.8 433.5L456.8 436.5L456.8 441.0L460.8 455.0L460.8 478.0L455.5 478.2L450.0 476.8L441.0 477.2L436.5 480.2L431.0 481.8L424.0 485.2L417.5 492.8L413.0 494.8L410.0 497.2L408.0 498.2L405.5 498.2L402.5 496.8L396.5 497.8L393.5 499.8L385.5 508.8L382.5 509.2L378.0 508.2L373.0 511.8L370.0 514.8L367.5 513.2L362.5 513.2L358.5 514.8L354.0 510.8L347.5 507.8L344.2 504.5L344.2 500.5L342.5 498.2L339.5 498.8L338.2 500.0L337.8 503.0L336.5 503.2L335.2 500.5L332.0 498.2L330.2 495.5L327.8 489.5L327.8 486.5L330.2 482.0L330.8 469.0L329.2 461.0L333.2 447.0L333.2 441.5L332.2 437.5L329.8 434.0L329.2 427.5L332.5 423.2L337.0 421.2L342.5 421.2L345.2 418.5L348.8 413.5L349.8 405.0L356.0 395.8L373.0 389.2L380.5 384.2L386.0 382.8L392.0 379.2L402.2 370.5L403.8 364.0L407.0 360.8Z", "c": [397.5, 438.0], "a": 13248, "h": "Ludwig I of Wittelsbach", "x": "The Wittelsbachs have held Bavaria for twenty years, since Barbarossa stripped it from Henry the Lion in 1180 and handed it to a loyal count. Ludwig I is a Staufen man and backs Philip of Swabia. The duchy is large but hollow: Salzburg, Regensburg, Passau and the Bavarian bishops are all outside the duke's control.", "g": {"f": "#efe9da", "o": [["lozengy", "#27509b"]]}}, {"n": "Duchy of Swabia", "r": "D", "d": "M264.5 406.2L271.0 413.2L273.0 414.2L287.0 416.2L293.5 420.2L298.5 420.8L303.5 423.2L310.0 424.2L313.2 427.5L315.2 431.5L319.0 434.2L321.5 434.2L326.0 432.2L329.0 433.2L331.2 435.5L333.2 441.5L333.2 447.0L329.2 461.0L330.8 469.0L330.2 482.0L327.8 486.5L328.2 491.0L332.8 500.0L332.8 504.5L330.2 510.5L325.0 514.2L321.0 518.8L317.5 520.8L311.0 527.8L305.0 529.8L302.2 532.5L301.2 537.0L298.0 539.2L294.5 543.8L289.5 546.2L284.8 551.0L282.8 556.0L276.0 562.2L274.0 559.8L270.0 558.2L268.5 556.8L262.8 548.0L265.2 542.0L264.8 540.0L262.5 537.8L257 r to nobody in between. The red and silver rake shown here is the later emblem of that ducal claim, first recorded around 1300.", "g": {"f": "#b3272d", "o": [["points", "#efe9da"]]}}, {"n": "Bishopric of Bamberg", "r": "E", "d": "M355.5 332.2L364.5 332.8L370.0 338.8L374.0 341.2L382.0 348.8L391.5 352.2L399.0 352.8L403.5 355.2L406.8 359.0L406.8 361.0L403.8 364.0L403.2 368.5L400.0 372.8L388.0 381.8L380.5 384.2L376.0 387.8L367.0 391.8L358.5 394.2L356.0 395.8L350.0 404.2L343.5 401.8L340.8 399.0L337.2 391.5L335.8 381.5L335.8 374.5L331.2 368.0L330.2 364.5L330.8 360.5L333.2 355.0L331.8 341.5L338.0 337.2L344.5 336.2L355.5 332.2Z", "c": [360.5, 365.5], "a": 3336, "h": "Elected prince-bishops", "x": "Bamberg was built from scratch in 1007 out of Emperor Henry II's own family lands, deliberately made to answer straight to Rome rather than to any German archbishop. That independence is why it survives as a state when the dukes around it do not.", "g": {"f": "#d6a62c", "ch": ["lion", "#1e1c19"], "ov": [["bendlet", "#efe9da"]]}}, {"n": "Palatinate of the Rhine", "r": "C", "d": "M195.0 339.8L200.5 345.8L215.0 352.8L223.0 358.8L228.0 359.8L234.0 363.2L237.5 362.8L241.5 360.8L245.5 361.2L249.5 363.2L252.2 366.0L256.8 374.0L257.8 379.0L262.2 388.0L265.8 401.0L265.0 406.2L255.5 409.2L248.0 409.2L244.0 410.2L238.5 413.8L235.0 417.8L232.5 419.2L229.0 419.2L226.5 418.2L223.5 418.8L221.8 420.5L220.2 425.0L218.5 426.8L213.5 426.8L208.5 429.8L206.5 429.8L204.0 428.8L198.0 421.8L194.5 421.2L190.5 422.8L186.0 422.8L185.2 422.0L187.2 418.5L187.2 417.0L185.2 413.5L179.2 408.0L180.2 403.0L184.8 395.0L186.8 387.5L189.0 385.2L199.0 380.8L204.5 376.8L208.2 373.0L210.2 369.0L209.2 365.5L196.8 352.5L195.2 348.0L195.0 339.8Z", "c": [229.0, 389.0], "a": 4161, "h": "Henry V the Welf", "x": "In 1200 the Palatinate is Welf, not Wittelsbach. Henry V is the eldest son of Henry the Lion and the elder brother of Otto IV, so the office of imperial deputy, with its vote in royal elections, sits in enemy hands as far as the Staufen are concerned. The Wittelsbachs only get it in 1214.", "g": {"f": "#1e1c19", "ch": ["lion", "#d6a62c"]}}, {"n": "Archbishopric of Mainz", "r": "E", "d": "M242.0 296.2L254.8 296.5L255.2 299.5L259.2 305.5L259.2 312.5L264.2 318.0L264.2 320.5L262.2 327.5L260.0 329.8L254.8 332.0L252.2 338.0L252.2 342.0L253.8 345.0L255.8 354.0L254.8 364.0L256.8 370.5L256.8 373.5L255.8 373.0L252.2 366.0L248.0 362.2L241.5 360.8L235.5 363.2L232.5 362.8L228.0 359.8L223.0 358.8L215.0 352.8L200.5 345.8L194.8 339.5L194.8 335.5L202.8 328.0L208.2 317.5L211.0 314.8L216.5 313.8L221.0 310.2L226.0 308.2L234.5 302.2L239.0 296.8L242.0 296.2Z", "c": [229.0, 333.5], "a": 2971, "h": "Conrad of Wittelsbach, until his death in 1200", "x": "Mainz is the senior church of Germany, its archbishop is arch-chancellor and he convenes the royal election and votes first. Conrad dies in October 1200 and the chapter promptly splits, electing two rival archbishops, one for each side of the civil war. The scattered lands run from the Rhine to the Eichsfeld two hundred miles away.", "g": {"f": "#b3272d", "ch": ["wheel", "#efe9da"]}}, {"n": "Archbishopric of Trier", "r": "E", "d": "M175.5 325.2L181.5 325.2L186.0 326.2L194.8 335.0L195.8 350.5L198.8 355.0L209.2 365.5L210.2 369.0L208.2 373.0L204.5 376.8L199.0 380.8L189.0 385.2L186.8 387.5L184.8 395.0L180.2 403.0L179.0 407.8L174.5 406.2L167.5 405.8L164.0 408.2L160.5 409.2L157.0 407.8L141.5 407.2L140.8 406.5L147.2 393.5L146.2 386.0L146.8 380.0L151.2 374.5L153.8 364.0L157.2 359.0L156.0 356.8L152.8 355.5L152.2 349.5L148.8 345.0L145.8 338.0L143.2 335.0L143.2 333.5L144.8 331.0L148.0 328.2L158.5 329.2L164.5 326.2L169.0 327.2L175.5 325.2Z", "c": [178.5, 365.5], "a": 3721, "h": "Archbishop John I", "x": "The third ecclesiastical elector and arch-chancellor for the kingdom of Burgundy, a title with almost no content left. Trier's real income is Moselle wine and the tolls charged on everything moving down the river.", "g": {"f": "#efe9da", "o": [["cross", "#b3272d"]] ty-two year reign, switching between Philip and Otto as it suits him and selling his support to both.", "g": {"f": "#1e1c19", "ch": ["lion", "#d6a62c"]}}, {"n": "County of Flanders", "r": "C", "d": "M75.5 267.2L84.0 272.2L84.8 276.0L84.8 281.5L80.8 288.5L80.8 294.0L77.8 303.0L77.2 314.5L78.8 320.5L72.0 328.2L66.5 330.8L57.8 317.5L54.2 312.0L54.2 276.5L55.5 275.8L61.5 275.8L67.0 277.8L73.5 278.2L78.5 275.8L78.5 273.2L71.0 275.2L67.0 273.2L62.8 272.5L75.5 267.2Z", "c": [67.5, 291.5], "a": 1311, "h": "Baldwin IX", "x": "Flanders is held from the French king in the west and from the emperor east of the Scheldt, which lets the count play one against the other. Baldwin takes the cross in 1200 and sails on the Fourth Crusade; in 1204 the army sacks Constantinople instead and elects him its emperor. He dies a Bulgarian prisoner within the year.", "g": {"f": "#d6a62c", "ch": ["lion", "#1e1c19"]}}, {"n": "County of Hainaut", "r": "C", "d": "M79.0 320.2L85.8 331.5L93.0 339.8L98.2 343.5L102.8 351.0L103.2 354.0L100.8 357.0L99.8 360.0L98.8 369.5L103.2 378.5L103.2 381.0L102.5 381.2L99.2 377.5L88.8 365.5L66.8 331.5L67.0 330.2L72.0 328.2L79.0 320.2Z", "c": [92.0, 352.0], "a": 846, "h": "Baldwin VI, the same man", "x": "Hainaut is imperial where Flanders is mostly French, and in 1200 one man holds both. Its own arms at this date are the gold and black chevrons used since Baldwin V; the quartered lions of Flanders and Holland only arrive in 1299, after the counties are joined for good.", "g": {"f": "#d6a62c", "o": [["chevronny", "#1e1c19"]]}}, {"n": "County of Holland", "r": "C", "d": "M140.0 203.2L140.8 209.0L144.8 214.5L143.2 222.5L144.2 225.5L148.2 231.0L147.2 235.0L147.2 240.0L149.2 242.5L146.5 245.2L142.0 243.2L140.0 243.2L136.0 245.2L133.2 248.5L133.8 254.0L119.0 261.8L107.0 276.8L95.5 275.8L93.5 275.8L89.0 273.8L87.2 272.0L86.5 269.2L83.5 268.2L80.2 265.5L86.5 262.8L117.2 239.5L140.0 203.2Z", "c": [135.0, 233.0], "a": 1677, "h": "Count Dirk VII", "x": "Mostly peat bog and water. The counts expand by draining it, which turns out to be a trap, because drained peat shrinks and sinks and the sea comes back for it. Dirk VII dies in 1203 leaving only a daughter, and Holland tears itself apart in the Loonse War.", "g": {"f": "#d6a62c", "ch": ["lion", "#b3272d"]}}, {"n": "Bishopric of Utrecht", "r": "E", "d": "M197.5 155.2L198.8 155.5L202.8 162.0L205.8 171.5L209.8 175.5L210.2 181.0L204.8 188.5L204.2 196.0L203.2 198.0L197.5 203.8L195.5 204.8L192.2 209.0L191.2 217.0L184.2 230.0L182.2 235.5L181.5 236.2L176.0 236.2L173.0 237.2L166.0 237.2L160.0 238.8L155.5 241.2L150.0 242.2L148.2 241.5L147.2 239.0L148.2 231.0L143.8 224.5L143.2 221.5L144.8 214.5L140.8 209.0L140.2 203.0L187.0 161.8L192.5 158.2L194.0 160.2L199.5 161.8L199.8 159.5L196.8 157.0L197.5 155.2ZM140.0 243.2L143.5 243.8L145.8 245.5L137.5 252.2L133.5 253.8L133.2 248.5L136.0 245.2L140.0 243.2Z", "c": [168.0, 210.0], "a": 3406, "h": "Bishop Dirk van Are", "x": "The biggest church state in the Low Countries, holding two separate blocks of land with the county of Holland sitting awkwardly between them. Permanently short of money and slowly being squeezed by its lay neighbours.", "g": {"f": "#efe9da", "o": [["cross", "#b3272d"]]}}, {"n": "Duchy of Guelders", "r": "C", "d": "M176.0 236.2L181.5 236.2L181.2 238.0L174.5 246.8L169.5 249.8L159.2 259.5L158.2 262.0L158.2 266.0L157.0 268.2L149.0 270.8L143.5 278.8L136.0 282.2L132.2 289.0L126.0 295.8L120.5 293.2L118.2 290.5L115.2 285.0L107.2 276.5L119.0 261.8L136.0 253.2L142.0 249.2L150.5 241.8L155.5 241.2L160.0 238.8L166.0 237.2L173.0 237.2L176.0 236.2Z", "c": [127.0, 272.5], "a": 1682, "h": "Count Otto I", "x": "Still a county in 1200 and not raised to a duchy until 1339. Its counts hold the Rhine and Meuse crossings and make their living fighting Brabant and Holland over tolls. The famous gold lion is not theirs yet: until 1236 the arms are three red cinquefoils on gold.", "g": {"f": "#d6a62c", "ch": ["cinq3", "#b3272d"]}}, {"n": "Julich, Berg and Cleves", "r 245.8Z", "c": [316.5, 281.5], "a": 6506, "h": "Landgrave Hermann I", "x": "Hermann keeps the most famous court in Germany at the Wartburg, where Walther von der Vogelweide and Wolfram von Eschenbach are both writing. He is also the most shameless turncoat of the civil war, changing sides between Philip and Otto at least four times, each time for payment.", "g": {"f": "#27509b", "ch": ["lionbarry", "#efe9da", "#b3272d"]}}, {"n": "Margraviate of Meissen", "r": "M", "d": "M376.0 267.2L378.5 267.8L386.0 271.8L395.0 271.2L400.5 276.8L403.0 277.8L407.5 277.8L411.0 276.2L417.0 275.2L426.0 281.2L436.0 281.2L444.5 286.2L449.5 292.2L454.8 294.0L452.0 297.8L446.5 299.2L443.8 302.0L437.2 315.0L433.8 319.0L432.2 324.5L422.0 330.8L419.8 333.0L417.5 337.8L413.2 337.5L409.5 337.8L407.8 339.0L407.2 344.5L406.2 346.5L399.0 352.8L394.0 352.8L382.0 348.8L374.0 341.2L370.0 338.8L357.8 327.0L356.8 321.0L353.2 312.5L352.2 307.0L347.2 301.5L346.2 299.5L346.2 296.0L348.2 292.0L353.0 287.2L363.0 283.8L371.2 274.0L371.8 269.0L376.0 267.2Z", "c": [390.0, 309.5], "a": 5496, "h": "Margrave Dietrich the Oppressed", "x": "The Wettins struck silver at Freiberg in the 1160s and have been buying land with it ever since. Dietrich is fighting his own townsmen in Leipzig in these years, which is where the nickname comes from. This margraviate grows into the electorate and then the kingdom of Saxony.", "g": {"f": "#d6a62c", "ch": ["lion", "#1e1c19"]}}, {"n": "Duchy of Zahringen", "r": "D", "d": "M178.5 467.2L182.0 469.8L187.5 470.2L190.0 471.8L198.2 481.0L206.8 493.5L213.8 499.0L215.2 502.0L224.2 512.0L223.8 515.0L215.8 527.0L215.8 530.0L211.0 527.8L205.0 521.8L192.0 516.2L185.0 514.8L166.2 491.0L163.2 483.5L168.0 479.8L174.0 479.8L175.2 479.0L175.8 472.0L178.5 467.2Z", "c": [186.5, 491.5], "a": 1776, "h": "Berthold V of Zahringen", "x": "A duchy built on town-founding rather than inheritance: Freiburg, Bern in 1191, and a string of others across the Black Forest and the Swiss plateau. Berthold was offered the German crown in 1198 and turned it down for cash. He dies childless in 1218 and the duchy dissolves, which is what eventually leaves room for the Swiss cantons.", "g": {"f": "#d6a62c", "o": [["bend", "#b3272d"]]}}, {"n": "County of Habsburg", "r": "C", "d": "M227.0 511.2L231.0 511.2L237.5 514.8L253.2 529.0L255.2 535.5L257.0 537.2L262.5 537.8L264.8 540.0L265.2 542.0L262.8 548.0L268.2 556.5L270.0 558.2L274.0 559.8L275.2 562.5L268.5 565.8L264.0 566.8L260.0 566.8L254.5 569.8L252.8 568.0L250.8 562.5L244.2 557.5L241.2 552.5L238.0 549.2L233.2 547.5L230.2 540.0L227.0 537.2L220.5 535.2L215.8 530.5L215.8 527.0L216.8 525.0L223.8 515.0L224.2 512.5L227.0 511.2Z", "c": [242.5, 536.5], "a": 1511, "h": "The counts of Habsburg", "x": "In 1200 these are middling Aargau counts named after a castle nobody outside Swabia has heard of, with scattered estates and an advocacy over Murbach abbey. Seventy-three years later the princes elect one of them king precisely because he looks too weak to be a threat.", "g": {"f": "#d6a62c", "ch": ["lion", "#b3272d"]}}, {"n": "County of Savoy", "r": "C", "d": "M233.5 548.2L238.0 549.2L241.2 552.5L244.2 557.5L249.0 560.8L251.8 564.0L252.8 568.0L254.8 570.0L252.2 576.5L252.8 585.5L246.2 592.5L244.8 596.0L242.0 599.2L228.5 607.8L218.8 617.5L217.8 620.5L218.2 626.0L216.8 632.0L215.8 634.0L205.8 643.5L204.8 646.0L203.8 656.0L202.8 657.5L189.5 667.8L186.5 665.8L181.5 664.2L176.2 659.5L173.2 652.5L166.8 645.5L165.2 642.5L164.8 637.0L163.2 632.5L162.0 631.2L153.5 628.8L148.0 628.2L143.0 623.8L140.5 622.8L136.0 623.2L131.0 618.2L127.0 619.2L122.5 619.2L120.0 618.2L117.8 616.0L116.2 612.5L104.8 602.0L105.8 598.0L107.5 597.8L111.5 599.8L114.0 599.8L122.5 593.8L134.5 589.8L144.0 590.2L150.0 596.8L154.0 597.8L159.5 592.2L163.5 590.2L169.0 584.8L180.0 577.8L185.5 576.2L196.5 577.2L202.5 573.2L211.5 570.2L224.5 558.8L227.8 552.5L233.5 548.2Z", "c": [187.5, 611.0], "a": 7375, "h": "Count Thomas I", "x": "Savoy holds both slopes of the western Alps, and therefore the passes, and makes its living taxing everyone who needs to cross. Thomas takes over in 1189 and spends forty years expanding north toward Lake Geneva. The house survives to become kings of Italy in 1861.", "g": {"f": "#b3272d", "o": [["cross", "#efe9da"]]}}, {"n": "County of Burgundy", "r": "C", "d": "M138.0 475.8L142.5 476.8L146.0 480.8L153.0 484.8L157.5 484.8L163.0 483.2L167.2 492.5L171.2 496.5L181.8 511.5L185.0 514.8L192.0 516.2L205.0 521.8L210.0 527.2L215.0 529.8L220.5 535.2L228.0 537.8L230.2 540.0L233.8 548.0L230.0 550.2L227.8 552.5L225.8 557.5L211.5 570.2L202.5 573.2L196.5 577.2L185.5 576.2L180.0 577.8L175.8 580.5L169.0 584.8L163.5 590.2L159.5 592.2L154.0 597.8L150.0 596.8L145.0 590.8L142.0 589.8L134.5 589.8L127.5 591.8L119.5 595.2L114.0 599.8L111.5 599.8L106.2 597.5L124.2 563.5L128.2 521.5L139.2 488.0L139.2 482.0L138.0 475.8Z", "c": [163.5, 544.5], "a": 7877, "h": "Beatrice II, of the Hohenstaufen", "x": "The free county, part of the imperial kingdom of Burgundy rather than of Germany. Her father Otto I, a son of Barbarossa, died in 1200, leaving the county to a child and the Staufen grip on Burgundy looking thin. Its arms at this date are a silver eagle on red; the gold lion only replaces it after 1280.", "g": {"f": "#b3272d", "ch": ["eagle", "#efe9da"]}}, {"n": "Dauphine of Viennois", "r": "C", "d": "M105.0 602.2L116.2 612.5L117.8 616.0L120.0 618.2L122.5 619.2L131.0 618.2L136.0 623.2L142.0 623.2L148.0 628.2L154.0 628.8L158.5 630.8L162.0 631.2L163.2 632.5L164.2 634.5L165.2 642.5L168.2 647.5L174.2 654.0L176.2 659.5L181.5 664.2L186.5 665.8L189.2 667.5L188.2 670.0L184.8 674.0L183.2 681.5L176.8 686.5L173.8 693.0L171.0 694.2L158.0 694.2L151.0 689.2L146.0 688.8L142.0 690.2L135.0 689.8L127.5 691.8L116.5 690.2L104.0 694.2L98.2 693.5L97.2 681.0L103.8 608.0L104.2 603.0L105.0 602.2Z", "c": [132.5, 657.0], "a": 5308, "h": "The counts of Albon", "x": "Imperial on parchment and barely imperial in practice. Its counts have begun using a personal nickname, Dauphin, as a title. In 1349 the last of them sells the whole territory to France, where the title sticks to the French heir.", "g": {"f": "#d6a62c", "ch": ["dolphin", "#27509b"]}}, {"n": "County of Provence", "r": "C", "d": "M146.0 688.8L151.0 689.2L158.0 694.2L171.0 694.2L174.0 692.8L177.2 696.5L176.8 703.5L178.5 706.2L184.0 707.8L187.5 705.2L197.0 703.2L199.2 705.0L202.2 713.5L204.0 715.2L208.8 717.0L207.5 718.2L187.2 726.0L179.2 767.0L162.0 766.2L132.0 764.2L128.5 758.8L121.5 759.2L119.5 758.2L118.5 753.8L113.0 754.2L110.5 756.2L109.0 756.2L108.5 757.2L105.5 757.8L104.2 757.0L98.2 694.0L104.0 694.2L116.5 690.2L127.5 691.8L135.0 689.8L142.0 690.2L146.0 688.8Z", "c": [149.0, 729.0], "a": 6083, "h": "Alfonso II, of the house of Barcelona", "x": "Provence belongs to the Catalan counts of Barcelona in 1200, not to Anjou. The Angevins only arrive in 1246 by marriage. Imperial in theory the whole time, and never once governed from Germany.", "g": {"f": "#d6a62c", "o": [["pales", "#b3272d", 4]]}}, {"n": "Patriarchate of Aquileia", "r": "E", "d": "M396.5 555.8L410.0 563.2L419.0 569.8L429.5 572.8L431.8 575.5L423.8 604.0L423.8 615.5L420.8 621.0L420.8 624.0L412.5 630.8L409.0 632.2L406.5 631.8L406.0 629.8L404.0 629.8L400.8 633.5L399.2 643.0L398.5 644.2L397.2 642.5L395.2 639.0L393.2 631.5L389.2 625.5L385.2 615.5L384.8 600.0L382.8 596.5L373.2 588.0L378.8 583.0L380.2 580.0L384.8 575.0L386.2 571.0L386.2 565.5L387.2 563.5L392.5 560.8L396.5 555.8Z", "c": [404.0, 587.5], "a": 2843, "h": "Patriarch Pellegrino II", "x": "A patriarch rather than a bishop, the title a leftover from the collapse of Roman Italy, ruling Friuli and the road from Germany to the Adriatic. Venice is steadily eating its coastline.", "g": {"f": "#27509b", "ch": ["eagle", "#d6a62c"]}}, {"n": "Commune of Milan", "r": "T", "d": "M287.5 558.8L294.5 558.8L298.2 561.0L300.2 565.0L300.2 568.5L298.2 576.0L293.8 587.0L292.2 596.5L300.2 613.0L303.2 625.0L303.2 631.5L304.8 638.0L303.2 645.5L302.8 659.5L306.2 668.5L303.0 670.2L297.5 671.2L294.5 674.2L289.5 677.2L286.5 678.2L282.5 677.8L277.5 674.2L269.5 670.8L264.5 665.8L259.5 665.2L258.8 664.5L258.8 660.5L261.8 656.0L264.5 652.2L268.0 650.8L269.2 649.0L268.8 645.0L263.5 638.2L259.0 637.8L254.5 638.8L247.5 634.2L241.5 632.2L233.5 633.2L227.5 632.8L223.0 630.8L218.2 626.0L218.2 618.5L228.5 607.8L242.0 599.2L244.8 596.0L246.2 592.5L252.2 586.5L252.8 582.0L251.8 579.0L255.0 569.2L260.0 566.8L268.5 565.8L281.0 559.8L287.5 558.8Z", "c": [268.5, 610.5], "a": 5868, "h": "No ruling house: elected consuls", "x": "Barbarossa razed Milan to the ground in 1162 and the city was rebuilt and back at the head of the Lombard League within a decade. It beat him at Legnano in 1176 and got its self-government written into the Peace of Constance in 1183. In 1200 Milan is governed by consuls and a popular assembly, and the cross it carries is the banner of Saint Ambrose and the League.", "g": {"f": "#efe9da", "o": [["cross", "#b3272d"]]}}, {"n": "Commune of Cremona", "r": "T", "d": "M316.5 634.8L321.0 635.2L326.8 645.0L329.2 653.5L332.8 660.0L332.2 665.0L333.8 670.5L333.2 675.5L328.8 684.5L320.2 689.5L311.2 680.0L309.2 673.0L305.8 668.0L302.8 659.5L303.2 645.5L304.8 637.5L311.5 635.2L316.5 634.8Z", "c": [318.5, 662.0], "a": 1198, "h": "No ruling house: elected consuls", "x": "Cremona is the great imperial city of Lombardy and Milan's permanent enemy, which is why it backed Barbarossa and later Frederick II against the League. Its red and silver bars are the city's historic arms; the arm holding a golden ball, from the legend of Giovanni Baldesio refusing the imperial tribute, is a later addition.", "g": {"f": "#efe9da", "o": [["bars", "#b3272d", 8]]}}, {"n": "Commune of Brescia", "r": "T", "d": "M300.5 567.2L307.5 572.8L314.0 579.8L316.5 580.8L321.5 580.2L324.0 581.2L326.2 583.5L326.8 586.5L325.2 591.0L325.8 595.0L330.0 599.8L332.5 600.8L333.2 602.5L332.8 609.0L329.2 612.5L326.8 618.5L324.8 632.0L322.2 633.5L321.0 635.2L311.5 635.2L306.5 637.2L304.5 637.2L303.8 635.5L303.2 625.0L300.2 613.0L291.8 595.0L300.5 567.2Z", "c": [309.5, 595.0], "a": 1751, "h": "No ruling house: elected consuls", "x": "A League city and one of the most stubborn, which is why Frederick II besieges it for months in 1238 and fails to take it. Brescia's blue lion on silver is one of the few Lombard civic arms that is not a cross.", "g": {"f": "#efe9da", "ch": ["lion", "#27509b"]}}, {"n": "Commune of Verona", "r": "T", "d": "M342.5 592.2L353.0 592.8L359.2 596.5L358.8 604.5L359.8 606.5L359.8 610.0L358.8 615.5L350.8 635.0L350.8 639.0L353.8 649.0L348.0 646.2L346.0 645.8L341.0 641.2L336.0 639.2L333.0 636.2L324.8 632.0L326.8 618.5L329.2 612.5L332.8 609.0L332.8 600.0L335.0 596.2L342.5 592.2Z", "c": [341.0, 622.0], "a": 1284, "h": "No ruling house: elected consuls", "x": "Verona controls the Adige and therefore the road down from the Brenner, which makes it the first Italian city any German army meets. In 1200 it is still a commune; the della Scala family only take it over in 1262. Its gold cross on blue is modern, the white cross on red is the League commune's.", "g": {"f": "#b3272d", "o": [["cross", "#efe9da"]]}}, {"n": "Commune of Mantua", "r": "T", "d": "M324.5 632.2L333.0 636.2L336.0 639.2L341.0 641.2L346.0 645.8L351.0 647.2L353.8 649.5L355.2 655.0L349.2 660.0L345.0 669.2L333.2 675.0L333.8 670.5L332.2 665.0L332.8 660.0L329.2 653.5L326.8 645.0L321.2 636.0L321.8 634.0L324.5 632.2Z", "c": [341.0, 654.0], "a": 667, "h": "No ruling house: elected consuls", "x": "Ringed by the lakes of the Mincio and so almost impossible to besiege. A League city, and proud enough of being Virgil's birthplace that his head is later added to the civic arms beside the cross.", "g": {"f": "#efe9da", "o": [["cross", "#b3272d"]]}}, {"n": "Commune of Padua", "r": "T", "d": "M372.5 588.2L374.0 588.2L376.5 590.2L382.8 596.5L384.8 600.0L385.2 615.5L388.8 624.5L393.2 631.5L395.2 639.0L398.2 643.5L400.2 649.0L403.2 652.5L401.8 664.5L402.2 670.0L401.0 670.2L400.5 671.8L398.5 671.2L395.0 667.8 {i:"agr",n:"Agriculture",tiers:[
 [{i:"agr1a",n:"Three-Field Rotation",t:2,d:"Winter grain, spring grain, fallow. A third of the arable rests instead of half.",e:{food:7,cap:1}},
  {i:"agr1b",n:"Heavy Mouldboard Plough",t:2,d:"Eight oxen and an iron share turn the wet clay soils north of the uplands.",e:{food:6,goods:3}}],
 [{i:"agr2a",n:"Horse Collar and Nailed Shoe",t:2,d:"A horse pulls from the shoulder, not the throat, and works faster than oxen.",e:{food:5,goods:4}},
  {i:"agr2b",n:"Marling and Liming",t:2,d:"Chalk and clay carted onto sour fields. Tedious, and it doubles a bad acre.",e:{food:6,cap:1}}],
 [{i:"agr3a",n:"Assarting and Forest Clearance",t:3,d:"New fields cut from the waste. The lord grants easier terms to whoever clears them.",e:{food:6,cap:2,pop:3}},
  {i:"agr3b",n:"Legume Fodder Crops",t:2,d:"Peas, beans and vetch feed beasts through winter and quietly fix the soil.",e:{food:7,pop:2}}],
 [{i:"agr4a",n:"Polder and Dyke Drainage",t:3,d:"The Hollanders ditch the marsh, bank it, and farm land that was sea.",e:{food:8,cap:2,goods:3}},
  {i:"agr4b",n:"Terraced Vineyards",t:3,d:"Dry-stone terraces on the Rhine and Mosel slopes. Wine pays far better than rye.",e:{goods:7,mkt:4}}],
 [{i:"agr5a",n:"Selective Stock Breeding",t:3,d:"Kept studs and culled runts. Bigger draught horses, heavier fleeces.",e:{food:6,goods:5,land:2}},
  {i:"agr5b",n:"Watermeadow Irrigation",t:3,d:"Sluices flood the meadow in winter so the first hay comes weeks early.",e:{food:8,cap:1}}]]},
{i:"nav",n:"Naval",tiers:[
 [{i:"nav1a",n:"Clinker Hull and Steering Oar",t:2,d:"Overlapped planks, a side-hung oar. The hull every northern shipwright already knows.",e:{nav:4,unit:["cog"]}},
  {i:"nav1b",n:"Coastal Pilotage",t:1,d:"Soundings, landmarks and a lead line, kept in the head of one old man per port.",e:{nav:3,mkt:3}}],
 [{i:"nav2a",n:"Stern-Mounted Rudder",t:2,d:"A pintle rudder on the centreline. One man steers what three could not.",e:{nav:5}},
  {i:"nav2b",n:"Cog Hull",t:2,d:"Flat bottom, high sides, one square sail, enormous hold. The ship that makes the Baltic trade.",e:{nav:5,mkt:6}}],
 [{i:"nav3a",n:"Mariner's Compass",t:3,d:"A magnetised needle on straw in a bowl. Sailing weeks that used to be impossible.",e:{nav:6,mkt:5}},

 [{i:"nav4a",n:"Lateen-Rigged Galley",t:3,d:"The Mediterranean rig: fast, weatherly, and it can hold a line of battle.",e:{nav:7,unit:["gal"],doct:["dgal"]}},
  {i:"nav4b",n:"Portolan Chart",t:3,d:"Coastlines drawn true and ruled with rhumb lines. Genoese pilots will not sell them.",e:{nav:5,mkt:7}}],
 [{i:"nav5a",n:"Carvel Framing",t:3,d:"Frame first, planks laid flush. A bigger, stiffer, cheaper hull.",e:{nav:7,mkt:5}},
  {i:"nav5b",n:"Deep-Water Cog",t:3,d:"Castles fore and aft, two hundred tons. It carries an army or blockades a river mouth.",e:{nav:8,doct:["dblock"]}}]]},
{i:"prd",n:"Production",tiers:[
 [{i:"prd1a",n:"Guild Charter",t:2,d:"Sworn masters set the standard and the price, and keep everyone else out.",e:{goods:6,serv:3,law:["lguild"]}},
  {i:"prd1b",n:"Fulling Mill",t:2,d:"Water-driven hammers beat the cloth. The work of twenty men in a trough.",e:{goods:7}}],
 [{i:"prd2a",n:"Blast Bloomery",t:2,d:"Taller stack, stronger draught, a bloom too big for one smith to lift.",e:{goods:7,land:2}},
  {i:"prd2b",n:"Vertical Loom Workshop",t:2,d:"Treadle looms under one roof. Flanders and Brabant live on this.",e:{goods:8,mkt:4}}],

 [{i:"prd4a",n:"Tanning and Dyeworks",t:3,d:"Woad, madder, alum. The stinking trades that make cloth worth carting.",e:{goods:7,mkt:6}},

 [{i:"prd5a",n:"Blast Furnace",t:3,d:"Cast iron run off in quantity. Everything made of metal gets cheaper at once.",e:{goods:10,land:3,sie:4}},
  {i:"prd5b",n:"Spinning Wheel",t:3,d:"The distaff put on a wheel. Thread, and therefore cloth, trebles.",e:{goods:9,mkt:5}}]]},
{i:"eng",n:"Energy",tiers:[
 [{i:"eng1a",n:"Undershot Watermill",t:1,d:"A wheel in the current. Every river in the Empire can turn one.",e:{goods:5,food:4}},
  {i:"eng1b",n:"Draught Animal Gearing",t:2,d:"A horse walking in a circle, geared up. Power where there is no river.",e:{goods:4,food:3}}],
 [{i:"eng2a",n:"Overshot Watermill",t:2,d:"Water dropped onto the wheel from a leat. More than twice the work.",e:{goods:7,food:4}},

 [{i:"eng3a",n:"Post Windmill",t:3,d:"The whole mill swings on a post to face the wind. The flat north gets power at last.",e:{goods:7,food:5}},
  {i:"eng3b",n:"Tide Mill",t:2,d:"A pond filled by the flood tide and emptied through the wheel. Two grindings a day.",e:{goods:5,food:3}}],
 [{i:"eng4a",n:"Dammed Millpond and Leat",t:3,d:"Water stored and released. The mill no longer stops in August.",e:{goods:8,food:5}},
  {i:"eng4b",n:"Crank and Connecting Rod",t:3,d:"Turning made into pushing. The hardest idea in the whole mill.",e:{goods:7,sie:3}}],
 [{i:"eng5a",n:"Tower Windmill",t:3,d:"Stone tower, rotating cap. It stands a century and takes a gale.",e:{goods:9,food:6}},
  {i:"eng5b",n:"Multi-Geared Mill Race",t:3,d:"One head of water driving four trades in sequence down the same stream.",e:{goods:10,serv:4}}]]},
{i:"sie",n:"Siege",tiers:[
 [{i:"sie1a",n:"Mangonel",t:2,d:"Torsion or traction, a crew of ten, and it will break a hoarding.",e:{sie:5,unit:["siege"]}},
  {i:"sie1b",n:"Siege Mining",t:2,d:"A gallery under the wall and a fire under the props. Slow, and it always works.",e:{sie:5,doct:["dmine"]}}],
 [{i:"sie2a",n:"Counterweight Trebuchet",t:3,d:"A box of stones and a long arm. It knocks down curtain wall in days.",e:{sie:9,doct:["dbatt"]}},
  {i:"sie2b",n:"Belfry and Ram",t:2,d:"A covered tower rolled to the ditch. Expensive, and it takes a gate.",e:{sie:6,land:2}}],

 [{i:"sie5a",n:"Machicolation and Murder Hole",t:3,d:"Openings to drop stone and fire on anyone at the foot of the wall.",e:{def:12}},
  {i:"sie5b",n:"Mobile Bridging Train",t:3,d:"Pontoons and prefabricated spans carted with the host. Rivers stop being frontiers.",e:{sie:6,land:5}}]]},
{i:"lnd",n:"Land",tiers:[
 [{i:"lnd1a",n:"Mailed Lance Charge",t:2,d:"Couched lance, high saddle, knee to knee. In 1200 this still decides battles.",e:{land:7,unit:["mil"],doct:["dcharge"]}},
  {i:"lnd1b",n:"Feudal Levy Muster",t:1,d:"Forty days' service owed for a fief, and a clerk who knows exactly who owes it.",e:{land:4,unit:["serj"],doct:["dhost"]}}],
 [{i:"lnd2a",n:"Great Helm and Surcoat",t:2,d:"The face enclosed. Safer, blinder, and the reason arms are painted on everything.",e:{land:6}},

 [{i:"lnd3a",n:"Transitional Plate",t:3,d:"Iron plates over the mail at knee, elbow and breast. The slow end of the mail age.",e:{land:8}},

 [{i:"lnd4a",n:"Mounted Serjeanty",t:3,d:"Paid light horse that scouts, raids and screens, and does not expect a share of glory.",e:{land:6,doct:["dchev"]}},

 [{i:"lnd5a",n:"Combined Horse and Foot",t:3,d:"Crossbows to break the line, spears to hold it, knights into the gap.",e:{land:10,doct:["dcomb"]}},
  {i:"lnd5b",n:"Standing Retinue",t:3,d:"Household troops paid all year. Small, and it never has to be summoned.",e:{land:8,stab:4,upk:5}}]]},

{i:"thk",n:"Thinking",tiers:[
 [{i:"thk1a",n:"Cathedral School",t:4,d:"Grammar, rhetoric and logic taught beside the choir. Clerks come out of it.",e:{slot:1,serv:4}}],
 [{i:"thk2a",n:"Scholastic Method",t:5,d:"The question, the objections, the resolution. Disagreement made into a procedure.",e:{serv:5,corr:3,sol:3}}],
 [{i:"thk3a",n:"Studium Generale",t:6,d:"A school that teaches anyone, from anywhere, and grants a licence to teach.",e:{slot:1,serv:6,gen:4}}],
 [{i:"thk4a",n:"Aristotelian Recovery",t:6,d:"The Physics and Metaphysics back from Arabic and Greek. Everything has to be re-argued.",e:{serv:6,gen:5,sol:4}}],
 [{i:"thk5a",n:"University Charter",t:7,d:"Masters and scholars incorporated, with privileges no bishop can revoke.",e:{slot:1,serv:8,gen:6,law:["luniv"]}}]]},
{i:"gov",n:"Government",tiers:[
 [{i:"gov1a",n:"Chancery Writ",t:2,d:"Orders written, sealed and copied, so they survive the messenger.",e:{corr:4,acc:4}},
  {i:"gov1b",n:"Imperial Diet",t:2,d:"The Hoftag: the princes summoned to one place to be argued with in person.",e:{infl:5,law:["ldiet"]}}],
 [{i:"gov2a",n:"Ministerial Office",t:2,d:"Unfree knights raised to administer. They owe everything to the crown and nothing to a lineage.",e:{corr:5,acc:3,cent:4}},
  {i:"gov2b",n:"Landfriede Proclamation",t:3,d:"A sworn peace of the land, with named penalties for private war.",e:{stab:7,law:["lland"]}}],
 [{i:"gov3a",n:"Written Enfeoffment",t:3,d:"The fief recorded in a charter instead of in the memory of witnesses.",e:{cent:5,corr:4}},

 [{i:"gov4a",n:"Electoral Compact",t:3,d:"Which princes vote, and in what order. Written down before the next vacancy.",e:{elec:10,law:["lelect"]}},

  {i:"gov5b",n:"Permanent Chancery",t:4,d:"A chancery with a building, an archive and a staff that outlives the chancellor.",e:{corr:8,acc:6,cent:5}}]]},
{i:"spc",n:"Space",tiers:[]},
{i:"eco",n:"Economic Theory",tiers:[
 [{i:"eco1a",n:"Coinage Regalia",t:2,d:"The right to strike coin, and the profit in the difference between metal and face.",e:{tax:6,mkt:5}},
  {i:"eco1b",n:"Market Peace",t:1,d:"Violence in the market place is an offence against the crown, not the victim.",e:{mkt:6,serv:4}}],
 [{i:"eco2a",n:"Bill of Exchange",t:3,d:"Pay in Milan, collect in Cologne. Money moves without a cart or an escort.",e:{mkt:8,serv:5}},
  {i:"eco2b",n:"Double-Entry Tally",t:2,d:"Every entry twice, and the books must balance. Theft becomes visible.",e:{corr:7,tax:4}}],
 [{i:"eco3a",n:"Commenda Partnership",t:3,d:"One partner puts up capital, the other the voyage. Loss is shared and limited.",e:{mkt:9,serv:5}},

 [{i:"eco4a",n:"Marine Insurance",t:3,d:"The risk of the voyage sold separately from the cargo.",e:{mkt:8,serv:6}},

 [{i:"eco5a",n:"Consolidated Debt",t:4,d:"Many loans made into one fund with a fixed charge. Credit becomes permanent.",e:{debt:3,mkt:9,coin:-4}},
  {i:"eco5b",n:"Exchange Fair",t:3,d:"Fixed fairs where debts across the whole Empire are set against each other and cleared.",e:{mkt:11,serv:7}}]]},
{i:"soc",n:"Society",tiers:[
 [{i:"soc1a",n:"Cathedral Chapter",t:2,d:"A corporation of canons with lands, a school and a vote in the bishop's election.",e:{stab:5,pap:4}},
  {i:"soc1b",n:"Vernacular Minnesang",t:2,d:"Court poetry in German instead of Latin. The nobility begin to have a culture of their own.",e:{sol:5,infl:4}}],
 [{i:"soc2a",n:"Mendicant Orders",t:3,d:"Friars who own nothing and preach in the towns. They reach people the parish never did.",e:{stab:6,unr:-6,pap:6}},
  {i:"soc2b",n:"Chivalric Code",t:2,d:"Rules for how armed men treat each other, and licence for how they treat everyone else.",e:{land:4,stab:4,sol:3}}],
 [{i:"soc3a",n:"Canon Law Reception",t:3,d:"Gratian's Decretum studied and applied. The Church has a working legal system.",e:{pap:7,corr:4,law:["lcler"]}},
  {i:"soc3b",n:"Confraternity",t:2,d:"Lay brotherhoods for burial, charity and candles. Townsmen organised without a guild.",e:{stab:6,unr:-5,sol:4}}],
 [{i:"soc4a",n:"Gothic Rayonnant",t:3,d:"Wall replaced by glass and tracery. A cathedral becomes a century-long public work.",e:{sol:7,stab:5,prs:8}},
  {i:"soc4b",n:"Vernacular Law Code",t:3,d:"The Sachsenspiegel and its like: custom written down in the language spoken.",e:{stab:7,cent:4,law:["lcode"]}}],
 [{i:"soc5a",n:"Civic Humanism",t:4,d:"The town as a thing worth loving and dying for, argued in Latin and in Italian.",e:{sol:8,serv:6,unr:-5}},
  {i:"soc5b",n:"Charter of Safe Conduct",t:3,d:"Protection extended by name to merchants, Jews and pilgrims crossing the realm.",e:{mkt:8,stab:5,law:["lsafe"]}}]]},
{i:"inf",n:"Infrastructure",tiers:[
 [{i:"inf1a",n:"Stone Bridge",t:2,d:"A bridge with a chapel on it and a toll at each end. It reroutes a whole region's trade.",e:{acc:7,mkt:5}},

 [{i:"inf2a",n:"Town Wall Circuit",t:3,d:"A walled town is a different kind of place, legally and militarily.",e:{def:7,serv:5,stab:4}},

 [{i:"inf3a",n:"Canal and Lock",t:3,d:"A cut with gates, so a barge can climb. Bulk goods reach inland towns.",e:{acc:8,mkt:6}},

 [{i:"inf4a",n:"Harbour Mole",t:3,d:"A stone arm into the sea. Ships load in weather that used to keep them out.",e:{mkt:8,nav:4,acc:4}},

/* ===================== EVENTS =====================
   One event each turn. Climate loads the dice: a dry decade makes famine
   likelier without making it certain. Scripted entries fire on their year
   whatever else is drawn.

   Presentation rule: an event states the situation and stops. It does not
   narrate the king, decide for him, or tell him how he feels about it.
   ================================================= */

/* Scripted history. These happened. Whether they happen the same way is another matter. */
var HIST=[
{y:1201,i:"h01",ey:"A letter from the Lateran",h:"Innocent III Declares",
 t:"The Deliberatio super facto imperii is read out in consistory and copied to every metropolitan in Germany. The Pope has examined both elections and finds for Otto of Brunswick: Philip is the son of a persecutor of the Church and the nephew of one, and his election was irregular. The document also asserts, at length and with citations, that the right to examine the election belongs to Rome.",
 o:[{n:"Send envoys to Rome",d:"Argue the case in canon law. It costs money and a year.",e:{pap:9,tr:-180,leg:3},r:"The envoys are heard courteously and achieve nothing immediate. The file, however, is now longer and has your side in it."},
    {n:"Appeal to the princes instead",d:"The crown is not the Pope's to give. Say so at a Hoftag.",e:{loyal:7,leg:6,pap:-10},r:"The German princes are more irritated by Roman examination than they are by either claimant. The phrase about the Empire not being a papal fief gets repeated for a century."},
    {n:"Ignore it",d:"A letter is a letter.",e:{pap:-6,leg:-4},r:"The letter is read in every cathedral in Germany regardless. Silence is taken for weakness in some places and dignity in others."}]},
{y:1202,i:"h02",ey:"Venice, the feast of Saint Mark",h:"The Fleet Sails",
 t:"The army of the Fourth Crusade embarks at Venice, deep in debt to the Republic for the shipping. Baldwin of Flanders and Boniface of Montferrat go with it, and so do several hundred knights who owed service in Germany this year. Dandolo has proposed a detour to Zara to settle the account.",
 o:[{n:"Bless the departure",d:"A crusade is a crusade. Be seen to approve.",e:{pap:8,leg:4,land:-5},r:"The blessing is noted in Rome. Two of your more useful vassals are now on a boat and will be unavailable for several years."},
    {n:"Demand they stay",d:"Service is owed here.",e:{pap:-11,loyal:-7,land:4},r:"Most go anyway. Forbidding a crusade is the kind of order that makes a man's vassals wonder about his piety."}]},
{y:1204,i:"h03",ey:"News from the east, and from Cologne",h:"Constantinople Falls",
 t:"The crusade took the city in April and sacked it for three days. Baldwin of Flanders is Emperor of the Greeks. The relics coming west are beyond counting and the price of silk has halved. In the same season Adolf of Altena, Archbishop of Cologne, is reported to be negotiating a change of allegiance, having found that his candidate cannot pay.",
 o:[{n:"Buy Cologne outright",d:"Whatever it takes. The Rhine is the Empire's spine.",e:{tr:-600,loyalR:["Archbishopric of Cologne",95],leg:9},r:"Cologne comes over. The price is remembered, and so is the fact that it could be bought."},
    {n:"Press the claim in Rome against him",d:"Have him deposed instead of bought.",e:{pap:-7,esp:6,loyalR:["Archbishopric of Cologne",35]},r:"A rival is advanced in the chapter. Cologne spends three years at law with itself, which is cheaper than a bribe and slower."},
    {n:"Take the relics instead",d:"Spend the moment on the Church, not on a bishop.",e:{pap:12,prs:9,stab:6,tr:-220},r:"A reliquary arrives and is carried through four cities. The crowds are enormous. Cologne remains for sale."}]},
{y:1208,i:"h04",sd:"ph",ey:"Bamberg, the twenty-first of June",h:"The Count Palatine Draws",
 t:"Otto of Wittelsbach, Count Palatine of Bavaria, has been refused a royal marriage he was promised and has made no secret of his opinion of it. He is at Bamberg this week, in the household, armed, and the chamber where the king rests after the midday meal is reached through one unguarded door.",
 o:[{n:"Double the chamber guard",d:"Quietly. Do not accuse a prince without proof.",e:{tr:-90,esp:5,assassin:-60},r:"Two serjeants sleep across the door. Wittelsbach leaves Bamberg within the week and is outlawed by the autumn Hoftag."},
    {n:"Have him arrested now",d:"On suspicion, on the word of informants.",e:{loyal:-9,assassin:-85,unr:4},r:"He is taken. Several princes observe that arrest on suspicion is a precedent that could reach any of them, and the observation does not go away."},
    {n:"Keep the appointment and the promise",d:"Give him the marriage he was promised.",e:{loyal:6,assassin:-40,cent:-5,prs:-5},r:"The marriage is restored. Wittelsbach is placated, expensively, and the court learns that a threat is a negotiating position."},
    {n:"Change nothing",d:"A king who hides is not a king.",e:{assassin:0,prs:6},r:"Nothing is changed."}]},
{y:1209,i:"h05",ey:"Rome, and the Midi",h:"Two Crowns and a Crusade",
 t:"An imperial coronation is performed in Saint Peter's. In the same year the Pope preaches a crusade against the Cathars of Languedoc and the army that answers is largely northern French. Beziers is stormed in July and the population killed without regard to belief. The County of Provence lies directly in the path of what follows.",
 o:[{n:"Protect Provence",d:"It is imperial land. Say so with troops.",e:{italy:7,pap:-9,loyalR:["County of Provence",70],tr:-300},r:"A garrison and a protest. Provence holds, nominally imperial, and Rome files the obstruction."},
    {n:"Join the crusade",d:"Send knights and take the credit.",e:{pap:14,prs:7,land:-6,tr:-250},r:"Imperial knights ride with the legate. The indulgence is granted and the Midi is wrecked by someone else's army."},
    {n:"Stand aside",d:"The Midi is France's problem and Rome's.",e:{pap:-5,burg:-6},r:"The crusade proceeds. Within twenty years the French crown holds most of the Languedoc, and the imperial claim on the Rhone is quietly worth less."}]},
{y:1210,i:"h06",sd:"ot",ey:"Excommunication",h:"The Pope Changes His Mind",

 o:[{n:"Submit and negotiate",d:"Go to Rome. Swear what has to be sworn.",e:{pap:13,prs:-9,cent:-5},r:"The sentence is lifted on terms. The terms are humiliating and written down."},
    {n:"Defy the sentence",d:"Appeal to a general council against the Pope.",e:{pap:-16,leg:-7,loyal:-8,cent:6},r:"The appeal is ignored in Rome and quoted everywhere else. Several bishops stop attending court."},
    {n:"Buy the German bishops",d:"The sentence is only as strong as the men who read it out.",e:{tr:-520,pap:-7,loyal:5,stab:4},r:"In most of Germany the excommunication is read once, without enthusiasm, and not mentioned again."}]},
{y:1212,i:"h07",ey:"The Alps, late in the year",h:"The Boy from Palermo",
 t:"Frederick, son of Henry VI, is eighteen and has crossed the Alps with a small escort, having slipped past Milan by going round it. He has the Pope's backing, a claim older than either election, and in the towns of Swabia he is being received as the heir of his grandfather. At Eger he is prepared to seal whatever the Church asks for.",
 o:[{n:"Recognise him and bargain",d:"Better an heir who owes you something.",e:{leg:11,pap:7,cent:-7,loyal:6},r:"An accommodation is reached. It holds for as long as both parties find it useful."},
    {n:"Hold the Alpine passes against him",d:"Keep him in Italy.",e:{tr:-440,land:-5,italy:-9,leg:5},r:"The passes are held. He comes round by another road, as he did past Milan."},
    {n:"Have the princes decide",d:"Put it to a Hoftag and abide by it.",e:{loyal:11,leg:7,cent:-9},r:"The princes take their time, extract concessions from both sides, and decide for whoever has conceded more."}]},
{y:1214,i:"h08",ey:"Flanders, the twenty-seventh of July",h:"Bouvines",
 t:"The allied army of the Empire, England and Flanders meets Philip Augustus of France on a narrow front between two marshes near Bouvines. The imperial infantry is largely Brabancon and the French have the better ground and the shorter line. The battle will settle who is emperor and whether England keeps anything in France.",
 o:[{n:"Fight it",d:"The army is assembled and the enemy is in front of it.",e:{battle:"bouvines"},r:""},
    {n:"Refuse battle and withdraw",d:"Keep the army and lose the moment.",e:{leg:-12,prs:-11,land:5,loyal:-7},r:"The army withdraws intact. The alliance dissolves within the year, since its only purpose was this battle."}]},
{y:1215,i:"h09",ey:"The Lateran, in November",h:"The Fourth Council",
 t:"Twelve hundred prelates in Rome. Annual confession made obligatory, a new crusade decreed, heresy defined and the procedure against it set out, and Jews required to be distinguishable in dress. The decrees will be read in every diocese in the Empire within two years.",
 o:[{n:"Publish the decrees in full",d:"All of them, as written.",e:{pap:14,stab:7,sol:-6,unr:5},r:"The Church in Germany is reformed and more orderly. The clauses on dress are enforced unevenly and bitterly."},
    {n:"Publish the reform, delay the rest",d:"Confession and the crusade. Leave the badge.",e:{pap:4,stab:5,mkt:5,sol:3},r:"The chancery finds that the full text requires further study. It is still being studied some years later."},
    {n:"Take the crusade tithe for the crown",d:"The money is being raised in your lands.",e:{tr:800,pap:-15,stab:-5},r:"A great deal of silver reaches the chamber instead of Rome. The complaint is formal, immediate and remembered."}]},
{y:1226,i:"h10",ey:"A charter at Lubeck",h:"Free and Immediate",
 t:"Lubeck petitions for the status of a free imperial city, answerable to the crown alone and to no duke. The Baltic trade is growing beyond anything the founders imagined, and the towns along that coast are watching what answer this gets.",
 o:[{n:"Grant it",d:"A city that owes you directly is worth more than a duke's goodwill.",e:{mkt:12,tax:7,cent:7,loyal:-7,law:"lstadt"},r:"The charter is sealed. Within a generation the same privilege has been asked for, and granted, up and down the coast."},
    {n:"Refuse",d:"Do not undercut the princes.",e:{loyal:9,mkt:-7,cent:-4},r:"The dukes are grateful. The Baltic towns begin to organise among themselves instead, which turns out to matter more."},
    {n:"Sell it",d:"Grant it, for a great deal of money.",e:{tr:900,mkt:8,cent:4,loyal:-5,prs:-4},r:"The charter is sealed and paid for. Every other town now knows the price."}]},
{y:1235,i:"h11",ey:"Mainz, at the Hoftag",h:"The Peace of the Land",
 t:"A general Landfriede is laid before the assembled princes: private war forbidden on oath, feud outlawed, a standing court to hear the cases, and an imperial justiciar to enforce it. It is the most ambitious piece of legislation attempted in the Empire in living memory, and it transfers a right the nobility has held since anyone can remember.",
 o:[{n:"Proclaim it",d:"Peace in the land, enforced by a court.",e:{stab:14,unr:-9,loyal:-9,cent:9,law:"lland"},r:"The peace is sworn. It is broken in places and enforced in more places than anyone expected."},
    {n:"Proclaim a weaker version",d:"Feud restricted rather than abolished. No justiciar.",e:{stab:7,unr:-4,loyal:-3,cent:3},r:"A limited peace, sworn without much argument and kept without much conviction."},
    {n:"Drop it",d:"The princes will not wear it.",e:{loyal:7,stab:-5},r:"The draft is withdrawn. Private war continues, and so does the complaint about it."}]},
{y:1241,i:"h12",ey:"From Silesia and Hungary",h:"Horsemen Out of the East",
 t:"A Mongol army destroyed the Polish and German host at Legnica in April and a second destroyed the Hungarians at Mohi two days later. Both roads into the Empire are now open. The reports agree on the speed, the bows and the fact that neither army got to fight the way it intended to.",
 o:[{n:"Call a general muster",d:"Everything, everywhere, at the eastern marches.",e:{tr:-900,land:11,loyal:7,stab:-5,unr:6},r:"The Empire assembles. The Mongols turn back east that winter for reasons of their own succession, and the muster is remembered as either prudence or panic depending on who is telling it."},
    {n:"Fortify the passes and the river lines",d:"Castles and bridges, not a field army.",e:{tr:-520,def:13,stab:5},r:"Works are begun on the Oder and in the Carpathian approaches. Most of them are finished, which is unusual."},
    {n:"Preach a crusade against them",d:"Make it the Church's war.",e:{pap:9,prs:6,land:5,tr:-180},r:"The crusade is preached and answered thinly. The threat withdraws before the question of whether it would have worked can be settled."}]},
{y:1250,i:"h13",ey:"Apulia, in December",h:"The Wonder of the World Is Dead",
 t:"Frederick II has died at Castel Fiorentino, aged fifty-six, excommunicate, having spent thirty years at war with the Papacy. The Staufen inheritance passes to Conrad, in Germany, and the Church has no intention of letting it rest there. In the German lands there is already more than one party and no agreed king.",
 o:[{n:"Move at once on the crown",d:"Be in Frankfurt before anyone else is.",e:{leg:12,elec:11,tr:-420,loyal:-5},r:"Speed counts for a great deal in an election. So does money, and both are now committed."},
    {n:"Build a coalition first",d:"Slower, and harder to dislodge afterwards.",e:{loyal:12,elec:7,leg:5},r:"The coalition takes a year to assemble and is correspondingly expensive in promises rather than silver."},
    {n:"Let the princes exhaust themselves",d:"Wait. Let them discover they need somebody.",e:{loyal:-5,stab:-9,elec:5,tr:260},r:"They do exhaust themselves. The interregnum that follows is longer and worse than anyone predicts."}]},
{y:1254,i:"h14",ey:"The Rhine towns",h:"The League and the Empty Throne",
 t:"Seventy towns from Basel to Cologne have sworn a league for ten years: the roads kept open, the tolls limited to those lawfully granted, and their own courts to settle disputes between members. They have done this because there is no king doing it. The princes regard the league as an usurpation and the merchants regard the princes as the problem.",
 o:[{n:"Confirm the league",d:"Give it a charter and make it the crown's instrument.",e:{mkt:14,tax:7,cent:7,loyal:-11,stab:7},r:"The league becomes, on paper, a royal institution. The towns accept the charter and continue to do as they were doing."},
    {n:"Dissolve it",d:"Side with the princes against the towns.",e:{loyal:12,mkt:-12,cent:-5,unr:7},r:"The league is declared void. It continues informally, and the tolls go back up."},
    {n:"Say nothing and tax the roads",d:"Let them keep the peace and charge for it.",e:{tr:420,mkt:4,stab:3,prs:-4},r:"Revenue arrives. Both the towns and the princes conclude that the crown has no position, which is accurate."}]},
{y:1257,i:"h15",ey:"Frankfurt, and then Aachen",h:"Elected Twice Again",
 t:"The electors have produced two kings in one year. Richard of Cornwall has English money and four votes; Alfonso of Castile has three, a claim through the Staufen, and no intention of ever crossing the Alps. Neither is in Germany for most of the year. The Empire is being governed, where it is governed at all, by whoever is physically present.",
 o:[{n:"Make a third claim",d:"Both candidates are absentees. Be the one who is here.",e:{leg:14,elec:9,loyal:-9,tr:-520},r:"Presence turns out to be an argument. Not a decisive one, but it is heard."},
    {n:"Sell your vote and your bloc",d:"Take the English silver.",e:{tr:1100,leg:-9,prs:-11},r:"The money is paid in full and promptly, which is more than most electors manage to extract."},
    {n:"Convene the princes to fix the procedure",d:"Settle how this is done, so it stops happening.",e:{elec:16,cent:7,loyal:7,leg:6},r:"A procedure is drafted. It takes another century and a Golden Bull to make it binding, but this is where it starts."}]},
{y:1258,i:"h16",ey:"A summer that did not arrive",h:"The Year Without Warmth",
 t:"A mountain somewhere beyond the known world has thrown enough ash into the air to dim the sun across Europe. The chroniclers record frost in June, a harvest that did not ripen, and bread at four times its price by Candlemas. Nobody connects the dry fog of the previous autumn with the dead crop.",
 o:[{n:"Open the granaries and the treasury",d:"Buy grain wherever it exists and give it away.",e:{tr:-1200,food:12,unr:-14,sol:7,prs:9,stab:7},r:"Grain is bought in Apulia and Poland at a terrible price and distributed. Fewer people die than otherwise would, and it is not nothing."},
    {n:"Fix the price of bread",d:"Cheaper by decree.",e:{unr:-5,mkt:-14,food:-7},r:"The price is fixed. The grain stops arriving in the markets where the price is fixed."},
    {n:"Let the market clear",d:"Grain goes where grain is paid for.",e:{tr:320,unr:16,pop:-9,mkt:7,sol:-9},r:"Supply reaches the towns that can pay. In the countryside the death rate is the highest in sixty years."}]},
{y:1273,i:"h17",ey:"Frankfurt, the first of October",h:"A Poor Count Is Chosen",
 t:"The electors have chosen Rudolf of Habsburg: a competent, landless-looking Swabian count with no great dynasty behind him and no power to frighten anybody. That is why he was chosen. He has announced that he intends to recover the crown lands alienated during the interregnum, which the princes had not expected and do not welcome.",
 o:[{n:"Back the recovery of crown lands",d:"The Reichsgut is the crown's and it is going to be taken back.",e:{tax:14,cent:11,loyal:-14,tr:-320,stab:5},r:"The resumption begins. It works, in the sense that the crown lands come back and the princes never forgive it."},
    {n:"Confirm the princes in what they hold",d:"Buy thirty years of peace with land you were not using.",e:{loyal:16,stab:9,tax:-9,cent:-11},r:"The confirmations are sealed. The crown is poorer and the Empire is quieter."}]},
{y:1291,i:"h18",ey:"Acre, and a valley in the mountains",h:"Two Endings",
 t:"Acre has fallen and the Latin east is finished after two centuries. In the same summer three Alpine valley communities on the Gotthard road swear a mutual defence pact against any outside lord's officers. The first is reported everywhere. The second is recorded in one charter and noticed by nobody.",
 o:[{n:"Preach a new crusade",d:"The Holy Land is lost and must be recovered.",e:{pap:12,prs:9,tr:-620,land:-5},r:"The crusade is preached. Vows are taken, money is collected, and no fleet ever sails."},
    {n:"Send officers into the Alpine valleys",d:"A sworn league among peasants is not a thing that can be allowed.",e:{loyal:5,unr:12,swiss:1,cent:4},r:"The officers go in. The valleys resist, and the resistance is the beginning of something that takes two hundred years to finish."},
    {n:"Confirm the valleys' liberties",d:"They keep the pass open. Let them keep their customs.",e:{acc:7,mkt:7,swiss:-1,cent:-4},r:"The liberties are confirmed by charter. The Gotthard stays open and the valleys stay quiet, for now."}]}
];

{i:"e_harv_b",w:13,c:function(G){return G.clim<5;},ey:"At Michaelmas",h:"A Short Harvest",

{i:"e_plague",w:7,c:function(G){return G.yr>1204;},ey:"From the river towns",h:"Sickness in the Towns",
