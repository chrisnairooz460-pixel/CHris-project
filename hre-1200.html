 o:[{n:"Close the roads and the gates",d:"Stop movement. Accept what it does to trade.",e:{plg:1,mkt:-12,hea:7,unr:6,tr:-160},r:"Movement stops. So does a good deal of the sickness, and a good deal of the revenue."},
    {n:"Send physicians and money",d:"Treat it where it is.",e:{tr:-260,hea:5,unr:-6,sol:4,prs:5},r:"Physicians and alms are sent. The effect on the sickness is debatable and the effect on the towns' loyalty is not."},
    {n:"Leave it to the towns",d:"They have walls and councils of their own.",e:{pop:-6,unr:7,mkt:-4},r:"Each town does as it sees fit. Some close early and do well; others do not."}]},
{i:"e_fire",w:8,ey:"In the night",h:"A City Burns",
 t:"Fire started in a cooper's yard and went through four streets of timber and thatch before the wind dropped. The cathedral roof is gone, the market hall with it, and a quarter of the houses inside the walls. The chapter is appealing for help and so is the council, separately.",
 o:[{n:"Pay for the rebuilding",d:"The crown rebuilds, in stone.",e:{tr:-380,serv:7,stab:7,loyal:7,prs:6},r:"The money is granted and the rebuilding is in stone and tile, which is the part that matters next time."},
    {n:"Grant a toll exemption instead",d:"Let them rebuild out of their own trade.",e:{tax:-5,serv:5,loyal:4,mkt:4},r:"The exemption is granted for ten years. The town rebuilds itself and remembers who let it."},
    {n:"Offer prayers",d:"The treasury is committed elsewhere.",e:{unr:5,loyal:-5,prs:-4},r:"Prayers are offered. The town rebuilds in timber and thatch, because that is what it can afford."}]},
{i:"e_feud",w:13,ey:"A complaint at the Hoftag",h:"Two Princes at War",
 t:"Two of the Empire's princes have taken a boundary dispute over an advowson and three villages into open war. Castles have been burnt on both sides, the roads between them are closed, and each has sent to court for judgment while continuing to campaign.",
 o:[{n:"Judge the case and enforce it",d:"Hear it, decide it, and make the loser comply.",e:{stab:9,cent:7,loyal:-7,tr:-220},r:"Judgment is given and enforced. The loser complies and does not forget which way it went."},
    {n:"Mediate a settlement",d:"Let them both keep something and their faces.",e:{stab:5,loyal:9,cent:-3},r:"A compromise is drafted in which neither side loses and the villages are divided. It holds for about a decade."},
    {n:"Let them fight",d:"They will exhaust each other and come back smaller.",e:{stab:-9,unr:7,loyal:-4,cent:4},r:"They fight for two more seasons. Both are weaker, the roads stay closed, and the crown is seen to have no court worth going to."}]},
{i:"e_silver",g:1,w:6,ey:"From the mountains",h:"A New Lode",
 t:"Prospectors working a stream bed have traced silver to its source and the assay is extraordinary. Word is spreading faster than the claim can be registered, and men are already walking in from three duchies away.",
 o:[{n:"Claim it for the crown",d:"Regalian right. The mine is the king's.",e:{tr:620,tax:9,loyal:-7,unr:5},r:"The mine is taken into the chamber. The local lord petitions, is refused, and the silver is real."},
    {n:"Charter free miners under a royal tenth",d:"Let them dig and take the tenth.",e:{tax:11,goods:7,pop:5,mkt:6},r:"The code is granted. A town grows on the spot inside five years and the tenth comes in every year thereafter."},
    {n:"Grant it to the prince who holds the land",d:"Buy a vassal with something you have not spent.",e:{loyal:14,tax:4,prs:4},r:"The grant is sealed. He is genuinely grateful, which is a thing of limited duration."}]},
{i:"e_herisy",w:8,c:function(G){return G.yr>1202;},ey:"A legate's report",h:"Preachers Without Licence",
 t:"In the Lombard towns and along the upper Rhone there are men preaching poverty, refusing oaths and denying that a priest in sin can consecrate anything. Some are Waldensians and some are Cathars and the legate's report does not reliably distinguish them. They are popular with weavers and with the poor, and several town councils are protecting them.",
 o:[{n:"Hand them to the legate",d:"This is the Church's jurisdiction.",e:{pap:12,unr:9,stab:-5,sol:-5},r:"The inquest proceeds. There are burnings in four towns and the councils that protected them are fined."},
    {n:"Answer them with the friars",d:"Send preachers instead of officers.",e:{pap:6,unr:-7,stab:6,sol:5,serv:4},r:"Dominicans and the new Franciscans are sent to preach in the same squares. It works better than the alternative and more slowly."},
    {n:"Leave the towns to handle it",d:"They know their own weavers.",e:{pap:-11,unr:-4,mkt:5,loyal:5},r:"The towns handle it quietly and mostly by doing nothing. Rome notices the inaction and records it."}]},
{i:"e_jews",w:7,c:function(G){return G.yr>1205;},ey:"From the Rhine cities",h:"A Blood Libel at the Fair",
 t:"A child has been found dead outside a Rhineland city during the fair and a preacher has told the crowd who to blame. The Jewish quarter is behind its own gate with the community's elders at the bishop's door and an armed crowd in the street. The bishop has asked what the crown's position is. Several of the burghers in the crowd owe money in that quarter.",
 o:[{n:"Send the crown's officers to protect the quarter",d:"They are under imperial protection. Enforce it.",e:{tr:-180,stab:7,mkt:9,sol:6,prs:5,unr:5},r:"Serjeants clear the street and the quarter holds. The crown's protection is shown to mean something, and the preacher is expelled."},
    {n:"Order an inquest and hold both sides",d:"Find out what happened before anyone acts.",e:{stab:5,corr:4,unr:3,mkt:4},r:"The inquest finds no case. It takes six weeks, during which the quarter is guarded and the city is tense and nobody dies."},
    {n:"Take the community's property in protection",d:"Protect them, and hold their goods in the chamber.",e:{tr:520,mkt:-9,sol:-7,pap:-4,prs:-7},r:"The quarter survives and its wealth is in the chamber. The arrangement is noticed by every Jewish community in the Empire, and by every creditor."},
    {n:"Leave it to the city",d:"It is their fair and their peace.",e:{unr:9,mkt:-14,sol:-9,prs:-9,stab:-7},r:"The quarter is sacked. The lending that financed three towns' trade stops, and the crown's protection is understood to be a form of words."}]},
{i:"e_flood",w:9,ey:"At the spring thaw",h:"The River Takes the Bank",
 t:"A hard frost followed by a sudden thaw and three days of rain. The river has gone over its banks along forty miles, taken out two bridges and a mill, and changed its channel at one bend, which has left a toll station on dry land and a village in the water.",
 o:[{n:"Rebuild the works",d:"Bridges, banks and the mill.",e:{tr:-300,acc:7,mkt:5,loyal:5},r:"The works are rebuilt and the new channel is banked. The toll station is moved, with complaint."},
    {n:"Order the communities to do it",d:"Dyke duty is owed by whoever holds the land.",e:{acc:4,unr:7,tax:-3},r:"The duty is enforced. The work is done badly in places and the resentment is uniform."},
    {n:"Let the river settle",d:"It will find its own course.",e:{acc:-7,mkt:-5,food:-4},r:"The river settles where it likes. Two fords are lost and the road moves."}]},
{i:"e_legate",w:11,ey:"A legate at court",h:"Rome Sends a Cardinal",
 t:"A cardinal legate has arrived with letters, a household of forty, and authority to hear appeals, confirm elections and absolve or bind. He has asked for a vacant bishopric for a Roman nephew, the publication of three decretals, and an answer on the crusading tenth.",
 o:[{n:"Give him everything asked",d:"The bishopric, the decretals and the tenth.",e:{pap:16,tr:-320,cent:-7,tax:-5},r:"Rome is satisfied and says so in writing. The nephew arrives and does not learn German."},
    {n:"Give the decretals, keep the bishopric",d:"Concede on law, hold on patronage.",e:{pap:5,cent:4,corr:3},r:"A compromise. The legate accepts it as the best available and reports it as less."},
    {n:"Refuse all three",d:"Bishoprics in the Empire are filled in the Empire.",e:{pap:-14,cent:9,loyal:5,prs:5},r:"The legate departs cold. The appointment is made locally and holds, and the file in Rome grows."}]},
{i:"e_guild",w:9,c:function(G){return G.urb>11;},ey:"In the cloth towns",h:"The Weavers Put Down Their Shuttles",
 t:"The fullers and weavers of three cloth towns have stopped work over the price the merchant drapers pay for finished cloth. The drapers control the wool and the export licences; the weavers control whether anything gets woven. The councils are drawn from the drapers.",
 o:[{n:"Arbitrate with a fixed rate",d:"Set the price yourself and bind both sides.",e:{unr:-11,mkt:-5,serv:5,stab:6,sol:5},r:"A rate is fixed and sworn to by both guilds. Neither is satisfied and the looms start again."},
    {n:"Back the drapers",d:"They pay the customs and they run the towns.",e:{tax:9,mkt:7,unr:12,sol:-7},r:"The strike is broken and the leaders exiled. The cloth moves and the towns are sullen."},
    {n:"Charter the weavers as their own guild",d:"Give the craft a legal voice.",e:{unr:-14,serv:9,sol:7,mkt:-4,loyal:-4},r:"The charter is granted. The craft guilds will be a permanent faction in town politics from now on."}]},
{i:"e_pass",w:7,ey:"From the Alps",h:"The Pass Is Shut",
 t:"An avalanche has taken out the road and the hospice at a main Alpine crossing, and the season is turning. The Italian trade is being routed round at a cost that is being passed on in every market north of the mountains. The hospice brothers who survived are asking for means to rebuild before the snows.",
 o:[{n:"Rebuild before winter",d:"At forced pace and forced price.",e:{tr:-340,acc:9,mkt:11,italy:6},r:"The road and the hospice are open by the first snow, at roughly twice what the work should cost."},
    {n:"Rebuild in the spring",d:"Lose a season's trade and pay a fair price.",e:{tr:-150,mkt:-9,acc:5},r:"The work is done properly in the spring. The winter's trade went by another route and some of it stayed there."},
    {n:"Subsidise the alternative route",d:"Pay to move the trade and keep it moving.",e:{tr:-200,mkt:4,acc:3,italy:-4},r:"The trade is redirected. The towns on the new road prosper and lobby to keep it that way."}]},
{i:"e_genius",g:1,w:6,gen:1,ey:"At the cathedral school",h:"An Unusual Mind",
 t:"A master at one of the schools has produced work that the other masters cannot fault and cannot match: a commentary that resolves three standing disputes and a method of calculation that his students are already copying. He has no patron and two offers from outside the Empire.",
 o:[{n:"Take him into the court",d:"A pension, a house and access to the chancery.",e:{tr:-130,genius:1},r:"He accepts and comes to court, where he is productive, expensive and difficult."},
    {n:"Endow a chair for him",d:"Fund the school, not the man.",e:{tr:-240,serv:7,gen:9,sol:4},r:"The chair is endowed. He holds it, and so does whoever follows him, which is the better bargain over fifty years."},
    {n:"Let him go",d:"The chamber has other claims on it.",e:{gen:-5,prs:-4},r:"He leaves for Paris or Bologna and does his work there."}]},
{i:"e_murrain",w:8,c:function(G){return G.clim<20;},ey:"Among the herds",h:"Murrain",
 t:"Cattle plague has gone through the byres of a whole region: the beasts swell, will not eat, and are dead in three days. The draught oxen are dying with the rest, which means the spring ploughing as well as the meat and the milk.",
 o:[{n:"Buy and distribute draught animals",d:"Plough teams from wherever they can be had.",e:{tr:-360,food:7,unr:-7,loyal:5},r:"Oxen and horses are bought in and distributed. The spring sowing happens, mostly."},
    {n:"Order slaughter and burial of infected herds",d:"Hard, and it stops the spread.",e:{food:-5,unr:9,hea:7,sol:-4},r:"The order is enforced with soldiers in some districts. The spread stops and so does any goodwill."},
    {n:"Nothing can be done",d:"It will burn itself out.",e:{food:-11,pop:-5,unr:7},r:"It burns itself out, having gone through four regions and taken most of the plough teams with it."}]},
{i:"e_tourn",w:8,ey:"At the lists",h:"Death at a Tournament",
 t:"A melee at a great tournament got out of hand and a prince's heir is dead, along with four knights and a herald. The dead man's father is at the lists and so is the man whose household did it. The Church has been saying for a century that tournaments should be forbidden.",
 o:[{n:"Hold an inquest and compensate",d:"Find out what happened and pay the wergeld.",e:{tr:-220,stab:6,loyal:7,corr:4},r:"The inquest finds misadventure and the compensation is paid. Both houses accept it, which was not guaranteed."},
    {n:"Ban tournaments",d:"Rome has been asking for this for a hundred years.",e:{pap:9,stab:5,land:-7,loyal:-9},r:"The ban is proclaimed. Tournaments move across the nearest border and the nobility goes to them."},
    {n:"Say nothing",d:"Men die at the lists. That is what the lists are.",e:{loyal:-5,unr:4,land:3},r:"Nothing is said. The two houses settle it between themselves over the following four years, violently."}]},
{i:"e_bishop",w:10,ey:"A disputed election",h:"Two Men in One Cathedral",
 t:"A cathedral chapter has split and elected two bishops. One has the majority of the canons and Rome's sympathy; the other has the lesser number, the city, and the support of the prince whose brother he is. Both have been consecrated. The temporalities of the see are considerable and currently in nobody's hands.",
 o:[{n:"Invest the chapter's choice",d:"Follow the canons and the Pope.",e:{pap:12,loyal:-7,cent:-4,stab:4},r:"The canonical candidate is invested. The prince's brother withdraws to a benefice and the prince does not attend court for two years."},
    {n:"Invest the prince's brother",d:"Follow the prince whose loyalty you need.",e:{loyal:12,pap:-14,cent:5},r:"The invested bishop holds the see by force and is never confirmed in Rome. The see is in schism for a decade."},
    {n:"Hold the temporalities and wait",d:"Take the revenue while they argue.",e:{tr:460,pap:-7,loyal:-5,stab:-5},r:"The revenue comes to the chamber for as long as the dispute lasts, which gives both parties an excellent reason to prolong it."}]},
{i:"e_reliq",g:1,w:7,ey:"An offer",h:"A Relic for Sale",
 t:"A Venetian merchant is offering an arm of a major saint, with a Greek authentication and a provenance that begins in Constantinople in 1204 and is vague before that. A shrine would draw pilgrims from four duchies and the money that comes with them. The price is high and the authentication is the kind that would not survive close examination.",
 o:[{n:"Buy it and build the shrine",d:"Pilgrims, and the trade that follows pilgrims.",e:{tr:-440,prs:11,stab:7,serv:9,mkt:7,pap:4},r:"The shrine is built and the pilgrims come in numbers that pay for it within fifteen years."},
    {n:"Have the provenance examined first",d:"Ask where it was in 1203.",e:{tr:-60,pap:5,corr:4,prs:-3},r:"The examination is inconclusive and the merchant sells it elsewhere, where it is not examined."},
    {n:"Refuse",d:"The Empire does not buy stolen Greek bones.",e:{pap:6,prs:-5},r:"The offer is declined. The relic is in a cathedral two hundred miles away within the year, drawing pilgrims."}]},
{i:"e_bandit",w:9,c:function(G){return G.stab<62;},ey:"On the roads",h:"Castles of Robbers",
 t:"Three minor lords on a stretch of important road have stopped pretending that what they collect is a toll. Merchants are being taken for ransom, the fairs are being avoided, and the towns have begun hiring their own escorts because the crown's peace is not reaching that road.",
 o:[{n:"Throw down the castles",d:"Siege train, and leave the walls on the ground.",e:{tr:-420,stab:11,mkt:9,loyal:-5,cent:6},r:"Three castles are reduced and the lords outlawed. The road is safe and the point is made to everyone holding a castle on a road."},
    {n:"Buy them off with an office",d:"Make them the road's wardens and pay them.",e:{tr:-180,stab:6,mkt:5,corr:-5,loyal:4},r:"They are appointed wardens of the road at a salary. The robbery stops and is now called a wage."},
    {n:"Let the towns deal with it",d:"They have money and an interest.",e:{mkt:-7,unr:5,cent:-5,serv:4},r:"The towns hire companies and clear the road themselves. They conclude that they can do this, which is a lesson with consequences."}]},
{i:"e_wine",g:1,w:7,c:function(G){return G.clim>0;},ey:"From the Rhine",h:"A Vintage Too Large",
 t:"Three good summers running and the Rhine and Mosel cellars are full of wine nobody will buy at last year's price. The growers are petitioning for a restriction on planting and the shippers are petitioning against it.",
 o:[{n:"Buy for the court and the army",d:"The chamber takes the surplus at a fair price.",e:{tr:-180,loyal:7,mkt:5,sol:4},r:"The surplus is bought. The court drinks well for three years and the growers are solvent."},
    {n:"Open new markets with toll relief",d:"Cheaper carriage north and east.",e:{tax:-5,mkt:12,acc:4},r:"Relief is granted on the northern roads. Rhenish wine reaches the Baltic in quantity for the first time."},
    {n:"Restrict new planting",d:"Protect the price by limiting the acreage.",e:{mkt:-5,goods:-4,loyal:5,stab:4},r:"The restriction is proclaimed and partially enforced. The price holds and the vineyards creep up the slopes anyway."}]},
{i:"e_mint",w:8,ey:"At the mint",h:"The Penny Is Light",
 t:"Assays of the pennies coming out of three mints show them well under standard. The mint-masters say the silver price has risen; the merchants say the mint-masters are thieves; the chamber's own accounts suggest both are true. The coin is being refused at the Champagne fairs.",
 o:[{n:"Recoin to standard at the chamber's cost",d:"Call it all in and strike it properly.",e:{tr:-480,mkt:14,coin:-9,prs:7,corr:7},r:"The recoinage is carried out. It is expensive, it takes two years, and the penny is taken at the fairs again."},
    {n:"Hang a mint-master",d:"Make an example and keep the coin as it is.",e:{corr:9,unr:4,mkt:4,prs:4},r:"One mint-master is hanged and the others improve markedly for about five years."},
    {n:"Formalise the lower standard",d:"Declare the light penny to be the penny.",e:{tr:340,coin:11,mkt:-12,unr:5},r:"The standard is lowered by decree. The chamber gains, the price of everything adjusts upward, and the fairs discount the coin."}]},
{i:"e_crusade",w:7,c:function(G){return G.pap>40;},ey:"Preached at the Hoftag",h:"A Crusade Is Called",
 t:"A general crusade has been preached and the vow is being taken in the Empire: by two bishops, a dozen counts, and a number of knights whose service is owed elsewhere. The crusading tenth is to be collected from clerical income in your lands, and the collectors are papal.",
 o:[{n:"Take the cross",d:"Lead it. The prestige is enormous and so is the absence.",e:{pap:18,prs:16,tr:-700,land:-12,stab:-7},r:"The vow is taken publicly. Preparations consume two years of revenue and the question of who governs in the meantime is not settled."},
    {n:"Send a contingent and stay",d:"Pay for knights and keep the crown at home.",e:{pap:9,prs:7,tr:-320,land:-5},r:"A respectable contingent sails. The crown remains, which is the correct decision and is held against it."},
    {n:"Commute the vows for money",d:"Let those who vowed pay instead of going.",e:{tr:520,pap:-11,prs:-7,land:4},r:"The commutation is arranged and the money is collected. Rome regards the practice as its own prerogative."}]},
{i:"e_marriage",g:1,w:10,ey:"A proposal",h:"A Marriage Is Offered",
 t:"A marriage is proposed between the royal house and one of the Empire's great princely families. The dowry is substantial, the bride's family controls two votes at an election, and the match would offend a different family that has been loyal for longer and expects better.",
 o:[{n:"Accept",d:"Two votes and a dowry.",e:{tr:420,elec:9,loyal:5,heir:7},r:"The match is made. The slighted house is cold for a decade and the votes are real."},
    {n:"Decline and marry the loyal house",d:"Reward service rather than buy votes.",e:{loyal:14,elec:-4,prs:4,heir:6},r:"The loyal house is honoured and says so loudly. The other family looks elsewhere, and finds somewhere."},
    {n:"Delay",d:"Keep both hoping.",e:{loyal:-5,elec:3,infl:5},r:"Both are kept waiting for two years, after which both have understood the manoeuvre."}]},
{i:"e_towncharter",g:1,w:10,c:function(G){return G.urb>9;},ey:"A petition",h:"A Town Asks for a Charter",
 t:"A growing market town petitions for a charter: its own court, its own walls, a weekly market and the right to answer to the crown rather than to the count whose land it stands on. The count has written separately and at length about what he thinks of this.",
 o:[{n:"Grant the charter",d:"A town that owes you directly.",e:{serv:9,tax:7,cent:7,mkt:7,loyal:-9},r:"The charter is sealed. The town prospers and the count's family nurses the grievance for three generations."},
    {n:"Grant a market only",d:"The market, not the liberties.",e:{serv:5,mkt:5,tax:3,loyal:-3},r:"A market charter is granted. It is enough to grow on and not enough to be free."},
    {n:"Refuse",d:"Do not take land out of a prince's hand.",e:{loyal:9,serv:-5,mkt:-4,cent:-4},r:"The petition is refused. The count is grateful and the town's merchants start keeping their money elsewhere."}]},
{i:"e_corrupt",w:9,c:function(G){return G.corr>24;},ey:"An audit",h:"The Accounts Do Not Balance",
 t:"The audit of a fiscal district has found a shortfall that cannot be explained by bad harvests. The bailiff has a new house, the register has been altered in two hands, and the man who kept it has a cousin at court who has been asking which clerks are conducting the audit.",
 o:[{n:"Prosecute them all",d:"The bailiff, the clerk and the cousin.",e:{corr:14,tr:260,loyal:-7,stab:5},r:"All three are tried and two are hanged. The accounts of every other district improve noticeably that quarter."},
    {n:"Dismiss quietly and recover the money",d:"No trial. Take the house and the plate.",e:{corr:9,tr:180,prs:-3},r:"The money is recovered and nobody is tried. The practice continues at a reduced scale."},
    {n:"Let it go",d:"The cousin is useful and the sum is not large.",e:{corr:-11,loyal:5,tr:-90},r:"It is let go. Within two years three other districts have tested the same arrangement."}]},
{i:"e_winter",w:10,c:function(G){return G.clim<25;},ey:"From Martinmas to Easter",h:"A Hard Winter",
 t:"The rivers froze hard enough to carry carts and stayed frozen into March. The mills stopped, the barges stopped, firewood went to four times its price in the towns, and the sown winter grain is dead in the ground over a wide area.",
 o:[{n:"Distribute fuel and grain from the chamber",d:"Open the stores.",e:{tr:-340,unr:-11,sol:6,food:5,prs:6},r:"Fuel and grain are carted into the towns at the crown's cost. The winter is survived better than the last one."},
    {n:"Suspend the tolls so goods move",d:"Make carriage cheap while the rivers are shut.",e:{tax:-7,mkt:7,unr:-6,acc:5},r:"The tolls come off for the season. Goods move by road and the towns are supplied."},
    {n:"Endure it",d:"Winters end.",e:{unr:11,pop:-6,food:-7,sol:-5},r:"It ends in late March. The accounts of the dead are kept by parish and are not sent to the chamber."}]},
{i:"e_vassaldeath",w:12,ey:"A death",h:"A Prince Dies",
 t:"One of the Empire's princes is dead and the succession is not clean: an adult brother with the local following, a child son with the better claim, and a widow with a dower third and her own family's army within reach. All three have written. The fief is in the crown's hand until it is granted.",
 o:[{n:"Grant to the child, with a regency",d:"The better claim, and a regency you appoint.",e:{cent:9,loyal:-5,stab:-4,corr:4},r:"The child is invested and the regency appointed from court. It holds, with two attempts on it."},
    {n:"Grant to the brother",d:"The man who can actually hold it.",e:{loyal:11,stab:6,cent:-5},r:"The brother is invested and holds it competently. The child's party keeps the claim alive for a generation."},
    {n:"Keep it in the crown's hand",d:"Administer it directly. Escheat is a right.",e:{tax:14,cent:11,loyal:-14,unr:7},r:"The fief is administered by royal officers. The revenue is excellent and every prince in the Empire has now thought about what happens when they die."}]},
{i:"e_hansa",g:1,w:7,c:function(G){return G.yr>1210;},ey:"From the Baltic",h:"The Towns Ask for Privileges",
 t:"A group of Baltic and North Sea towns has sent a joint embassy \u2014 which is itself the news \u2014 asking for a common privilege: one safe conduct, one standard of weight, and the crown's protection for their factors abroad. In exchange they offer a payment and the use of their shipping.",
 o:[{n:"Grant the common privilege",d:"One charter for all of them.",e:{mkt:16,nav:7,tr:260,loyal:-7,cent:4},r:"The privilege is granted. The association that results will outlast several dynasties and will not always be friendly."},
    {n:"Grant to each town separately",d:"Privileges, but no association.",e:{mkt:9,tr:180,cent:5,serv:5},r:"Separate charters are issued. The towns cooperate anyway, without a charter to point at."},
    {n:"Refuse",d:"A league of towns is a power, and powers are granted, not assumed.",e:{loyal:7,mkt:-11,nav:-5},r:"The embassy goes home. The towns proceed without the charter and the crown has no leverage over what they build."}]},
{i:"e_salt",w:6,ey:"At the brine pans",h:"The Salt Springs Fail",
 t:"The brine at one of the great salt works has weakened and the yield is down by half. Salt is how the Empire keeps meat and fish through winter, and the price has already moved in markets four hundred miles away. The miners say a deeper shaft would reach the better brine and would take two years and a great deal of money.",
 o:[{n:"Fund the deeper shaft",d:"Two years and a large sum.",e:{tr:-420,goods:9,tax:7,mkt:5},r:"The shaft is sunk and reaches good brine in the third year. It produces for two centuries."},
    {n:"Buy salt in and hold the price",d:"Import from Luneburg or the Adriatic.",e:{tr:-240,mkt:5,unr:-5,food:4},r:"Salt is bought in and the price is held through the winter."},
    {n:"Let the price rise",d:"Scarcity is not a thing a decree can fix.",e:{tr:160,unr:9,food:-7,sol:-5},r:"The price rises until it finds its level. Less meat is salted and the spring is leaner than usual."}]},
{i:"e_schism",w:6,c:function(G){return G.pap<24;},ey:"A proposal",h:"An Antipope Is Possible",
 t:"A faction of cardinals hostile to the present pope has made it known, through intermediaries, that a rival election could be arranged if the Empire would recognise and fund it. The Empire has done this before, four times in the last century, and each time it has lasted about as long as the money.",
 o:[{n:"Fund the rival election",d:"It worked for Barbarossa for eighteen years.",e:{tr:-820,pap:-25,cent:9,stab:-11,prs:5},r:"A rival is elected and recognised in the Empire. The schism runs for years, costs more than the estimate, and divides every chapter in Germany."},
    {n:"Use the threat without acting on it",d:"Let Rome know it is possible.",e:{pap:7,esp:7,infl:7},r:"The possibility is communicated and understood. Rome becomes noticeably easier to deal with for about three years."},
    {n:"Report the faction to the Pope",d:"Sell them. Buy credit in Rome.",e:{pap:18,esp:-5,prs:-5},r:"The names are sent to Rome. The gratitude is real and the method is noted by everyone who hears about it."}]},
{i:"e_italy",w:9,c:function(G){return G.yr>1203;},ey:"From Lombardy",h:"The League Re-Forms",
 t:"The Lombard communes have renewed their league: mutual defence, a common fund, and a standing agreement that no imperial officer exercises jurisdiction inside their walls. Cremona and Pisa have stayed out, as they generally do. The Italian revenue, which is the largest single item the crown has, runs through those walls.",
 o:[{n:"March into Italy",d:"Settle it the way Barbarossa tried to.",e:{tr:-1100,italy:14,land:-9,stab:-7,unr:9,pap:-9},r:"The army goes south. Two cities submit, one is besieged for a year, and the league does not dissolve."},
    {n:"Negotiate a Peace of Constance",d:"Concede self-government, keep the revenue and the oath.",e:{italy:9,mkt:11,tr:320,cent:-7,prs:-4},r:"Terms are agreed: the communes govern themselves and acknowledge the Empire, and pay. It is the arrangement that actually works."},
    {n:"Back Cremona and Pisa against them",d:"Divide Lombardy and let it fight itself.",e:{italy:5,esp:9,tr:-280,unr:7,mkt:-7},r:"The imperial cities are subsidised and the league is harassed rather than beaten. Lombardy is at war with itself for twenty years."}]},
{i:"e_eclipse",w:6,ey:"An omen",h:"The Sun Is Eaten",
 t:"The sun was obscured at midday for the better part of an hour and the birds went to roost. The chroniclers are writing it down and the preachers are explaining it. In three towns there have been processions and in one there has been a riot outside the Jewish quarter, which the council stopped.",
 o:[{n:"Order processions and alms",d:"Give the fear a shape and a direction.",e:{tr:-90,stab:7,unr:-7,pap:5,sol:4},r:"Processions are ordered in every cathedral city, with alms. The fear is absorbed into liturgy, which is what liturgy is for."},
    {n:"Have the astronomers explain it",d:"Publish the calculation. It was predicted.",e:{gen:9,serv:5,pap:-5,unr:-4,sol:3},r:"The tables are published showing it was predictable. The learned are impressed and the preachers continue regardless."},
    {n:"Say nothing",d:"It was an hour.",e:{unr:6,stab:-4},r:"Nothing is said. The explanations continue without the crown's."}]},
{i:"e_peasant",w:8,c:function(G){return G.unr>36;},ey:"In the countryside",h:"The Villages Refuse",
 t:"Several villages have stopped paying. Not a rising with banners: the dues simply are not being rendered, the bailiff is being told that the custom was otherwise, and the men who would normally be compelled are not available when the officers come. The lords want troops. The villages have sent, improbably, a written statement of what the custom was.",
 o:[{n:"Hear the statement",d:"Read what they have sent and inquire into the custom.",e:{unr:-14,stab:7,sol:6,tax:-5,loyal:-7},r:"An inquest is held into the old custom. In two villages it finds for the villagers, which is reported across four duchies within a season."},
    {n:"Send troops",d:"Dues are dues.",e:{tr:-180,unr:11,tax:9,sol:-7,loyal:7,pop:-3},r:"The dues are collected under arms. It works this year and the resentment is now permanent and organised."},
    {n:"Split the difference quietly",d:"Reduce the dues and say nothing about custom.",e:{unr:-9,tax:-4,sol:4,stab:4},r:"The dues are quietly reduced and the question of right is left untouched, which suits everyone except the lawyers."}]},
{i:"e_mercpay",w:8,c:function(G){return G.army>3;},ey:"In the camp",h:"The Companies Have Not Been Paid",
 t:"The mercenary companies are two quarters in arrears. They have not left, because leaving unpaid means losing the arrears, but they have begun living off the country they are quartered in, and the country they are quartered in is yours.",
 o:[{n:"Pay in full at once",d:"Find the money.",e:{tr:-520,land:7,stab:6,unr:-6,loyal:4},r:"The arrears are paid. The companies are loyal, briefly, and the countryside recovers."},
    {n:"Pay half and promise the rest",d:"Buy a season.",e:{tr:-240,land:-4,unr:4},r:"Half is paid. The companies stay, at reduced enthusiasm, and the foraging continues on a smaller scale."},
    {n:"Dismiss them unpaid",d:"Send them away and accept what they do on the way out.",e:{land:-14,unr:14,stab:-9,upk:-11,prs:-7},r:"They are dismissed and sack two towns on their road out of the realm. The saving is real and is not worth it."}]},
{i:"e_road",w:7,ey:"A survey",h:"The Roads Are Failing",
 t:"The chancery's own couriers report that four of the main roads are impassable to carts for part of the year, two bridges are unsafe, and the relay horses at three stations are worn out. An order takes eleven days to reach Milan from Mainz in summer and twenty-six in March.",
 o:[{n:"Fund a general repair",d:"Roads, bridges and relays together.",e:{tr:-440,acc:14,mkt:7,cent:6},r:"The work is done over three years. Everything the crown does afterwards happens faster."},
    {n:"Repair the relays only",d:"The couriers matter more than the carts.",e:{tr:-160,acc:7,corr:4},r:"The relays are restocked. Orders move; goods do not."},
    {n:"Lay the duty on the landholders",d:"It is their obligation in law.",e:{acc:5,unr:6,loyal:-5},r:"The duty is enforced where the crown is strong and ignored where it is not, which is a fair map of the Empire."}]}
];

function cls(v,inv){var k=inv?100-v:v;return k<30?"b":(k<55?"w":"g");}

/* =============== SETUP =============== */
function initGame(natIx,recog){
 var row=RG[natIx], t=T[natIx], rnd=mulberry(1200+natIx*37);
 G={yr:1200,turn:0,era:"Medieval",age:"High Medieval",
  nat:natIx,title:TITLES[natIx],sname:row[0],
  ruler:null,regions:[],states:[],
  recog:recog||null,impFav:34,outlaw:0,emp:null,
  tr:Math.round(row[1]*0.9+240),sub:0,leg:24,pap:30,prs:30,
  debt:0,debtLvl:0,infl:0,cent:26,taxRate:42,
  research:{},slots:1,queue:[],qleft:{},done:{},laws:{},doct:{},doctSel:{},
  army:{},builds:[],offices:{},court:[],powers:{},rels:{},allies:{},wars:{},badRun:0,
  awars:[],aallies:{},news:[],pendingAttack:null,
  trade:{routes:[],infra:{}},TB:null,host:null,cheats:{},acted:{},
  pendingBattle:null,battleDue:null,
  peaceOffer:null,peaceDemand:null,
  dipl:0,diplMax:3,
  rank:null,liege:null,ld:0,ldPush:0,vassYrs:0,rupCool:0,sueCool:0,rankThin:0,liegeAsk:null,revoltAt:null,
  clim:30,climB:30,genius:null,chron:[],flags:{},strainRun:0,
  rnd:rnd,ev:null,over:null,em:{}};

 LAWS.forEach(function(l){if(l.on)G.laws[l.i]=1;});
 POWERS.forEach(function(p){G.powers[p.i]=p.st;});
 TECH.forEach(function(c){G.research[c.i]={tier:0};});

 /* your own ruler, taken from whoever actually held the place in 1200 */
 G.ruler=mkChar(t?t.h:row[0],row[13],rnd);
 G.ruler.title=TITLES[natIx];
 if(G.ruler.comm){G.ruler.n="The Consuls of "+SUBS[natIx][0];G.ruler.title=TITLES[natIx];}

 /* the regions of your own state */
 G.regions=genRegions(natIx,rnd);
 G.regions.forEach(function(r){RIDX[r.n]=r;});

 /* every other state on the map, run at the level of a state */
 RG.forEach(function(r2,ix){
  var t2=T[ix];
  var s={ix:ix,n:r2[0],pop:r2[1]*1000,dev:r2[3],urb:r2[2],align:r2[8],cult:r2[9],
   res:r2[10].slice(),towns:r2[11],coast:r2[12],me:ix===natIx,
   rule:ix===natIx?G.ruler:mkChar(t2?t2.h:r2[0],r2[13],rnd),
   rel:ix===natIx?100:50,imp:50,intel:ix===natIx?3:0,
   army:Math.round(r2[1]*0.011+2),claim:0,fear:0,taken:0,ownerIx:null};
  s.gdp=s.pop*0.012*(1+s.dev*0.014);
  G.states.push(s);
 });
 /* neighbours you share a frontier with start better informed of each other */
 nearIx(natIx).forEach(function(ix){G.states[ix].rel=cl0(G.states[ix].rel+7,0,100);
  G.states[ix].intel=1;});

 /* the double election: two kings, and you have to deal with one of them */
 G.emp={a:"ph",b:"ot",res:0};
 if(natIx===CLAIMS.ph.ix){G.recog="ph";G.leg=52;G.pap=18;G.impFav=100;G.king=1;}
 else if(natIx===CLAIMS.ot.ix){G.recog="ot";G.leg=44;G.pap=62;G.impFav=100;G.king=1;G.sub=520;}
 else{G.king=0;G.impFav=34;}

 buildCourt(rnd);
 hostInit();
 recalcAll();
 aiInit();
 rankInit();
 G.dipl=G.diplMax;
 intelPass();

 var k=G.king?" and a claimant to the crown of the Romans":"";
 chron(1200,"<b>"+G.ruler.n+"</b>, "+G.ruler.title+k+". "+
  G.regions.length+" regions, "+fmt(natPop())+" souls, and an Empire that has just elected two kings.");
 return G;
}

/* --- the regions of one state, carved out of what the state actually was --- */
function genRegions(ix,rnd){
 var row=RG[ix], names=SUBS[ix], n=names.length, out=[];
 var totPop=row[1]*1000, urb=row[2], dev=row[3], terr=row[4], acc=row[5];
 /* the capital is much the largest and much the most urban */
 var w=[],sum=0;
 for(var i=0;i<n;i++){var k=(i===0?2.9:1)*(0.72+rnd()*0.56);w.push(k);sum+=k;}
 var terrAlt={pl:["pl","pl","hl","fo"],hl:["hl","hl","va","fo"],mt:["mt","mt","al","hl"],
  fo:["fo","fo","pl","hl"],mr:["mr","mr","co","pl"],al:["al","al","mt","hl"],
  va:["va","va","pl","hl"],co:["co","co","mr","pl"]};
 for(i=0;i<n;i++){
  var share=w[i]/sum, cap=i===0;
  var tr2=cap?terr:terrAlt[terr][Math.floor(rnd()*4)];
  var r={ix:i,nat:ix,n:names[i],cap:cap?1:0,
   pop:Math.max(3000,Math.round(totPop*share)),
   urb:cl0(cap?urb*2.1:urb*(0.42+rnd()*0.7),1,72),
   dev:cl0(Math.round(cap?dev*1.2:dev*(0.76+rnd()*0.42)),8,95),
   terr:tr2,
   acc:cl0(Math.round((cap?acc+14:acc*(0.72+rnd()*0.5))),6,96),
   stab:cl0(Math.round(row[6]+(rnd()-0.5)*16),5,97),
   unr:cl0(Math.round(row[7]+(rnd()-0.5)*18),1,96),
   res:[],towns:cap?Math.max(1,row[11]-Math.min(row[11]-1,n-1)):(rnd()<0.42?1:0),
   coast:row[12]&&(cap||rnd()<0.4)?1:0,
   farms:1,bld:{},shifted:cap?1:0,unrDelta:0,intel:3};
  out.push(r);
 }
 /* the state's resources are spread about, not everywhere at once */
 row[10].forEach(function(k,j){
  var tgt=out[(j+1)%out.length];tgt.res.push(k);
  if(out.length>4&&rnd()<0.4)out[(j+3)%out.length].res.push(k);
 });
 out.forEach(function(r){r.farms=Math.max(1,Math.round(r.pop/58000)+1);});
 return out;
}

/* crude adjacency from the drawn label positions: who you share a frontier with */
var NEARC=[];
function nearIx(ix){
 if(NEARC[ix])return NEARC[ix];
 var c=T[ix]&&T[ix].c;if(!c)return (NEARC[ix]=[]);
 var d=[];T.forEach(function(t,j){if(j===ix||!t.c)return;
  var dx=t.c[0]-c[0],dy=t.c[1]-c[1];
  d.push([j,dx*dx+dy*dy]);});
 d.sort(function(a,b){return a[1]-b[1];});
 return (NEARC[ix]=d.slice(0,6).map(function(x){return x[0];}));
}

function mkChar(nm,age,rnd){
 if(!nm||/^No ruling house/.test(nm))
  return {n:"Elected consuls",age:0,tr:["Shrewd","Content"],sk:[5,3,6,4,5,3],comm:1};
 var h=0;for(var i=0;i<nm.length;i++)h=(h*31+nm.charCodeAt(i))>>>0;
 var r=mulberry(h), sk=[];
 for(i=0;i<6;i++)sk.push(2+Math.floor(r()*7));
 var tr=[],pool=TPOOL.slice();
 for(i=0;i<3;i++)tr.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
 return {n:nm,age:age||(26+Math.floor(r()*30)),tr:tr,sk:sk,comm:0};
}
var CFN=["Henry","Conrad","Frederick","Otto","Albert","Louis","William","Rudolf","Berthold","Hermann",
 "Siegfried","Adolf","Gerhard","Dietrich","Engelbert","Bernhard","Eberhard","Godfrey","Ulrich","Walram"];
var CSN=["of the Marches","the Younger","of the Hall","the Elder","of the Tower","Bastard of the House",
 "of the Mill","the Red","the Lame","of the Bridge","the Clerk","the Fat"];
function buildCourt(rnd){
 G.court=[];
 var n=5+Math.floor(rnd()*4);
 for(var i=0;i<n;i++){
  var nm=CFN[Math.floor(rnd()*CFN.length)]+" "+CSN[Math.floor(rnd()*CSN.length)];
  var sk=[];for(var j=0;j<6;j++)sk.push(2+Math.floor(rnd()*8));
  var tr=[],pool=TPOOL.slice();
  for(j=0;j<2;j++)tr.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  G.court.push({n:nm,age:24+Math.floor(rnd()*34),sk:sk,tr:tr});
 }
}

/* =============== MODIFIER BAG =============== */
function bag(){
 var M={};
 function add(e,sc){if(!e)return;for(var k in e){if(k==="doct"||k==="law"||k==="unit")continue;
   var v=e[k];if(typeof v!=="number")continue;M[k]=(M[k]||0)+v*sc;}}
 for(var id in G.done) add(TID[id]&&TID[id].e,1);
 LAWS.forEach(function(l){if(G.laws[l.i])add(l.e,1);});
 DOCT.forEach(function(d){if(doctOn(d.i))add(d.e,1);});
 OFFICES.forEach(function(o){var h=G.offices[o.i];if(h===undefined||h===null)return;
   var c=G.court[h];if(!c)return;add(o.e,0.5+c.sk[o.sk]*0.08);});
 (G.ruler.tr||[]).forEach(function(t){if(TRAITS[t])add(TRAITS[t].e,1);});
 if(G.genius)add(G.genius.e,1);
 add(G.em,1);
 /* imperial favour, or the lack of it */
 if(!G.king){ if(G.impFav>66)add({stab:5,mkt:5,leg:4},1);
   if(G.outlaw)add({stab:-14,mkt:-14,unr:9,leg:-12},1); }
 /* what the rank itself is worth, and what holding of another man costs */
 if(typeof RTIER!=="undefined"&&G.rank){
  var RT=RTIER[rankRow(G.rank).t];
  if(RT)add({prs:RT.prs,land:RT.land,tax:RT.tax,def:RT.land*0.4},1);
  if(amVassal())add({prs:-7,leg:-6,cent:-5,unr:3,stab:-3},1);
 }
 return M;
}
function m(M,k){return M[k]||0;}

/* buildings in a region, totalled */
function bldEff(r){
 var e={};
 for(var id in r.bld){var b=BID[id];if(!b)continue;var n=r.bld[id];
  for(var k in b.e)e[k]=(e[k]||0)+b.e[k]*n;}
 return e;
}
function be(e,k){return e[k]||0;}

/* =============== REGION DERIVATION =============== */
function recalcRegion(r,M){
 var tf=TERR[r.terr],envK={al:"alp",mr:"mrs",fo:"frs",mt:"mtn",hl:"hil"}[r.terr];
 var adapt=envK?m(M,envK):0, B=bldEff(r);
 r.B=B;
 var acc=cl0(r.acc+m(M,"acc")*0.4+be(B,"acc")+G.cent*0.1+adapt*0.2,4,99);
 r.accEff=acc;
 var rural=r.pop*(1-r.urb/100), urban=r.pop*(r.urb/100);
 r.need=r.pop*0.00105;
 var resB=0;r.res.forEach(function(k){resB+=RES[k]?RES[k][1]:0;});
 var fert=tf[1]*(1+m(M,"food")*0.009+adapt*0.006);
 r.foodRaw=rural*fert*0.00115*(1+r.farms*0.03)+be(B,"food")*0.62;
 r.goods=(rural*0.00052+urban*0.0017)*(1+m(M,"goods")*0.011+resB*0.012+r.dev*0.006)
   +be(B,"goods")*0.8;
 r.serv=(urban*0.0031*(1+m(M,"serv")*0.013+r.towns*0.035+r.dev*0.005)+be(B,"serv")*0.9)*(acc/70);
 /* a town does not grow what it eats. It buys it: from the local market, and
    from whatever grain the realm's own routes bring in. */
 var bought=r.serv*0.30*(acc/100)*(1+m(M,"mkt")*0.005);
 var shipped=(G.grainIn||0)*(r.pop/Math.max(1,G.popPrev||r.pop))*(acc/100);
 r.imported=Math.min(r.need*0.85,bought+shipped);
 r.food=r.foodRaw+r.imported;
 r.gdp=(r.goods+r.serv)*100;
 r.gdpc=r.gdp/Math.max(0.001,r.pop/1000);
 r.def=Math.round(be(B,"def")+m(M,"def")*0.3);
 r.sol=cl0(14+cl0(r.gdpc*0.2,0,44)+m(M,"sol")*0.42+be(B,"sol")*1.3
   +(r.food>=r.need?8:-18)+r.dev*0.14,1,99);
 var bal=(r.food-r.need)/Math.max(0.1,r.need);
 r.price=cl0(50-bal*34+(100-acc)*0.26-m(M,"mkt")*0.1-be(B,"mkt")*0.3,1,99);
 r.farmCap=Math.round(4+r.pop/18000+m(M,"cap")*1.5);
 r.millCap=Math.round(2+r.pop/34000+m(M,"cap")*0.6+(G.done.eng2a?1:0)+(G.done.eng4a?1:0));
 r.mineCap=r.res.length?Math.round(2+m(M,"cap")*0.5+(G.done.adp3a?1:0)+(G.done.prd5a?1:0)):0;
 return r;
}
function capOf(r,b){
 if(b.cap==="farm")return r.farmCap;
 if(b.cap==="mill")return r.millCap;
 if(b.cap==="mine")return r.mineCap;
 return 1;
}
function canBuild(r,b){
 if(b.req&&!G.done[b.req])return 0;
 if(b.coast&&!r.coast)return 0;
 if(b.res&&r.res.indexOf(b.res)<0)return 0;
 if(b.resAny&&!b.resAny.some(function(k){return r.res.indexOf(k)>=0;}))return 0;
 if((r.bld[b.i]||0)>=capOf(r,b))return 0;
 if(G.tr<b.c)return 0;
 return 1;
}

function recalcAll(){
 var M=bag();G.M=M;
 G.regions.forEach(function(r){recalcRegion(r,M);});
 natAgg(M);
 foreignAgg();
 return M;
}
function natPop(){var p=0;G.regions.forEach(function(r){p+=r.pop;});return p;}

function natAgg(M){
 var pop=0,gdp=0,food=0,need=0,urbp=0,stabW=0,unrW=0,accW=0,bu=0,def=0;
 G.regions.forEach(function(r){
  pop+=r.pop;gdp+=r.gdp;food+=r.food;need+=r.need;urbp+=r.pop*r.urb/100;
  stabW+=r.stab*r.pop;unrW+=r.unr*r.pop;accW+=r.accEff*r.pop;def+=r.def;
  for(var id in r.bld){var b=BID[id];if(b)bu+=b.u*r.bld[id];}
 });
 G.pop=pop;G.gdp=gdp;G.gdpc=gdp/Math.max(0.001,pop/1000);
 G.foodN=food;G.needN=need;G.urb=urbp/pop*100;
 G.stab=stabW/pop;G.unr=unrW/pop;G.accN=accW/pop;
 G.held=G.regions.length;
 G.mkt=gdp*(G.accN/100)*(1+m(M,"mkt")*0.006);
 G.corr=cl0(32-m(M,"corr")*0.55-G.accN*0.14+(100-G.cent)*0.05,2,85);

 var inc=0;
 G.regions.forEach(function(r){
  var cultR=RG[G.nat][9];
  var regional=(["ita","tus"].indexOf(cultR)>=0?m(M,"italy"):0)
             +(cultR==="bur"?m(M,"burg"):0)
             +(["wnd","cze","slv"].indexOf(cultR)>=0?m(M,"east")*0.6:0);
  var reach=(r.accEff/100)*(G.taxRate/100)*(1+m(M,"tax")*0.009+be(r.B,"tax")*0.012+regional*0.006);
  inc+=r.gdp*reach*0.30;
 });
 if(G.king)inc+=3100*(G.leg/100)*(1+m(M,"tax")*0.006);   /* the Reichsgut, if you wear the crown */
 if(G.sub>0)inc+=G.sub;
 if(G.tribute)inc+=G.tribute;
 if(typeof vassalDues==="function"&&G.states&&G.states.length){G.vinc=vassalDues();inc+=G.vinc;}
 inc*=(1-G.corr/160);
 G.income=inc;

 var up=0;for(var u in G.army){var ud=UID2[u];if(ud)up+=ud.u*G.army[u];}
 up*=(1+m(M,"upk")*0.012);
 up+=bu;
 /* the fixed cost of administering a region scales with what there is to
    administer: a lordship of two valleys does not keep a chancery */
 up+=G.income*0.55+G.regions.length*Math.min(42,6+G.income*0.012);
 /* trade pays for itself or it does not */
 var TB=tradeBooks();G.TB=TB;
 G.trade.exp=TB.exp;G.trade.imp=TB.imp;G.trade.surplus=TB.surplus;G.trade.upk=TB.upk;
 G.income+=TB.exp; inc=G.income;
 up+=TB.imp+TB.upk;
 if(G.debt>0)up+=G.debt*0.09;
 if(G.impTax)up+=G.impTax;
 if(typeof tributeDue==="function"&&G.states&&G.states.length){G.vtrib=tributeDue();up+=G.vtrib;}
 G.upkeep=up;
 G.net=G.income-G.upkeep;

 /* a host short of iron, armour or horses is a weaker host */
 var sh=G.TB?tradeShort():{};
 G.shortfall=sh;
 var milShort=(sh.iron||0)*0.5+(sh.armour||0)*0.7+(sh.horse||0)*0.4;
 G.prsDrag=((sh.wine||0)+(sh.silk||0)+(sh.furs||0)+(sh.oil||0))*4;
 G.landRaw=26+m(M,"land")*0.7+armyStr()*0.55;
 G.land=Math.round(G.landRaw*cl0(1-milShort*0.16,0.78,1));
 G.nav=Math.round(8+m(M,"nav")*0.65);
 G.sie=Math.round(10+m(M,"sie")*0.65);
 G.def=Math.round(14+def*0.6+m(M,"def")*0.4);
 G.esp=Math.round(10+m(M,"esp")*0.8);
 G.influ=Math.round(10+m(M,"infl")*0.8+G.ruler.sk[0]*2.2+G.prs*0.1);
 G.diplMax=cl0(2+Math.floor(G.ruler.sk[0]/3)+(G.offices.chan!==undefined?1:0),2,7);
 G.lvl=techLevel();
 G.shifted=G.regions.filter(function(r){return r.shifted;}).length;
 G.debtCap=G.debtLvl?Math.round(G.income*(1.1+G.debtLvl*0.75)):0;
}
function armyStr(){var s=0;for(var u in G.army){var d=UID2[u];if(d)s+=d.s*G.army[u];}return s;}
function armyCount(){var n=0;for(var u in G.army)n+=G.army[u];return n;}

/* the other states keep growing, arming and changing their minds */
function foreignAgg(){
 G.states.forEach(function(s){
  if(s.me)return;
  s.gdp=s.pop*0.012*(1+s.dev*0.014);
 });
}

function techLevel(){
 var tot=0,dn=0;
 TECH.forEach(function(c){c.tiers.forEach(function(ti){ti.forEach(function(t){tot++;if(G.done[t.i])dn++;});});});
 return 2+0.1*2+(tot?dn/tot:0)*0.0995;
}
function techLevelName(l){
 var eras=["","Ancient","Medieval","Early Modern","Industrial","Modern","Information","Future"];
 var ages={2:["","Dark Ages","High Medieval","Late Medieval"]};
 var e=Math.floor(l), a=Math.round((l-e)*10);
 return (ages[e]&&ages[e][a]?ages[e][a]:"")+", "+(eras[e]||"?")+" era";
}
function expectedLevel(){return 2.20+cl0((G.yr-1200)/100,0,1)*0.042;}

/* =============== INTEL ===============
   Your own regions you know. Other states you know as well as your business
   with them allows, and no better. */
function intelPass(){
 var M=G.M||{},near=G.nearSet||(G.nearSet=nearIx(G.nat));
 G.states.forEach(function(s){
  if(s.me){s.intel=3;return;}
  var k=0;
  if(s.rel>=70)k=2;else if(s.rel>=45)k=1;
  if(near.indexOf(s.ix)>=0)k=Math.max(k,1);
  if(s.spy)k=Math.max(k,2);
  if(m(M,"esp")>44)k++;else if(m(M,"esp")>18)k+=0.5;
  if(G.allies[s.ix])k=3;
  s.intel=cl0(Math.round(k),0,3);
 });
}

/* =============== RESEARCH =============== */
var TID={},UID={},BID={},UID2={};
function indexTech(){
 TECH.forEach(function(c){c.tiers.forEach(function(ti,ta){ti.forEach(function(t){
  t.cat=c.i;t.tier=ta+1;TID[t.i]=t;});});});
 UNIQ.forEach(function(u){UID[u.i]=u;TID[u.i]=u;});
 BLD.forEach(function(b){BID[b.i]=b;});
 UNITS.forEach(function(u){UID2[u.i]=u;});
}
function catOf(id){for(var i=0;i<TECH.length;i++)if(TECH[i].i===id)return TECH[i];return null;}
function tierOpen(cat,tier){
 var c=catOf(cat);if(tier===0)return true;
 var below=c.tiers[tier-1];if(!below)return false;
 for(var i=0;i<below.length;i++)if(!G.done[below[i].i])return false;
 return true;
}
function slotsTotal(){var M=G.M||{};
 var rk=(typeof RTIER!=="undefined"&&G.rank)?RTIER[rankRow(G.rank).t].slot:0;
 return cl0(3+Math.round(m(M,"slot"))+rk-(amVassal()?1:0),2,13);}
function canStart(t){
 if(G.done[t.i]||G.queue.indexOf(t.i)>=0)return 0;
 if(G.queue.length>=slotsTotal())return 0;
 if(t.k){
   if(t.k==="nat"&&t.req&&t.req.res){var ok=0;G.regions.forEach(function(r){if(r.res.indexOf(t.req.res)>=0)ok=1;});if(!ok)return 0;}
   if(t.k==="nat"&&t.req&&t.req.coast){var c=0;G.regions.forEach(function(r){if(r.coast)c=1;});if(!c)return 0;}
   if(t.k==="for"&&G.mkt<Math.max(1200,G.gdp*0.42))return 0;
   return 1;
 }
 return tierOpen(t.cat,t.tier-1)?1:0;
}
function startTech(id){var t=TID[id];if(!canStart(t))return;G.queue.push(id);
 G.qleft[id]=(G.cheats&&G.cheats.instant)?0:t.t;
 if(G.cheats&&G.cheats.instant){finishResearch();recalcAll();}}

/* =============== ENACTMENT =============== */
/* One doctrine of each kind is in force at a time; the rest are known and unused. */
function doctOf(branch){return (G.doctSel||{})[branch]||null;}
function doctOn(id){var d=DOCT.filter(function(x){return x.i===id;})[0];
 return !!(d&&doctOf(d.b)===id);}
function setDoct(id){
 var d=DOCT.filter(function(x){return x.i===id;})[0];if(!d||!G.doct[d.i])return;
 G.doctSel=G.doctSel||{};
 G.doctSel[d.b]=(G.doctSel[d.b]===id)?null:id;

  ("The <b>"+d.n+"</b> footing is set aside."));
 recalcAll();
}

/* =============== SHIFTING (inside your own state) =============== */
function shiftCost(r){return Math.round(150+r.pop/2100+(100-r.stab)*2.4);}
function doShift(r){
 var c=shiftCost(r);if(G.tr<c||r.shifted)return 0;
 G.tr-=c;
 var ch=cl0(30+G.influ*1.1+r.stab*0.26-(100-r.accEff)*0.22,10,94);
 if(G.rnd()*100<ch){r.shifted=1;r.unrDelta+=5;
  chron(G.yr,"<b>"+r.n+"</b> submits to the rule of the chancery. Its customs are overridden and it is noted locally.");
  return 1;}
 r.unrDelta+=8;
 chron(G.yr,"The attempt to bring <b>"+r.n+"</b> under closer rule fails and is resented.");
 return -1;
}
function centTarget(){
 return cl0(10+G.shifted/G.regions.length*100*0.86+m(G.M||{},"cent")*0.3+G.prs*0.06,0,100);}

/* =============== DIPLOMACY =============== */
function dipKey(six,act){return six+":"+act;}
function dipDone(six,act){return !!(G.acted&&G.acted[dipKey(six,act)]);}
/* why an approach is not on the table, or "" if it is */
function dipBlocked(six,act){
 var s=G.states[six],a=DIPA.filter(function(x){return x.i===act;})[0];
 if(!s||!a)return "not possible";
 if(isMine(s))return "your own";
 if(dipDone(six,act))return "already tried this year";
 if(G.dipl<=0)return "no envoy left this year";
 if(G.tr<a.c)return "not enough in the chamber";
 if(!indep(s)&&!isMine(s))return "they answer to somebody else now";
 if(amVassal()){
  if(a.k==="dn"&&six!==G.liege)return vassBlock("claim");
  if(a.ally&&six!==G.liege&&!(G.states[six].liege===G.liege))
   return "a man who holds of another may not swear his own alliances";
 }
 var war=atWar(six);
 if(a.ally&&G.allies[six])return "already allied";
 if(a.i==="agent"&&s.spy)return "an agent is already there";
 if(a.i==="press"&&s.claim)return "a claim is already entered";
 if((a.i==="threat"||a.i==="demand")&&war)return "you are already at war";
 if(a.i==="demand"&&(s.fear||0)>=4)return "they are past being frightened";
 if(war&&a.k!=="dn"&&a.i!=="envoy")return "you are at war with them";
 return "";
}
function doDip(six,act){
 if(dipBlocked(six,act))return "";
 var s=G.states[six],a=DIPA.filter(function(x){return x.i===act;})[0];
 G.acted[dipKey(six,act)]=1;
 G.dipl--;G.tr-=a.c;
 var skill=G.ruler.sk[0]+(G.offices.chan!==undefined&&G.court[G.offices.chan]?G.court[G.offices.chan].sk[0]*0.5:0);
 var eff=1+(skill-5)*0.07+G.prs*0.004;
 var msg="";
 if(a.rel){var d=a.rel*(a.rel>0?eff:1);s.rel=cl0(s.rel+d,0,100);
  msg=a.rel>0?"Relations with "+s.n+" improve.":"Relations with "+s.n+" worsen, as intended.";}
 if(a.intel){s.spy=1;msg="An agent is established in "+s.n+".";}
 if(a.ally){
  var ch=cl0(s.rel*0.8+G.prs*0.3-10,5,92);
  if(G.rnd()*100<ch){G.allies[six]=1;msg="A match is agreed. "+s.n+" is bound to you.";}
  else msg="The proposal is declined, courteously. The approach is remembered.";
 }
 if(a.take){
  var ch2=cl0(40+(G.land-s.army*4)*1.1+s.fear*9-s.rel*0.2,3,94);
  if(G.rnd()*100<ch2){var amt=Math.round(s.gdp*0.09);G.tr+=amt;
   msg=s.n+" pays rather than fight. "+fmt(amt)+" marks reach the chamber.";}
  else{s.rel=cl0(s.rel-10,0,100);msg=s.n+" refuses, and is now arming.";s.army+=1;}
 }
 if(a.claim){s.claim=1;msg="A claim is entered against "+s.n+". It is now a cause of war whenever you want one.";}
 if(a.fear){s.fear=cl0(s.fear+1,0,4);msg=s.n+" is warned. Its envoys have gone home.";}
 if(a.tax)G.em.tax=(G.em.tax||0)+a.tax;
 chron(G.yr,"<b>"+a.n+"</b> \u00b7 "+s.n+". "+msg);
 recalcAll();
 return msg;
}
function powBlocked(pid,act){
 var a=POWA.filter(function(x){return x.i===act;})[0],cur=G.powers[pid]||0;
 if(!a)return "not possible";
 if(G.acted&&G.acted["p"+pid+":"+act])return "already tried this year";
 if(G.dipl<=0)return "no envoy left this year";
 if(G.tr<a.c)return "not enough in the chamber";
 if(a.need!==undefined&&cur<a.need)return "relations are not warm enough";
 if(a.ally&&amVassal())return vassBlock("pow");
 if(a.take&&amVassal())return vassBlock("claim");
 if(a.ally&&G.allies["p_"+pid])return "already allied";
 if(a.i==="brk"&&cur<=-45)return "relations are already broken off";
 return "";
}
function doPow(pid,act){
 if(powBlocked(pid,act))return "";
 var a=POWA.filter(function(x){return x.i===act;})[0],cur=G.powers[pid]||0;
 G.acted["p"+pid+":"+act]=1;
 G.dipl--;G.tr-=a.c;
 var P=POWERS.filter(function(p){return p.i===pid;})[0];
 var eff=1+(G.ruler.sk[0]-5)*0.07;
 G.powers[pid]=cl0(cur+a.st*(a.st>0?eff:1),-100,100);
 if(pid==="pap")G.pap=cl0(G.pap+a.st*0.8,0,100);
 var msg="";
 if(a.ally){var ch=cl0((cur+50)*0.7+G.prs*0.3-14,4,90);
  if(G.rnd()*100<ch){G.allies["p_"+pid]=1;msg=P.n+" agrees.";}
  else msg=P.n+" does not agree, and the refusal is polite.";}
 else if(a.take){var ch2=cl0(30+G.prs*0.4+G.land*0.2,3,88);
  if(G.rnd()*100<ch2){var amt=Math.round(900+G.rnd()*900);G.tr+=amt;msg=P.n+" concedes. "+fmt(amt)+" marks.";}
  else msg=P.n+" refuses and the insult is on record.";}
 else msg="Relations with "+P.n+" now stand at "+Math.round(G.powers[pid])+".";
 chron(G.yr,"<b>"+a.n+"</b> \u00b7 "+P.n+". "+msg);
 recalcAll();
 return msg;
}

/* =============== THE IMPERIAL LAYER =============== */
function empName(){
 if(G.king)return G.ruler.n;
 if(G.emp.res==="ph")return CLAIMS.ph.n;
 if(G.emp.res==="ot")return CLAIMS.ot.n;
 return CLAIMS.ph.n+" and "+CLAIMS.ot.n;
}
function recogName(){return G.recog?CLAIMS[G.recog].n:"neither claimant";}
function impDemand(){
 if(G.king||G.outlaw)return;
 var d=IMPD[Math.floor(G.rnd()*IMPD.length)];
 G.ev={i:"imp_"+d.i,ey:"A summons from the king",h:d.n,
  t:(G.recog?CLAIMS[G.recog].n:"The king")+" has sent to you. "+d.d+
    " A prince who renders what is asked is remembered for it; a prince who refuses is remembered rather longer.",
  o:[{n:"Render it in full",d:d.cost==="gold"?"Pay what is asked.":d.cost==="army"?"Send your knights for the forty days.":"Comply.",
     e:d.cost==="gold"?{tr:-Math.round(G.income*0.3),impFav:14}:d.cost==="army"?{land:-6,impFav:14}:{impFav:13,prs:3},
     r:"It is rendered, witnessed and noted in the chancery."},
   {n:"Render a token",d:"Enough to be seen complying, not enough to hurt.",
     e:{tr:-Math.round(G.income*0.08),impFav:4},
     r:"A token is sent. Nobody is deceived and nobody objects out loud."},
   {n:"Refuse and cite custom",d:"Claim the obligation was never owed.",
     e:{impFav:-17,prs:5,cent:3},
     r:"The refusal is entered, with your reasons. Other princes take note of both."}]};
}
function empTurn(){
 if(G.king)return;
 /* the double election resolves itself the way it historically did */
 if(!G.emp.res){
  if(G.yr>=1208){G.emp.res="ot";chron(G.yr,"Philip of Swabia is dead, murdered at Bamberg. <b>Otto IV</b> is king without a rival.");}
 }else if(G.emp.res==="ot"&&G.yr>=1215){G.emp.res="fr";
  chron(G.yr,"Otto IV is finished. <b>Frederick II</b>, the boy from Palermo, is king of the Romans and means to be emperor.");}
 /* favour drifts toward what you have actually done */
 var t=cl0(34+(G.recog?12:-9)+G.prs*0.2+(G.outlaw?-40:0),0,100);
 G.impFav+=(t-G.impFav)*0.1;
 if(G.impFav<9&&!G.outlaw&&G.rnd()<0.25){G.outlaw=1;
  chron(G.yr,"You are put to the <b>imperial ban</b>. Your vassals are absolved, your tolls are void and anyone may take what they can hold.");}
 if(G.outlaw&&G.impFav>34){G.outlaw=0;chron(G.yr,"The ban is lifted. It cost more than it should have.");}
}

/* =============== TURN =============== */
function endTurn(){
 if(G.over)return;
 var M=bag();G.M=M;
 G.turn++;G.yr++;
 G.dipl=G.diplMax;

 G.climB-=0.17;
 var shock=0;
 if(G.yr===1258)shock=-112;
 else if(G.yr===1259)shock=-46;
 else if(G.yr===1260)shock=-17;
 G.clim=cl0(G.clim+((G.climB+shock)-G.clim)*0.42+(G.rnd()-0.5)*11,-100,100);


 /* research */
 G.queue.slice().forEach(function(id){
  G.qleft[id]=(G.qleft[id]||TID[id].t)-(G.cheats&&G.cheats.instant?99:1);});
 finishResearch();

 var M2=bag();G.M=M2;
 G.regions.forEach(function(r){
  recalcRegion(r,M2);
  var short=r.food<r.need, B=r.B;
  var sTgt=cl0(36+r.sol*0.3+m(M2,"stab")*0.42+be(B,"stab")*0.8-(short?17:0)
    +(G.cent>52?5:0)+(r.cap?6:0),2,99);
  r.stab+=(sTgt-r.stab)*0.2;
  var uTgt=cl0(7+(short?28:0)+(G.taxRate-40)*0.52+m(M2,"unr")*0.42-m(M2,"stab")*0.1
    -(r.sol-50)*0.12+r.urb*0.13-be(B,"stab")*0.3+(r.shifted?3:0),4,99);
  r.unr+=(uTgt-r.unr)*0.26+r.unrDelta;r.unrDelta=0;
  r.unr=cl0(r.unr,0,100);r.stab=cl0(r.stab,0,100);
  var slack=(r.food-r.need)/Math.max(0.1,r.need);
  var gr=0.0014+Math.max(0,slack)*0.0052+m(M2,"pop")*0.00008+m(M2,"hea")*0.00006+be(B,"hea")*0.00035
    +(["wnd","cze","slv"].indexOf(r.cultR||RG[G.nat][9])>=0?m(M2,"east")*0.00012:0);
  if(slack<0)gr+=slack*0.017;
  if(r.unr>66)gr-=0.009;
  r.pop=Math.max(2000,r.pop*(1+cl0(gr,-0.055,0.0086)));
  if(r.unr>76&&G.rnd()<0.1){r.stab=cl0(r.stab-13,0,100);
   chron(G.yr,"There is open disorder in <b>"+r.n+"</b>.");}
 });

 /* the other states go on without you, and act */
 G.states.forEach(function(s){
  if(s.me)return;
  s.pop*=1+0.0012+G.rnd()*0.0024;
  s.gdp=s.pop*0.012*(1+s.dev*0.014);
  var base=50+(G.allies[s.ix]?26:0)-(s.claim?16:0)
    +(G.recog&&s.imp>55?5:0)-(s.fear*4)-(atWar(s.ix)?30:0)
    +m(M2,"loyal")*0.35+m(M2,"prs")*0.05;
  s.rel+=(cl0(base,0,100)-s.rel)*0.07;
  s.imp+=((50+s.align*(G.emp.res==="ph"?0.4:G.emp.res==="ot"?-0.4:0))-s.imp)*0.06;
  if(s.fear>0&&G.rnd()<0.3)s.fear--;
  /* resentment that eventually turns into an army on your border */
  var grud=(s.claim?7:0)+(50-s.rel)*0.09+(atWar(s.ix)?0:0)
    +((G.nearSet||[]).indexOf(s.ix)>=0?2:0);
  s.hostile=cl0((s.hostile||0)*0.9+grud*0.35,0,100);
 });
 aiTurn();

 /* the host marches, and anything it runs into is a battle */
 hostMove();
 G.battleDue=battleDue();
 G.acted={};                       /* a new year, and things may be tried again */
 G.peaceOffer=null;G.peaceDemand=null;
 for(var wix in (G.wars||{})){
  var res=warRound(+wix);
  if(res==="offer"&&G.peaceOffer===null)G.peaceOffer=+wix;
  else if(res==="demand"&&G.peaceDemand===null)G.peaceDemand=+wix;
  /* losing badly enough costs you a region, not just prestige */
  var w2=G.wars[wix];
  if(w2&&!w2.rev&&w2.sc<=-52&&G.yr-(w2.lastLoss||0)>=3){
   loseRegion(+wix);w2.sc=-8;w2.lastLoss=G.yr;w2.took=(w2.took||0)+1;
   if(G.over)return G;}
 }

 natAgg(M2);
 /* grain the routes brought in, shared out where the carts can reach */
 var gn=G.TB?(G.TB.net.grain-G.TB.bal.grain):0;
 G.grainIn=Math.max(0,gn);G.popPrev=G.pop;

 G.tr+=G.net;
 if(G.tr<0){
  if(G.debtLvl){G.debt+=-G.tr;G.tr=0;}
  else{G.tr=0;unrAll(7);G.prs=cl0(G.prs-4,0,100);
   chron(G.yr,"The chamber is empty and there is no instrument for borrowing. Wages go unpaid.");}
 }else if(G.debt>0){var rep=Math.min(G.debt,G.tr*0.26);G.debt-=rep;G.tr-=rep;}
 if(G.debtCap&&G.debt>G.debtCap)G.prs=cl0(G.prs-3,0,100);
 var hoard=G.tr-G.income*2.2;
 if(hoard>0){var sp=hoard*0.3;G.tr-=sp;G.prs=cl0(G.prs+Math.min(2.2,sp/Math.max(1,G.income)*0.9),0,100);}

 var iT=cl0(m(M2,"coin")*0.5+(G.tr>G.income*2.6?3.5:0)-(G.gdp>2.6e6?1.5:0),-5,22);
 G.infl+=(iT-G.infl)*0.3;

 if(G.sub>0){G.sub=Math.max(0,G.sub-(G.yr>=1204?165:70));
  if(G.sub===0)chron(G.yr,"The English subsidy stops. King John has his own war in Normandy to lose.");}

 var ct=centTarget();G.cent+=(ct-G.cent)*0.17;

 G.pap=cl0(G.pap+m(M2,"pap")*0.08,0,100);
 var legT=cl0(14+G.prs*0.3+G.cent*0.1+(G.pap-40)*0.12+m(M2,"leg")*0.3
   +(G.king?34:G.impFav*0.26)+G.regions.length*0.5,2,100);
 G.leg+=(legT-G.leg)*0.13;
 var prsT=cl0(26+m(M2,"prs")*0.55+G.cent*0.12+G.land*0.07+(G.king?12:0)-(G.prsDrag||0),3,100);
 G.prs+=(prsT-G.prs)*0.1;

 G.builds.slice().forEach(function(b){b.left--;if(b.left<=0){
  G.army[b.u]=(G.army[b.u]||0)+1;G.builds.splice(G.builds.indexOf(b),1);
  chron(G.yr,UID2[b.u].n+" raised at <b>"+b.loc+"</b>.");}});

 if(G.genius){G.genius.left--;if(G.genius.left<=0){
  chron(G.yr,"<b>"+cap1(G.genius.n)+"</b> is dead. What he knew that nobody wrote down is gone with him.");
  G.genius=null;}}
 else{
  var odds=1.6+m(M2,"gen")*0.085+G.gdpc*0.006;
  if(G.rnd()*100<cl0(odds,1.6,22)){var gx=GENII[Math.floor(G.rnd()*GENII.length)];
   G.genius={n:gx.n,d:gx.d,e:gx.e,left:5+Math.floor(G.rnd()*14)};
   chron(G.yr,"The court has acquired <b>"+G.genius.n+"</b>. "+G.genius.d);}
 }

 for(var ek in G.em){G.em[ek]*=0.978;if(Math.abs(G.em[ek])<0.4)delete G.em[ek];}

 G.ruler.age++;
 G.court.forEach(function(c){c.age++;});
 G.states.forEach(function(s){if(s.rule&&s.rule.age&&!s.me)s.rule.age++;});
 empTurn();
 deaths();

 if(typeof rankTurn==="function")rankTurn();
 if(typeof revoltWatch==="function")revoltWatch();
 recalcAll();intelPass();
 strain();
 if(!G.over)drawEvent();
 return G;
}
function finishResearch(){
 G.queue.slice().forEach(function(id){
  if(G.qleft[id]>0)return;
  G.queue.splice(G.queue.indexOf(id),1);delete G.qleft[id];
  G.done[id]=1;var t=TID[id];
  if(t.e&&t.e.doct)t.e.doct.forEach(function(d){
   if(G.doct[d]===undefined){G.doct[d]=1;
    var dd2=DOCT.filter(function(x){return x.i===d;})[0];
    G.doctSel=G.doctSel||{};
    if(dd2&&!G.doctSel[dd2.b])G.doctSel[dd2.b]=d;}});
  if(t.e&&t.e.debt)G.debtLvl=Math.max(G.debtLvl,t.e.debt);
  var before=snapshot();G.doneJust=1;recalcAll();

 });
}
function unrAll(n){G.regions.forEach(function(r){r.unrDelta+=n*0.5;r.unr=cl0(r.unr+n,0,100);});}

/* =============== DEATH AND SUCCESSION =============== */
function lifeOdds(c){
 var a=c.age,base=a<40?0.9:(a<50?2.1:(a<58?4.0:(a<66?7.2:(a<74?12:19))));
 var mod=0;(c.tr||[]).forEach(function(t){if(TRAITS[t]&&TRAITS[t].e.life)mod+=TRAITS[t].e.life;});
 return cl0(base*(1-mod*0.03),0.4,46);
}
function deaths(){
 G.states.forEach(function(s){
  if(s.me||!s.rule||s.rule.comm)return;
  if(G.rnd()*100<lifeOdds(s.rule)){
   var old=s.rule.n;
   s.rule=mkChar(heirName(s.n),22+Math.floor(G.rnd()*14),G.rnd);
   var sw=(G.rnd()-0.5)*40;
   s.rel=cl0(s.rel+sw,0,100);
   s.align=cl0(s.align+(G.rnd()-0.5)*50,-100,100);
   if(s.intel>=1)chron(G.yr,"<b>"+old+"</b> is dead in "+s.n+". "+s.rule.n+" succeeds"+
    (sw>12?", and is warmer to you than his predecessor.":sw<-12?", and is markedly cooler.":"."));
  }
 });
 G.court.forEach(function(c,i){if(G.rnd()*100<lifeOdds(c)){
  var nm=CFN[Math.floor(G.rnd()*CFN.length)]+" "+CSN[Math.floor(G.rnd()*CSN.length)];
  var sk=[];for(var j=0;j<6;j++)sk.push(2+Math.floor(G.rnd()*8));
  G.court[i]={n:nm,age:23+Math.floor(G.rnd()*22),sk:sk,
   tr:[TPOOL[Math.floor(G.rnd()*TPOOL.length)],TPOOL[Math.floor(G.rnd()*TPOOL.length)]]};
 }});
 if(G.ruler.comm)return;                     /* a commune's consuls are replaced, not buried */
 if(G.rnd()*100<lifeOdds(G.ruler))rulerDies();
}
function heirName(place){
 var f=CFN[Math.floor(G.rnd()*CFN.length)];
 return f+" of "+String(place).replace(/^.*?of /,"");
}

 if(G.king){
  chron(G.yr,"<b>"+old+"</b> is dead. The crown of the Romans is not inherited; the princes will choose.");
  if(G.rnd()*100<elecStrength()){
   G.ruler=mkChar(heirName(G.sname),19+Math.floor(G.rnd()*12),G.rnd);
   G.ruler.title=G.title;G.leg=cl0(G.leg-11,0,100);G.prs=cl0(G.prs-9,0,100);
   chron(G.yr,"The electors keep the crown in the house. <b>"+G.ruler.n+"</b> is king, and it was bought with promises.");
  }else{
   G.king=0;G.impFav=40;G.sub=0;
   G.ruler=mkChar(heirName(G.sname),19+Math.floor(G.rnd()*12),G.rnd);
   G.ruler.title=G.title;
   chron(G.yr,"The electors choose another house. You keep the duchy and lose the Empire. <b>"+G.ruler.n+"</b> succeeds as "+G.title+".");
  }

 }
 /* a prince's lands are inherited, and the heir is his own man */

 heir.title=G.title;
 var swing=(G.rnd()-0.5)*30;
 G.impFav=cl0(G.impFav+swing,0,100);
 G.prs=cl0(G.prs-6,0,100);
 G.cent=cl0(G.cent-5,0,100);

 chron(G.yr,"<b>"+old+"</b> is dead. <b>"+heir.n+"</b> succeeds as "+G.title+

 if(G.rnd()<0.2){
  G.ev={i:"succ_war",ey:"A disputed inheritance",h:"A Cousin With a Claim",

     " has produced a charter, witnesses and an armed following, and says the succession passed over him. Two of your regions have not yet sworn to the new lord.",
   o:[{n:"Buy him off",d:"A lordship, a pension and silence.",e:{tr:-Math.round(G.income*0.5),stab:7},

    {n:"Fight him",d:"Settle it in the field.",e:{land:-5,unr:9,stab:-6,prs:7},
      r:"It is settled in the field, with some burning. The regions swear."},
    {n:"Submit it to the king's court",d:"Let the Empire judge the inheritance.",e:{impFav:11,cent:-5,stab:5},
      r:"The court finds for you, mostly, and the Empire has now established that it judges your inheritance."}]};
