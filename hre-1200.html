/* ===================== AUTONOMOUS STATES =====================
   Every state on the map runs itself: it develops, researches, arms, makes
   friends, enters claims, declares war, takes land and loses it. None of this
   waits on the player, and most of it happens whether the player can see it
   or not.
   ============================================================= */
var AIP={
 warlike:{n:"warlike",aggr:1.55,dev:0.85,guile:0.9,arm:1.4,
   d:"Takes what is next to it and explains afterwards."},
 dynastic:{n:"dynastic",aggr:1.05,dev:1.0,guile:1.25,arm:1.0,
   d:"Marries, inherits, and goes to war over the result."},
 mercantile:{n:"mercantile",aggr:0.55,dev:1.45,guile:1.1,arm:0.75,
   d:"Would rather buy the road than take it."},
 pious:{n:"pious",aggr:0.45,dev:1.1,guile:0.85,arm:0.7,
   d:"Fights reluctantly and litigates enthusiastically."},
 cautious:{n:"cautious",aggr:0.55,dev:1.0,guile:1.0,arm:0.9,
   d:"Small, and intends to still be here in a century."}
};
function aiPersona(ix){
 var rank=T[ix]?T[ix].r:"C", pop=RG[ix][1], h=(ix*2654435761)>>>0, roll=(h%100)/100;
 if(rank==="E")return roll<0.78?"pious":"dynastic";
 if(rank==="T"||rank==="F")return roll<0.82?"mercantile":"cautious";
 if(rank==="M")return roll<0.72?"warlike":"dynastic";
 if(rank==="K")return roll<0.5?"warlike":"dynastic";
 if(rank==="D")return roll<0.42?"warlike":(roll<0.8?"dynastic":"cautious");
 if(pop<120)return roll<0.7?"cautious":"dynastic";
 return roll<0.34?"warlike":(roll<0.76?"dynastic":"cautious");
}
function aiInit(){
 G.awars=[];G.aallies={};G.news=[];
 G.states.forEach(function(s){
  s.ai=aiPersona(s.ix);
  var P=AIP[s.ai];
  s.tech=2.20+((s.ix*7919)%40)/4000;          /* nobody starts level */
  s.trs=Math.round(s.gdp*0.3+200);
  s.claims=[];
  s.hostile=0;
  s.nbr=nearIx(s.ix);
  s.armT=Math.max(1,Math.round(s.pop/60000*P.arm)+1);
 });
}
function aiNbr(s){return s.nbr||(s.nbr=nearIx(s.ix));}
/* a state that has been conquered acts through whoever holds it */
function ownerOf(s){return (s.ownerIx!==null&&s.ownerIx!==undefined)?s.ownerIx:s.ix;}
function indep(s){return s.ownerIx===null||s.ownerIx===undefined;}
function stName(ix){return shortName(G.states[ix].n);}
function pairKey(a,b){return a<b?a+"_"+b:b+"_"+a;}
function aiAllied(a,b){return !!G.aallies[pairKey(a,b)];}

/* news the player hears only if they could plausibly hear it */
function news(txt,ixs,force){
 var see=force?1:0;
 (ixs||[]).forEach(function(i){var s=G.states[i];if(s&&(isMine(s)||s.intel>=1||s.spy))see=1;});
 G.news.unshift({y:G.yr,t:txt,seen:see});
 if(G.news.length>160)G.news.pop();
 if(see)chron(G.yr,txt);
}

/* --------- a state's year --------- */
function aiTurn(){
 var order=G.states.slice().filter(function(s){return !s.me&&indep(s);});
 order.forEach(function(s){
  var P=AIP[s.ai]||AIP.cautious;
  /* economy */
  var inc=s.gdp*0.05*(1+s.dev*0.004);
  var up=s.army*14+s.gdp*0.022;
  s.trs=Math.max(0,s.trs+inc-up);
  /* development, paid for */
  if(s.trs>s.gdp*0.35&&G.rnd()<0.22*P.dev){s.dev=cl0(s.dev+1,8,97);s.trs-=s.gdp*0.2;}
  /* research: slow, and the rich move faster */
  s.tech=Math.min(2.299,s.tech+0.00032*(0.5+s.dev*0.016)*P.dev*(0.6+G.rnd()*0.9));
  /* arming, against what the neighbourhood looks like */
  var threat=0;
  aiNbr(s).forEach(function(j){var o=G.states[j];if(!o||aiAllied(s.ix,j))return;
   if(atWarPair(s.ix,j))threat+=o.army*1.5;else threat+=o.army*0.4;});
  s.armT=Math.max(1,Math.round((s.pop/60000)*P.arm+threat*0.22));
  if(s.army<s.armT&&s.trs>260){s.army++;s.trs-=240;}
  else if(s.army>s.armT+2&&G.rnd()<0.4)s.army--;
  /* diplomacy between themselves */
  if(G.rnd()<0.1*P.guile)aiDiplo(s);
  /* and the decision to fight */
  if(G.rnd()<0.058*P.aggr)aiWarDecide(s);
  /* where they stand on the crown */
  if(G.rnd()<0.05)s.imp=cl0(s.imp+(G.rnd()-0.5)*18,0,100);
 });
 aiWarsResolve();
}
function aiDiplo(s){
 var nb=aiNbr(s).filter(function(j){return G.states[j]&&indep(G.states[j])&&j!==G.nat;});
 if(!nb.length)return;
 var j=nb[Math.floor(G.rnd()*nb.length)], o=G.states[j];
 if(atWarPair(s.ix,j))return;
 var k=pairKey(s.ix,j);
 var biggest2=0;G.states.forEach(function(x){if(indep(x)&&x.pop>biggest2)biggest2=x.pop;});
 var affin=60-Math.abs(s.align-o.align)*0.25+(s.cult===o.cult?14:0)-(o.pop>biggest2*0.72?22:0);
 if(G.rnd()*100<affin*0.4&&!G.aallies[k]){
  G.aallies[k]=1;
  news("<b>"+stName(s.ix)+" and "+stName(j)+"</b> have sworn a mutual defence.",[s.ix,j]);
 }else if(G.rnd()<0.22&&s.claims.indexOf(j)<0&&affin<48){
  s.claims.push(j);
  news("<b>"+stName(s.ix)+"</b> has entered a claim against "+stName(j)+".",[s.ix,j]);
 }
}
function atWarPair(a,b){
 if(a===G.nat)return atWar(b);
 if(b===G.nat)return atWar(a);
 for(var i=0;i<G.awars.length;i++){var w=G.awars[i];
  if((w.a===a&&w.b===b)||(w.a===b&&w.b===a))return 1;}
 return 0;
}
function aiWarCount(ix){var n=0;G.awars.forEach(function(w){if(w.a===ix||w.b===ix)n++;});
 if(atWar(ix))n++;return n;}

function aiWarDecide(s){
 if(aiWarCount(s.ix)>0)return;                 /* one war at a time is plenty */
 if(G.awars.length>=6)return;
 if(s.army<2)return;
 var P=AIP[s.ai];
 var cands=aiNbr(s).filter(function(j){
  var o=G.states[j];
  if(!o||!indep(o)||aiAllied(s.ix,j)||atWarPair(s.ix,j))return 0;
  /* a man who holds of somebody is that somebody's business. Picking on him
     means answering to his lord, so it is only done to the badly protected. */
  if(typeof isVass==="function"&&isVass(j)){
   var lx=liegeOf(j);
   if(lx===s.ix)return 0;
   if(aiAllied(s.ix,lx))return 0;
   var L=G.states[lx];
   if(L&&indep(L)&&tierOf(lx)>=tierOf(s.ix)&&(o.ld||0)<58)return 0;
  }
  if(j===G.nat)return 1;
  return 1;});
 if(!cands.length)return;
 var best=null,bestScore=0;
 var biggest=0;G.states.forEach(function(x){if(indep(x)&&x.pop>biggest)biggest=x.pop;});
 cands.forEach(function(j){
  var o=G.states[j];
  var over=o.pop>biggest*0.72?16:0;        /* a coalition forms against whoever is winning */
  var theirs=(j===G.nat)?(G.land/9+G.def/14):(o.army+o.dev*0.05);
  var mine=s.army+s.dev*0.05+(s.tech-2.2)*30;
  var ratio=mine/Math.max(0.8,theirs);
  var want=(ratio-1)*60;
  if(s.claims.indexOf(j)>=0)want+=34;
  if(j===G.nat)want+=s.hostile*0.6-(G.states[s.ix].rel-50)*0.5;
  else want+=(50-((o.align-s.align)>0?0:12));
  want+=over;
  want+=regionsLeft(o)>0?0:-999;
  /* the Empire frowns on it, and a strong emperor frowns harder */
  if(G.laws&&G.laws.lland)want-=14;
  if(typeof isVass==="function"&&isVass(j)){
   var lq=liegeOf(j),LQ=G.states[lq];
   want-=18+(LQ?LQ.army*1.6:0)-((o.ld||0)*0.22);
  }
  want*=P.aggr;
  want+=(G.rnd()-0.5)*26;
  if(want>bestScore){bestScore=want;best=j;}
 });
 if(best===null||bestScore<37)return;
 aiDeclare(s.ix,best);
}
function aiDeclare(a,b){
 var A=G.states[a],B=G.states[b];
 if(b===G.nat){
  G.wars=G.wars||{};
  if(G.wars[a])return;
  G.wars[a]={sc:0,yrs:0,def:1};
  A.rel=cl0(A.rel-40,0,100);
  G.pendingAttack=a;
  return;
 }
 if(a===G.nat)return;
 G.awars.push({a:a,b:b,sc:0,yrs:0});
 news("<b>"+stName(a)+" has declared war on "+stName(b)+".</b>"+
  (A.claims.indexOf(b)>=0?" The claim has been hanging over them for years.":""),[a,b]);
 /* allies are dragged in, which is the point of having them */
 Object.keys(G.aallies).forEach(function(k){
  var p=k.split("_").map(Number);
  if(p.indexOf(b)<0)return;
  var ally=p[0]===b?p[1]:p[0];
  if(ally===a||ally===G.nat||atWarPair(ally,a))return;
  if(G.rnd()<0.5){G.awars.push({a:ally,b:a,sc:0,yrs:0});
   news("<b>"+stName(ally)+"</b> comes in on the side of "+stName(b)+".",[ally,a,b]);}
 });
}
function aiWarsResolve(){
 /* the king, when there is one who can be obeyed, imposes the peace of the land */
 var impPower=(G.emp&&G.emp.res?0.1:0.03)+(G.laws&&G.laws.lland?0.06:0);
 G.awars.slice().forEach(function(w){
  var A=G.states[w.a],B=G.states[w.b];
  if(!A||!B||!indep(A)||!indep(B)){drop(w);return;}
  if(w.yrs>1&&G.rnd()<impPower){drop(w);
   news("<b>The king imposes a peace</b> between "+stName(w.a)+" and "+stName(w.b)+
    ". Both are bound over and neither is satisfied.",[w.a,w.b]);return;}
  var am=A.army*8+A.dev*0.5+(A.tech-2.2)*160+(A.rule?A.rule.sk[1]*3:12);
  var bm=B.army*8+B.dev*0.5+(B.tech-2.2)*160+(B.rule?B.rule.sk[1]*3:12)+28;
  w.sc=cl0(w.sc+((am-bm)*0.28+(G.rnd()-0.5)*32),-100,100);
  w.yrs++;
  if(G.rnd()<0.4)A.army=Math.max(0,A.army-1);
  if(G.rnd()<0.45)B.army=Math.max(0,B.army-1);
  A.trs=Math.max(0,A.trs-A.gdp*0.06);B.trs=Math.max(0,B.trs-B.gdp*0.06);
  /* the winner takes something */
  if(w.sc>=57&&regionsLeft(B)>0){aiAnnexFrom(w.a,w.b);w.sc=14;}
  else if(w.sc<=-57&&regionsLeft(A)>0){aiAnnexFrom(w.b,w.a);w.sc=-14;}
  /* and sooner or later both sides have had enough */
  var tired=w.yrs>3+Math.floor(G.rnd()*6);
  if(tired||Math.abs(w.sc)<6&&w.yrs>5){
   if(G.rnd()<0.5||w.yrs>11){drop(w);
    news("<b>"+stName(w.a)+" and "+stName(w.b)+"</b> have made peace after "+w.yrs+
     (w.yrs===1?" year":" years")+".",[w.a,w.b]);}
  }
 });
 function drop(w){var i=G.awars.indexOf(w);if(i>=0)G.awars.splice(i,1);}
}
function aiAnnexFrom(aIx,bIx){
 var A=G.states[aIx],B=G.states[bIx];
 B.taken=(B.taken||0)+1;
 var share=1/SUBS[bIx].length;
 var movedPop=B.pop*share;
 B.pop=Math.max(4000,B.pop-movedPop);
 A.pop+=movedPop*0.9;
 A.army=Math.max(0,A.army);
 B.army=Math.max(0,B.army-1);
 A.gdp=A.pop*0.012*(1+A.dev*0.014);
 B.gdp=B.pop*0.012*(1+B.dev*0.014);
 var nm=SUBS[bIx][SUBS[bIx].length-B.taken]||"a district";
 if(regionsLeft(B)<=0){
  B.ownerIx=aIx;
  var ci=A.claims.indexOf(bIx);if(ci>=0)A.claims.splice(ci,1);
  G.awars.slice().forEach(function(w){
   if((w.a===bIx||w.b===bIx)){var i=G.awars.indexOf(w);if(i>=0)G.awars.splice(i,1);}});
  news("<b>"+stName(bIx)+" has been conquered entire by "+stName(aIx)+".</b> Its arms come down.",[aIx,bIx],1);
 }else{
  news("<b>"+stName(aIx)+" has taken "+nm+"</b> from "+stName(bIx)+".",[aIx,bIx]);
 }
}

/* --------- the player can lose land too --------- */
function loseRegion(toIx){
 if(G.regions.length<=1){
  G.over={k:"partition",h:"The State Is Partitioned",
   t:"The last of it is gone. What was left of "+G.sname+" has been divided between the neighbours who were waiting for it, the title survives in somebody's charter, and the family keeps a castle it is allowed to keep."};
  return null;
 }
 /* they take the weakest thing on the edge, never the seat while anything else stands */
 var cands=G.regions.filter(function(r){return !r.cap;});
 if(!cands.length)cands=G.regions.slice();
 cands.sort(function(a,b){return (a.stab-a.unr*0.6)-(b.stab-b.unr*0.6);});
 var r=cands[0];
 var i=G.regions.indexOf(r);G.regions.splice(i,1);
 delete RIDX[r.n];
 var S=G.states[toIx];
 S.pop+=r.pop*0.9;S.taken=Math.max(0,(S.taken||0)-1);
 G.prs=cl0(G.prs-9,0,100);
 unrAll(5);
 chron(G.yr,"<b>"+r.n+" is lost to "+stName(toIx)+".</b> The garrison marched out under terms and the oaths were taken again, to somebody else.");
 recalcAll();
 return r;
}

/* ===================== DYNAMIC EVENTS =====================
   An event is drawn against the state you are actually running: it names your
   regions, your resources, your neighbours and your ruler, and its effects land
   on the region it names rather than on the realm in the abstract.
   ========================================================== */
function pickRegion(how){
 var rs=G.regions.slice();
 if(!rs.length)return null;
 if(how==="food")rs.sort(function(a,b){return (a.food-a.need)/a.need-(b.food-b.need)/b.need;});
 else if(how==="rich")rs.sort(function(a,b){return b.gdp-a.gdp;});
 else if(how==="poor")rs.sort(function(a,b){return a.gdpc-b.gdpc;});
 else if(how==="unrest")rs.sort(function(a,b){return b.unr-a.unr;});
 else if(how==="town")rs.sort(function(a,b){return (b.towns+b.urb/20)-(a.towns+a.urb/20);});
 else if(how==="cap")return G.regions[0];
 else return rs[Math.floor(G.rnd()*rs.length)];
 /* among the top few, so it is not the same place every time */
 return rs[Math.floor(G.rnd()*Math.min(3,rs.length))];
}
function pickNeighbour(){
 var near=(G.nearSet||(G.nearSet=nearIx(G.nat))).filter(function(i){return !isMine(G.states[i]);});
 if(!near.length)return null;
 return G.states[near[Math.floor(G.rnd()*near.length)]];
}
function shortName(n){
 return String(n).replace(/^(Duchy|County|Kingdom|Margraviate|Landgraviate|Lordship|Bishopric|Archbishopric|Patriarchate|Dauphine|March|Commune|Marquisate|Palatinate|Free City|Principality|Abbey|Burgraviate|Empire|Republic) of /,"")
  .replace(/^Abbey of /,"").replace(/^Free City of /,"");
}
function evCtx(e){
 var C={};
 C.R=pickRegion(e.pick);
 var others=G.regions.filter(function(r){return r!==C.R;});
 C.R2=others.length?others[Math.floor(G.rnd()*others.length)]:C.R;
 C.S=pickNeighbour();
 var pool=[];G.regions.forEach(function(r){r.res.forEach(function(k){pool.push(k);});});
 C.res=pool.length?pool[Math.floor(G.rnd()*pool.length)]:null;
 C.T=pickRegion("town");
 return C;
}
function subst(txt,C){
 if(!txt)return txt;
 return String(txt)
  .replace(/\{R\}/g,C.R?C.R.n:"the country")
  .replace(/\{R2\}/g,C.R2?C.R2.n:"the next valley")
  .replace(/\{T\}/g,C.T?C.T.n:(C.R?C.R.n:"the town"))
  .replace(/\{CAP\}/g,G.regions[0]?G.regions[0].n:G.sname)
  .replace(/\{STATE\}/g,G.sname)
  .replace(/\{SHORT\}/g,shortName(G.sname))
  .replace(/\{RULER\}/g,G.ruler.n)
  .replace(/\{TITLE\}/g,G.title)
  .replace(/\{S\}/g,C.S?shortName(C.S.n):"a neighbour")
  .replace(/\{SFULL\}/g,C.S?C.S.n:"a neighbouring state")
  .replace(/\{SLORD\}/g,C.S&&C.S.rule?C.S.rule.n:"its lord")
  .replace(/\{RES\}/g,C.res?RES[C.res][0].toLowerCase():"wool");
}
/* effects aimed at one region rather than at the realm */
function applyRegion(r,e){
 if(!r||!e)return"";
 var note="";
 for(var k in e){var v=e[k];
  switch(k){
   case"unr":r.unr=cl0(r.unr+v,0,100);r.unrDelta+=v*0.4;break;
   case"stab":r.stab=cl0(r.stab+v,0,100);break;
   case"pop":r.pop=Math.max(2000,r.pop*(1+v/100));break;
   case"dev":r.dev=cl0(r.dev+v,5,98);break;
   case"urb":r.urb=cl0(r.urb+v,1,80);break;
   case"acc":r.acc=cl0(r.acc+v,4,99);break;
   case"farms":r.farms=Math.max(0,r.farms+v);break;
   case"towns":r.towns=Math.max(0,r.towns+v);break;
   case"shift":r.shifted=1;break;
   case"bld":if(BID[v]){r.bld[v]=(r.bld[v]||0)+1;note="A "+BID[v].n.toLowerCase()+" now stands at "+r.n+".";}break;
   case"res":if(RES[v]&&r.res.indexOf(v)<0){r.res.push(v);note=cap1(RES[v][0])+" is now worked at "+r.n+".";}break;
   default:break;
  }
 }
 return note;
}

/* ===================== WAR =====================
   You can declare it, fight it year by year, and take land for it.
   =============================================== */
function isMine(s){return !!(s&&(s.me||s.ownerIx===G.nat));}
function atWar(ix){return !!(G.wars&&G.wars[ix]);}
function warCount(){var n=0;for(var k in (G.wars||{}))n++;return n;}
function regionsLeft(s){return SUBS[s.ix].length-(s.taken||0);}
function canDeclare(ix){
 var s=G.states[ix];
 if(!s||isMine(s)||atWar(ix))return 0;
 if(armyCount()<1)return 0;
 if(regionsLeft(s)<1)return 0;
 return declBlock(ix)?0:1;
}
/* rank decides who you are allowed to pick a fight with, and how many at once */
function declBlock(ix){
 var s=G.states[ix];
 if(!s)return "not possible";
 if(amVassal())return (ix===G.liege)?
   "renouncing your homage is done from the Standing pane" :
   ("you hold of "+shortName(myLiege().n)+"; a war of your own is a revolt");
 if(s.liege===G.nat)return "he is your own man; revoke the fief first";
 var cap=RTIER[myTier()].wars;
 if(warCount()>=cap)return "a "+rankRow(myRank()).sh.toLowerCase()+" cannot run more than "+
   cap+" war"+(cap>1?"s":"")+" at once";
 if(tierOf(ix)>myTier()+1&&!s.claim)
   return "nobody would follow a "+rankRow(myRank()).sh.toLowerCase()+
    " against a "+rankRow(rankKey(ix)).sh.toLowerCase()+" without a claim entered first";
 return "";
}
function declareWar(ix){
 if(!canDeclare(ix))return "";
 var s=G.states[ix];
 G.wars=G.wars||{};
 G.wars[ix]={sc:0,yrs:0};
 s.rel=cl0(s.rel-45,0,100);
 var just=s.claim;
 if(!just){G.prs=cl0(G.prs-7,0,100);G.pap=cl0(G.pap-6,0,100);G.impFav=cl0(G.impFav-9,0,100);}
 else G.impFav=cl0(G.impFav-3,0,100);
 /* their friends take it personally */
 G.states.forEach(function(o){if(o.ix!==ix&&!isMine(o)&&G.rnd()<0.3)o.rel=cl0(o.rel-6,0,100);});
 chron(G.yr,"<b>War is declared on "+shortName(s.n)+"</b>"+
  (just?", on the claim already entered.":", without a claim. The Empire notices that part."));
 recalcAll();
 return "War with "+shortName(s.n)+".";
}
function warRound(ix){
 var s=G.states[ix],w=G.wars[ix];
 /* doctrines finally decide how a campaign is fought, not just how strong it is */
 var dk={shock:0,attr:0,camp:0,raid:0,sieg:0},doc=0;
 DOCT.forEach(function(D){if(!doctOn(D.i))return;doc+=4;
  for(var kk in dk)dk[kk]+=(D.e[kk]||0);});
 var mine=G.land+G.ruler.sk[1]*4+doc+(G.genius&&G.genius.e.land?G.genius.e.land:0);
 var theirs=s.army*8+s.dev*0.5+(s.rule?s.rule.sk[1]*3:12);
 /* whoever is defending is fighting on their own castles and their own roads */
 if(w.def)mine+=G.def*0.9+30; else theirs+=30;
 /* a rising is a different war: fought in your own country, with whoever else
    has renounced, against a lord who may have his hands full elsewhere */
 if(w.rev){
  var RS=revStrength();
  theirs*=RS.scale; mine+=25+G.regions.length*5;
 }
 /* shock swings a battle hard either way; siegecraft tells against their works */
 var swing=34+dk.shock*0.8;
 var roll=(mine-theirs)*0.3+dk.sieg*0.35+(G.rnd()-0.5)*swing;
 if(roll>0)roll+=dk.raid*0.22;
 if(w.rev)roll*=1.5;            /* a rising is settled quickly or not at all */
 w.sc=cl0(w.sc+roll,-100,100);w.yrs++;
 /* war costs money, men and patience */
 var cost=Math.round((G.income*0.16+armyCount()*22)*cl0(1+dk.camp*0.012,0.5,2));
 G.tr=Math.max(0,G.tr-cost);
 if(G.rnd()<cl0(0.42-dk.attr*0.012,0.1,0.7)){
  var us=Object.keys(G.army).filter(function(u){return G.army[u]>0;});
  if(us.length){var u=us[Math.floor(G.rnd()*us.length)];G.army[u]--;if(!G.army[u])delete G.army[u];}
 }
 if(G.rnd()<0.5)s.army=Math.max(0,s.army-1);
 unrAll(2.4);
 var txt;
 if(roll>14)txt="The campaign against "+shortName(s.n)+" goes well. "+
   (G.rnd()<0.5?"A field action is won and two castles have opened their gates.":"Their host declined battle and the country has been eaten bare.");
 else if(roll<-14)txt="The campaign against "+shortName(s.n)+" goes badly. "+
   (G.rnd()<0.5?"A column was caught at a river crossing and cut up.":"A siege was raised after four months and nothing to show.");
 else txt="Another season against "+shortName(s.n)+" with nothing decided. Both sides are poorer.";
 chron(G.yr,txt);
 /* nobody is annihilated in a single war: after two provinces they take terms */
 if((w.took||0)>=2&&G.rnd()<0.55)return "demand";
 /* they sue for peace when they are losing badly enough */
 if(w.sc>62&&G.rnd()<0.45)return "offer";
 if(w.sc<-55&&G.rnd()<(0.35+(w.took||0)*0.3))return "demand";
 /* a long war neither side is winning simply stops */
 if(w.yrs>7&&Math.abs(w.sc)<22&&G.rnd()<0.3)return "demand";
 return "";
}
function annex(ix){
 var s=G.states[ix],names=SUBS[ix],taken=s.taken||0;
 if(taken>=names.length)return null;
 /* taken from the edges inward: the capital is the last thing to fall */
 var nm=names[names.length-1-taken];
 var row=RG[ix],rnd=G.rnd;
 var share=1/names.length;
 var r={ix:G.regions.length,nat:G.nat,n:nm,cap:0,
  pop:Math.max(3000,Math.round(s.pop*share)),
  urb:cl0(row[2]*(0.5+rnd()*0.6),1,70),
  dev:cl0(Math.round(row[3]*(0.7+rnd()*0.4)),8,95),
  terr:row[4],
  acc:cl0(Math.round(row[5]*0.55),6,80),   /* newly taken land is hard to reach */
  stab:cl0(22+rnd()*14,5,97),
  unr:cl0(52+rnd()*22,1,96),               /* and it does not want you */
  res:row[10].length?[row[10][taken%row[10].length]]:[],
  towns:rnd()<0.5?1:0,coast:row[12]&&rnd()<0.4?1:0,
  farms:1,bld:{},shifted:0,unrDelta:0,intel:3,conq:1};
 G.regions.push(r);RIDX[r.n]=r;
 s.taken=taken+1;
 s.pop=Math.max(4000,s.pop*(1-share));
 s.army=Math.max(0,s.army-1);
 if(s.taken>=names.length){
  s.ownerIx=G.nat;s.rel=100;s.claim=0;
  if(G.wars&&G.wars[ix])delete G.wars[ix];        /* nothing left to fight over */
  if(G.peaceOffer===ix)G.peaceOffer=null;
  if(G.peaceDemand===ix)G.peaceDemand=null;
  chron(G.yr,"<b>"+shortName(s.n)+" is conquered entire.</b> Its arms come down and the last of its regions is yours.");
 }else chron(G.yr,"<b>"+nm+" is taken from "+shortName(s.n)+".</b> It is yours, and it is not pleased about it.");
 recalcAll();
 return r;
}
function makePeace(ix,terms){
 var s=G.states[ix],w=G.wars[ix];if(!w)return"";
 if(w.rev&&amVassal()&&ix===G.liege){
  if(terms==="annex"||terms==="tribute"){
   delete G.wars[ix];
   freeMe("<b>"+shortName(s.n)+" gives it up.</b> The homage is renounced for good and you hold of the Empire alone.");
   return "You are free of "+shortName(s.n)+".";
  }
  if(terms==="submit"||terms==="cede"){
   delete G.wars[ix];
   s.rel=cl0(s.rel+30,0,100);G.ld=cl0((G.ld||0)-52,0,100);
   var loss=Math.round(G.income*1.1);G.tr=Math.max(0,G.tr-loss);
   chron(G.yr,"<b>You submit again to "+shortName(s.n)+".</b> The homage is renewed on worse terms than before and a fine of "+fmt(loss)+" marks is assessed on the realm.");
   demote("A rising put down is a title forfeit in all but name.");
   recalcAll();return "You submit.";
  }
  delete G.wars[ix];
  s.rel=cl0(s.rel+12,0,100);G.ld=cl0((G.ld||0)-16,0,100);
  chron(G.yr,"<b>The rising ends where it began.</b> You are still "+shortName(s.n)+"'s man and both of you are poorer.");
  recalcAll();return "Nothing settled.";
 }
 var msg="";
 if(terms==="annex"){var r=annex(ix);msg=r?r.n+" is ceded to you.":"Nothing more to take.";}
 else if(terms==="tribute"){var amt=Math.round(s.gdp*0.35);G.tr+=amt;
  msg=shortName(s.n)+" pays "+fmt(amt)+" marks to be left alone.";}
 else if(terms==="white")msg="Peace with "+shortName(s.n)+", on the terms things already stand.";
 else if(terms==="submit"){var loss=Math.round(G.income*0.9);G.tr=Math.max(0,G.tr-loss);
  G.prs=cl0(G.prs-11,0,100);msg="You buy peace from "+shortName(s.n)+" for "+fmt(loss)+" marks.";}
 else if(terms==="cede"){var gone=loseRegion(ix);
  msg=gone?gone.n+" is ceded and the war ends.":"There was nothing left to cede.";}
 delete G.wars[ix];
 s.rel=cl0(s.rel+(terms==="white"?18:6),0,100);
 s.claim=0;
 chron(G.yr,"<b>Peace with "+shortName(s.n)+".</b> "+msg);
 recalcAll();
 return msg;
}

/* =============== EVENTS =============== */
function drawEvent(){
 for(var i=0;i<HIST.length;i++){var H=HIST[i];
  if(H.y!==G.yr||G.flags["h"+H.i])continue;
  if(H.sd){ /* a quarrel belonging to one of the two claimants */
   if(!G.king||G.recog!==H.sd){G.flags["h"+H.i]=1;continue;}
  }
  G.flags["h"+H.i]=1;G.ev=H;G.evC=evCtx(H);return;}

function difficulty(ix){

 var r=RG[ix], pop=r[1], dev=r[3], nreg=SUBS[ix].length;

 if(ix===CLAIMS.ph.ix)score+=5;          /* a crown is worth something */
 if(ix===CLAIMS.ot.ix)score-=4;          /* and Otto's is worth less */
 if(r[12])score+=1.5;                    /* a coast is an escape and a trade route */
 /* a lord above you is a roof over your head and a lid on your head */

/* what a realm puts on the market this year */
function tradeProd(){
 var P={};
 function add(k,q){if(!CIX[k])return;P[k]=(P[k]||0)+q;}
 G.regions.forEach(function(r){
  var scale=(r.pop/1000)*(0.35+r.dev/110);
  r.res.forEach(function(k){add(k,scale*0.42);});
  for(var bid in r.bld){
   var rule=BLDPROD[bid];if(!rule)continue;
   var good=rule[0],qty=rule[1]*r.bld[bid];
   if(good==="*ore"){
    var ore=["silver","copper","lead","iron"].filter(function(o){return r.res.indexOf(o)>=0;})[0]||"iron";
    add(ore,qty);
   }else add(good,qty);
  }
 });
 /* grain is the food system: what the land actually yields above the plough */
 var raw=0;G.regions.forEach(function(r){raw+=r.foodRaw;});
 P.grain=(P.grain||0)+raw*0.9;
 /* what ordinary local work makes without anyone calling it an industry */
 var dem0=null;
 COMM.forEach(function(c){
  if(!c.b)return;
  if(!dem0)dem0=tradeDemRaw();
  add(c.i,(dem0[c.i]||0)*c.b);
 });
 /* a forested or coastal realm yields these without needing them listed */
 G.regions.forEach(function(r){
  var sc=(r.pop/1000)*0.3;
  if(r.terr==="fo")add("timber",sc*1.2);
  if(r.coast)add("fish",sc*1.1);
 });
 return P;
}
/* what it wants */
function tradeDemRaw(){
 var D={},pop=G.pop/1000,urb=G.pop*G.urb/100/1000,army=armyCount(),
     sol=G.regions.reduce(function(a,r){return a+r.sol;},0)/Math.max(1,G.regions.length);
 COMM.forEach(function(c){
  var q=0;
  if(c.d==="pop")q=pop*c.w*0.105;
  else if(c.d==="build")q=pop*c.w*0.055+G.regions.reduce(function(a,r){return a+bldCount(r);},0)*0.12*c.w;
  else if(c.d==="urb")q=urb*c.w*0.30;
  else if(c.d==="army")q=army*c.w*0.95+pop*c.w*0.016;
  else if(c.d==="lux")q=urb*c.w*(sol/100)*0.46;
  else if(c.d==="mint")q=G.gdp/4200*c.w;
  D[c.i]=q;
 });
 return D;
}
function tradeDem(){
 var D=tradeDemRaw();
 D.grain=G.needN*0.9;          /* grain demand is simply what the people eat */
 return D;
}
/* empire-wide scarcity moves the price of everything */
function tradePrices(){
 var pr={};
 COMM.forEach(function(c){
  var have=0,want=0;
  G.states.forEach(function(s){
   var sc=s.pop/1000;
   want+=sc*c.w*0.08;
   if(s.res.indexOf(c.i)>=0)have+=sc*c.w*0.16;
   if(c.i==="grain")have+=sc*0.075;
  });
  var ratio=have/Math.max(0.01,want);
  pr[c.i]=c.p*cl0(1.45-ratio*0.5,0.55,2.2);
 });
 return pr;
}

function routeCap(){

}
function routeVolCap(){

/* distance between two states on the map, as a fraction of the Empire's span */
function tdist(ix){
 var a=T[G.nat]&&T[G.nat].c, b=T[ix]&&T[ix].c;
 if(!a||!b)return 0.5;

}

/* ---- the books ---- */
function tradeBooks(){
 var P=tradeProd(),D=tradeDem(),pr=tradePrices();
 var bal={},exp=0,imp=0,upk=0,lost=0;
 COMM.forEach(function(c){bal[c.i]=(P[c.i]||0)-(D[c.i]||0);});
 var flow={};
 (G.trade.routes||[]).forEach(function(rt){
  rt.ok=routeLive(rt);
  if(!rt.ok){rt.vol=0;rt.val=0;rt.upk=0;return;}
  var c=CIX[rt.c];if(!c)return;
  var dist=rt.pw?0.62:tdist(rt.to);
  var cap=routeVolCap()*(1-dist*0.42);
  var want;
  if(rt.dir==="exp"){
   want=Math.max(0,bal[rt.c]);                       /* only a real surplus can be sold */
   rt.vol=Math.min(cap,want);
  }else{
   want=Math.max(0,-bal[rt.c]);                      /* only a real shortfall is worth buying */
   rt.vol=Math.min(cap,want*1.25);
  }
  var loss=cl0(0.08+dist*0.22+tinfE("loss")*0.01,0.01,0.6);
  var vmul=1+tinfE("value")*0.01;
  rt.price=pr[rt.c];
  if(rt.dir==="exp"){
   rt.val=rt.vol*rt.price*(1-loss)*vmul;
   exp+=rt.val; flow[rt.c]=(flow[rt.c]||0)-rt.vol;
  }else{
   rt.val=-rt.vol*rt.price*(1+loss*0.5);
   imp+=-rt.val; flow[rt.c]=(flow[rt.c]||0)+rt.vol;
  }
  rt.upk=rt.vol*dist*1.5*cl0(1+tinfE("upk")*0.01,0.4,2)+9;
  upk+=rt.upk; lost+=rt.vol*loss;
 });
 var infUpk=0;for(var id in (G.trade.infra||{}))if(G.trade.infra[id])infUpk+=TINFIX[id].u;

 return {P:P,D:D,pr:pr,bal:bal,net:net,exp:exp,imp:imp,upk:upk+infUpk,
  routeUpk:upk,infUpk:infUpk,lost:lost,surplus:exp-imp-upk-infUpk};

function routeLive(rt){

/* ===================== THE HOST IN THE FIELD =====================
   An army stands somewhere. It marches, it meets other armies, and where
   two of them meet there is a battle.
   ================================================================= */
function hostInit(){
 if(!G.host)G.host={loc:G.nat,moving:null,march:0};
 if(!G.ehosts)G.ehosts=[];
}
function hostAt(){return G.host?G.host.loc:G.nat;}
function canMarchTo(ix){
 if(ix===hostAt())return 0;
 if(!armyCount())return 0;
 if(G.host.moving!==null&&G.host.moving!==undefined)return 0;
 var near=nearIx(hostAt());
 return near.indexOf(ix)>=0?1:0;
}
function orderMarch(ix){
 if(!canMarchTo(ix))return "";
 G.host.moving=ix;
 var s=G.states[ix];
 chron(G.yr,"The host is ordered to march on <b>"+stName(ix)+"</b>.");
 return "Marching on "+stName(ix);
}
function hostMove(){
 if(!G.host)return;
 if(G.host.moving===null||G.host.moving===undefined)return;
 var to=G.host.moving;
 G.host.loc=to;G.host.moving=null;G.host.march=(G.host.march||0)+1;
 var s=G.states[to];
 if(!isMine(s))chron(G.yr,"The host has crossed into <b>"+stName(to)+"</b>.");
 else chron(G.yr,"The host is quartered at <b>"+stName(to)+"</b>.");
}
/* the enemy hosts the player could know about */
function enemyHosts(){
 var out=[];
 for(var k in (G.wars||{})){
  var ix=+k,s=G.states[ix];if(!s)continue;
  var w=G.wars[k];
  /* a host that is invading stands on your ground; otherwise it is at home */
  var loc=(w.def&&w.yrs>0)?G.nat:ix;
  out.push({ix:ix,loc:loc,n:s.army,s:s});
 }
 return out;
}
/* where a battle is owed this year */
function battleDue(){
 var here=hostAt();
 for(var k in (G.wars||{})){
  var ix=+k;
  if(ix===here)return ix;                       /* you are standing in their land */
  var w=G.wars[k];
  if(w.def&&here===G.nat&&w.yrs>0)return ix;    /* or they are standing in yours */
 }
 return null;
}

/* ===================== THE BATTLE =====================
   Fought in real time on a field, or settled on the spot. Blocks of men
   advance, close, break and run. Morale decides it far more often than
   casualties do.
   ====================================================== */
var BT=null;     /* the live battle */
var BTYPE={
 mil:{n:"Milites",men:40,sp:0.62,atk:3.1,def:2.2,mor:1.25,rng:0,col:"#c9a23a",cls:"horse"},
 serj:{n:"Serjeants",men:110,sp:0.34,atk:1.5,def:1.7,mor:1.0,rng:0,col:"#8e8468",cls:"foot"},
 pike:{n:"Spear Hedge",men:120,sp:0.28,atk:1.3,def:2.6,mor:1.1,rng:0,col:"#6f7f92",cls:"spear"},
 xbow:{n:"Crossbowmen",men:70,sp:0.33,atk:1.1,def:0.9,mor:0.85,rng:88,col:"#7a9a6a",cls:"shot"},
 merc:{n:"Brabancons",men:100,sp:0.36,atk:2.1,def:1.8,mor:0.95,rng:0,col:"#9a6f4a",cls:"foot"},
 siege:{n:"Siege Train",men:30,sp:0.16,atk:0.6,def:0.6,mor:0.7,rng:120,col:"#6a5a4a",cls:"engine"},
 cog:{n:"Marines",men:50,sp:0.3,atk:1.3,def:1.3,mor:0.9,rng:0,col:"#4a6f8c",cls:"foot"},
 gal:{n:"Marines",men:50,sp:0.3,atk:1.3,def:1.3,mor:0.9,rng:0,col:"#4a6f8c",cls:"foot"}
};
function btMake(army,side,W,H,bonus){
 var blocks=[],i=0,list=[];
 for(var u in army){for(var k=0;k<army[u];k++)list.push(u);}
 if(!list.length)list=["serj"];
 /* a line of foot with horse on the wings, which is how it was done */
 list.sort(function(a,b){
  var ra=BTYPE[a]?BTYPE[a].cls:"foot", rb=BTYPE[b]?BTYPE[b].cls:"foot";
  var o={shot:0,spear:1,foot:2,horse:3,engine:4};
  return (o[ra]||2)-(o[rb]||2);
 });
 var n=list.length, wide=Math.min(n,9), rows=Math.ceil(n/wide);
 list.forEach(function(u,ix){
  var t=BTYPE[u]||BTYPE.serj;
  var row=Math.floor(ix/wide), col=ix%wide, inRow=Math.min(wide,n-row*wide);
  var spread=W*0.56, x0=W/2-spread/2+spread*((col+0.5)/inRow);
  var y0=side===0?H-64-row*40:64+row*40;
  blocks.push({u:u,t:t,side:side,x:x0,y:y0,tx:x0,ty:y0,
   men:t.men,max:t.men,mor:100,st:"hold",eng:null,cd:0,sel:0,
   atk:t.atk*(1+bonus*0.01),def:t.def*(1+bonus*0.01)});
  i++;
 });
 return blocks;
}
function battleStart(ix,onDone){
 var s=G.states[ix];
 var W=900,H=560;
 var doc=0,dk={shock:0,attr:0};
 DOCT.forEach(function(D){if(!doctOn(D.i))return;doc+=4;
  dk.shock+=(D.e.shock||0);dk.attr+=(D.e.attr||0);});
 /* both sides are scored the same way, or the comparison means nothing */
 function quality(land,martial){return (land-30)*0.30+martial*2.2;}
 var myBonus=quality(G.landRaw||G.land,G.ruler.sk[1])+dk.shock*0.35;
 var theirArmy={},left=Math.max(1,s.army);
 /* what a state of their size and wealth puts in the field */
 var mix=["serj","serj","xbow","mil","pike"];
 for(var i=0;i<left;i++)theirArmy[mix[i%mix.length]]=(theirArmy[mix[i%mix.length]]||0)+1;
 var theirLand=26+s.army*4.4+s.dev*0.12+((s.tech||2.2)-2.2)*110;
 var theirBonus=quality(theirLand,s.rule?s.rule.sk[1]:4);
 var myB=btMake(G.army,0,W,H,myBonus), thB=btMake(theirArmy,1,W,H,theirBonus);
 /* the same weight of men per company on both sides, or the count means nothing */
 var myPer=myB.reduce(function(a,x){return a+x.max;},0)/Math.max(1,myB.length);
 var thPer=thB.reduce(function(a,x){return a+x.max;},0)/Math.max(1,thB.length);
 if(thPer>0){var k2=myPer/thPer;thB.forEach(function(x){x.max=Math.round(x.max*k2);x.men=x.max;});}
 BT={ix:ix,W:W,H:H,t:0,speed:1,run:0,over:null,onDone:onDone,
  blocks:myB.concat(thB),
  myStart:armyCount(),theirStart:left,attr:dk.attr,
  sel:[],drag:null,msg:"Your line is drawn up. Give the order."};
 return BT;
}
function btSide(side){return BT.blocks.filter(function(b){
 return b.side===side&&b.men>0&&b.mor>0&&!b.out;});}
function btStep(dt){
 if(!BT||BT.over)return;
 BT.t+=dt;
 var B=BT.blocks;
 /* who is fighting whom, so that six blocks cannot all pile onto one */
 var engaged={};
 B.forEach(function(b){
  if(b.men<=0||b.mor<=0||b.st==="rout")return;
  var foe=null,fd=1e9;
  btSide(1-b.side).forEach(function(o){
   if(o.st==="rout")return;
   var d=Math.hypot(o.x-b.x,o.y-b.y);if(d<fd){fd=d;foe=o;}});
  b._foe=foe;b._fd=fd;
  if(foe&&fd<22){var k=B.indexOf(foe);engaged[k]=(engaged[k]||0)+1;}
 });
 B.forEach(function(b){
  if(b.men<=0||b.mor<=0)return;
  /* the enemy picks its own fights */
  if(b.side===1&&!b.eng){
   var tg=null,bd=1e9;
   btSide(0).forEach(function(o){if(o.st==="rout")return;
    var d=Math.hypot(o.x-b.x,o.y-b.y);if(d<bd){bd=d;tg=o;}});
   if(tg){b.tx=tg.x;b.ty=tg.y-(b.t.rng?b.t.rng*0.8:0);}
  }
  if(b.st==="rout"){
   b.y+=(b.side===0?1:-1)*b.t.sp*2.4*dt*60;
   b.routT=(b.routT||0)+dt;
   /* the pursuit costs them, and then they are away */
   if(b.routT<2.2)b.men=Math.max(0,b.men-b.max*dt*0.045);
   else b.out=1;
   b.mor=Math.max(0,b.mor-dt*6);
   return;
  }
  var foe=b._foe,fd=b._fd===undefined?1e9:b._fd;
  b.eng=null;
  if(foe){
   if(b.t.rng>0&&fd<b.t.rng){
    /* shoot */
    b.cd-=dt;
    if(b.cd<=0){b.cd=1.1;
     var hit=b.men*0.05*b.atk*0.35;
     foe.men=Math.max(0,foe.men-hit);
     foe.mor-=hit/foe.max*150;
    }
   }else if(fd<22){
    b.eng=foe;
    /* a block holding its ground fights better than one caught moving */
    var held=Math.hypot(b.tx-b.x,b.ty-b.y)<5?1.22:1;
    var fHeld=Math.hypot(foe.tx-foe.x,foe.ty-foe.y)<5?1.22:1;
    var push=(b.atk*b.men/b.max)-(foe.def*fHeld*foe.men/foe.max)*0.72;
    var crowd=1/Math.sqrt(Math.max(1,engaged[B.indexOf(foe)]||1));
    var cas=Math.max(0.3,(b.atk*0.85*held+Math.max(0,push)*1.15))*dt*1.25*crowd*
      cl0(1-BT.attr*0.004,0.5,1.3);
    foe.men=Math.max(0,foe.men-cas);
    /* heart goes long before the numbers do */
    foe.mor-=cas/foe.max*210+dt*1.2;
    /* a charge in the flank or rear is worth more than numbers */
    if(b.t.cls==="horse"&&fd<24&&BT.t<16)foe.mor-=dt*9;
   }
  }
  /* move toward the order, or toward the nearest foe if none given */
  var gx=b.tx,gy=b.ty;
  /* an unordered line still advances to meet what is coming at it */
  if(b.side===0&&b.st==="hold"&&Math.hypot(gx-b.x,gy-b.y)<4&&foe&&fd<420){
   gx=foe.x;gy=foe.y-(b.t.rng?b.t.rng*0.75:0);}
  var dx=gx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy);
  if(d>2&&!b.eng){
   var v=b.t.sp*dt*60;
   b.x+=dx/d*v;b.y+=dy/d*v;
  }
  b.x=cl0(b.x,14,BT.W-14);b.y=cl0(b.y,14,BT.H-14);
  /* morale recovers a little when nothing is happening */
  if(!b.eng&&b.mor<100)b.mor=Math.min(100,b.mor+dt*1.6);
  if(b.mor<=18&&b.st!=="rout"){b.st="rout";
   if(b.side===0)BT.msg=b.t.n+" have broken and are running.";}
 });
 /* is it decided */
 var a=btSide(0).filter(function(b){return b.st!=="rout";}).length;
 var c=btSide(1).filter(function(b){return b.st!=="rout";}).length;
 if(BT.t>150&&a&&c){                       /* the light goes and both draw off */
  var am=0,cm=0;
  btSide(0).forEach(function(b){am+=b.men;});
  btSide(1).forEach(function(b){cm+=b.men;});
  BT.over=am>cm*1.3?"win":cm>am*1.3?"lose":"draw";
  btFinish();return;
 }
 if(!a||!c){
  BT.over=(!c&&a)?"win":(!a&&c)?"lose":"draw";
  btFinish();
 }
}
function btLosses(){
 var mine=0,theirs=0,m0=0,t0=0;
 BT.blocks.forEach(function(b){
  var lost=Math.max(0,b.max-b.men);
  if(b.side===0){m0+=b.max;mine+=lost;}
  else{t0+=b.max;theirs+=lost;}});
 return {mine:mine/Math.max(1,m0),theirs:theirs/Math.max(1,t0)};
}
function btFinish(){
 var L=btLosses(), ix=BT.ix, res=BT.over;
 /* companies lost in proportion to the men lost */
 var lossFrac=cl0(L.mine*(res==="lose"?1.25:0.75),0,0.9);
 var killed=0;
 Object.keys(G.army).forEach(function(u){
  var k=Math.round(G.army[u]*lossFrac);
  if(k>0){G.army[u]-=k;killed+=k;if(G.army[u]<=0)delete G.army[u];}
 });
 var s=G.states[ix];
 s.army=Math.max(0,Math.round(s.army*(1-cl0(L.theirs*(res==="win"?1.2:0.7),0,0.85))));
 var w=G.wars[ix];
 if(w){
  var swing=res==="win"?26+L.theirs*28:res==="lose"?-(24+L.mine*26):0;
  w.sc=cl0(w.sc+swing,-100,100);
 }
 G.prs=cl0(G.prs+(res==="win"?6:res==="lose"?-7:0),0,100);
 chron(G.yr,"<b>A battle is fought against "+stName(ix)+".</b> "+
  (res==="win"?"Their line broke and the field is yours.":
   res==="lose"?"Your line broke. What is left came away in the dark.":
   "Both hosts drew off at dusk with nothing settled.")+
  " You lost "+killed+(killed===1?" company":" companies")+".");
 recalcAll();
}
/* settled without being fought */
function btAuto(ix){
 var s=G.states[ix];
 var mine=G.land+G.ruler.sk[1]*4+armyStr()*0.2;
 var theirs=s.army*9+s.dev*0.5+((s.tech||2.2)-2.2)*150+(s.rule?s.rule.sk[1]*3:12)+24;
 var roll=(mine-theirs)*0.5+(G.rnd()-0.5)*70;
 BT={ix:ix,blocks:[],over:roll>12?"win":roll<-12?"lose":"draw",t:0,W:900,H:560};
 /* casualties scale with how close it was */
 var close=cl0(1-Math.abs(roll)/140,0.25,1);
 var mineLoss=cl0((roll<0?0.3:0.12)*close*1.6,0.04,0.6);
 var theirLoss=cl0((roll>0?0.32:0.12)*close*1.6,0.04,0.6);
 BT.blocks=[{side:0,max:100,men:100*(1-mineLoss)},{side:1,max:100,men:100*(1-theirLoss)}];
 btFinish();
 var r=BT.over;BT=null;
 return r;
}

/* ---- the field, drawn ---- */
var btRAF=null,btLast=0;
function battleModal(ix){
 battleStart(ix);
 var s=G.states[ix];
 var h='<div class="ey">'+esc(G.yr)+' \u00b7 the field before '+esc(stName(ix))+'</div>'+
  '<h2>Battle</h2>'+
  '<p>Drag a box to select blocks, then click where they should go. <b>Select all</b> and '+
  '<b>Charge</b> is the whole of the art if you are in a hurry. A line that is given no orders and '+
  'waits to be come at will usually be beaten. Blocks that lose heart run, and a line that runs '+
  'does not come back.</p>'+
  '<div id="btwrap"><canvas id="btc"></canvas><div id="btmsg"></div></div>'+
  '<div class="btbar">'+
   '<button class="btn p" id="btplay">Begin</button>'+
   '<button class="btn" id="btspd">Speed x1</button>'+
   '<button class="btn" id="btall">Select all</button>'+
   '<button class="btn" id="btchg">Charge</button>'+
   '<button class="btn" id="bthold">Hold</button>'+
   '<button class="btn" id="btauto">Resolve it for me</button>'+
  '</div><div id="btstat"></div>';
 modal(h);
 var cv=$("btc"),ctx=cv.getContext("2d");
 function size(){
  var w=cv.parentNode.clientWidth||680;
  cv.width=Math.round(w*(window.devicePixelRatio||1));
  cv.height=Math.round(w*0.62*(window.devicePixelRatio||1));
  cv.style.width=w+"px";cv.style.height=Math.round(w*0.62)+"px";
 }
 size();
 function sc(){return cv.width/BT.W;}
 function draw(){
  if(!BT)return;
  var k=sc(),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);

/* ===================== RANK, VASSALAGE AND LIBERTY =====================
   Every estate of the Empire has a rank, and the rank is not decoration. It
   sets how many envoys you have in a year, how much weight your word carries,
   which laws you are allowed to make, how many wars you can run at once and
   whom you are permitted to attack at all. Below the ranks sit the men who
   hold of somebody else: a vassal has most of this taken off him, pays for
   the privilege, and spends every year of it wanting out.
   ====================================================================== */

/* The ladders. One for the secular princes, one for the Church, one for the
   towns. `up` is what the Empire raises this rank to; `dn` is what is left of
   it when the Empire, or a neighbour, takes it down. */
var RANKT={
 I:{n:"Empire",              sh:"Empire",       t:7,k:"sec"},
 K:{n:"Kingdom",             sh:"Kingdom",      t:6,k:"sec",up:"I",dn:"D"},

 P:{n:"Principality",        sh:"Principality", t:4,k:"sec",up:"D",dn:"M"},
 V:{n:"Palatinate",          sh:"Palatinate",   t:4,k:"sec",up:"D",dn:"M"},
 M:{n:"Margraviate",         sh:"Margraviate",  t:3,k:"sec",up:"P",dn:"C"},
 L:{n:"Landgraviate",        sh:"Landgraviate", t:3,k:"sec",up:"P",dn:"C"},
 C:{n:"County",              sh:"County",       t:2,k:"sec",up:"M",dn:"S"},
 G:{n:"Burgraviate",         sh:"Burgraviate",  t:2,k:"sec",up:"M",dn:"S"},
 S:{n:"Lordship",            sh:"Lordship",     t:1,k:"sec",up:"C"},
 Y:{n:"Patriarchate",        sh:"Patriarchate", t:6,k:"chr",dn:"A"},
 A:{n:"Prince-archbishopric",sh:"Archbishopric",t:5,k:"chr",up:"Y",dn:"E"},
 E:{n:"Prince-bishopric",    sh:"Bishopric",    t:4,k:"chr",up:"A",dn:"B"},
 B:{n:"Imperial abbey",      sh:"Abbey",        t:3,k:"chr",up:"E",dn:"S"},
 W:{n:"Serene Republic",     sh:"Republic",     t:5,k:"urb",dn:"R"},
 R:{n:"Republic",            sh:"Republic",     t:4,k:"urb",up:"W",dn:"F"},
 F:{n:"Free imperial city",  sh:"Free city",    t:3,k:"urb",up:"R",dn:"T"},
 T:{n:"Free commune",        sh:"Commune",      t:2,k:"urb",up:"F",dn:"S"}
};
RANKS.V=["Palatinate", "#b5456a"];
RANKS.Y=["Patriarchate", "#b05fd0"];
RANKS.W=["Serene Republic", "#1aa58c"];
RANKS.R=["Republic", "#2b9b84"];

/* What each step of the ladder is actually worth. */
var RTIER=[null,
 {w:"Petty",    dipl:1,slot:0,wars:1,prs:-9, land:-7,tax:-1,fav:-10,lawT:1},
 {w:"Minor",    dipl:2,slot:0,wars:1,prs:-4, land:-3,tax:0, fav:-5, lawT:2},

 {w:"Great",    dipl:4,slot:1,wars:3,prs:12, land:13,tax:4, fav:12, lawT:4},
 {w:"Royal",    dipl:5,slot:2,wars:4,prs:20, land:20,tax:7, fav:20, lawT:4},
 {w:"Imperial", dipl:6,slot:3,wars:5,prs:30, land:30,tax:10,fav:30, lawT:4}];
/* which group of laws a prince of that standing is competent to make */
var LAWT={sol:1,min:1,eco:3,gov:4};

/* ---------- reading a rank ---------- */
function rankKey(ix){var s=G&&G.states[ix];return (s&&s.rank)||(T[ix]?T[ix].r:"C");}
function rankRow(k){return RANKT[k]||RANKT.C;}

function rankName(k){return rankRow(k).n;}
function myRank(){return G.rank||T[G.nat].r;}

/* ---------- vassalage ---------- */
function liegeOf(ix){var s=G&&G.states[ix];return (s&&s.liege!==undefined)?s.liege:null;}
function isVass(ix){var l=liegeOf(ix);return l!==null&&l!==undefined;}
function amVassal(){return G.liege!==null&&G.liege!==undefined;}
function myLiege(){return amVassal()?G.states[G.liege]:null;}
function vassalsOf(ix){var out=[];G.states.forEach(function(s){
 if(s.liege===ix&&indep2(s))out.push(s.ix);});return out;}
/* a conquered state is nobody's vassal; it is somebody's province */
function indep2(s){return s.ownerIx===null||s.ownerIx===undefined;}
function myVassals(){return vassalsOf(G.nat);}

/* the top of your own chain: who you would really be fighting */
function overlordOf(ix,depth){
 var l=liegeOf(ix),n=0;
 while(l!==null&&l!==undefined&&n<8){ix=l;l=liegeOf(ix);n++;}
 return ix;
}

/* What a vassal owes, as a share of its revenue. A great man under a greater
   one pays less, because he is harder to squeeze. */
function tribRate(six){
 var vix=(six===undefined)?G.nat:six;
 var lx=liegeOf(vix); if(lx===null||lx===undefined)return 0;
 var gap=cl0(tierOf(lx)-tierOf(vix),0,6);
 var ld=(vix===G.nat)?(G.ld||0):(G.states[vix].ld||0);
 return cl0(0.07+gap*0.022-ld*0.0006,0.02,0.22);
}
function tributeDue(){
 if(!amVassal())return 0;
 return Math.round(G.income*tribRate());
}
/* and what yours pay you */
function vassalDues(){
 var sum=0;
 myVassals().forEach(function(j){var s=G.states[j];
  sum+=s.gdp*tribRate(j)*2.2*(1-cl0((s.ld||0)/140,0,0.7));});
 return Math.round(sum);
}
/* how many men a vassal brings when called */
function vassalLevy(){
 var n=0;myVassals().forEach(function(j){var s=G.states[j];
  n+=Math.round(s.army*cl0(1-(s.ld||0)/110,0.1,1));});
 return n;
}

/* ---------- liberty desire ---------- */
function ldTarget(vix){
 var v=(vix===G.nat);
 var s=G.states[vix], lx=liegeOf(vix);
 if(lx===null||lx===undefined)return 0;
 var L=G.states[lx];
 var vt=tierOf(vix), lt=tierOf(lx);
 var vpop=v?G.pop:s.pop, lpop=(lx===G.nat)?G.pop:L.pop;
 var str=cl0(vpop/Math.max(1,lpop)*100,0,160);
 var yrs=v?(G.vassYrs||0):(s.vassYrs||0);
 var rel=v?(L.rel||50):(s.rel||50);
 /* The baseline is high, because a man who holds of another man wants not to.
    What good treatment and a daunting lord buy is quiet, not contentment, and
    what decides whether the wanting turns into anything is the odds, which are
    worked out separately when he acts. */
 var t=38
   + yrs*0.32
   + (4-cl0(lt-vt,0,4))*5            /* a near-equal chafes most */
   - cl0(lt-vt,0,4)*3                /* and a very great lord is daunting */
   + str*0.18
   - (rel-50)*0.30                   /* how he has actually been treated */
   + (v?(G.prs-40)*0.25:0)
   + (v?G.unr*0.10:0)
   - (lx===G.nat?0:(L.rule?L.rule.sk[0]:4)*1.3)
   + ((G.wars&&G.wars[lx])?22:0)
   + (v?(G.ldPush||0):0);
 if(lx===G.nat)t-=G.prs*0.16+G.leg*0.07;
 if(v&&G.outlaw)t+=14;
 return cl0(t,0,100);
}

/* ---------- standing: what the Empire thinks you are worth ---------- */
function techFrac(){
 var n=0,tot=0;for(var i=0;i<TECH.length;i++)tot+=TECH[i].tiers.length*2;
 for(var k in G.done)n++;
 return tot?n/tot:0;
}
function standing(){
 var v=G.regions.length*1.9
  + Math.max(0,Math.log(Math.max(1,G.pop/7000))*6.2)
  + G.prs*0.20 + G.leg*0.13 + G.impFav*0.11
  + techFrac()*22 + (G.king?10:0)
  + Math.min(8,G.tr/4200) + Math.min(6,myVassals().length*1.6)
  - (G.outlaw?15:0) - Math.min(11,G.debt/2600)
  - (amVassal()?9:0);
 return cl0(v,0,100);
}

/* What the Empire asks before it will raise you a step. Indexed by the tier
   you are asking to reach. */
var RUP=[null,null,
 {reg:3, pop:40000,  prs:24,leg:22,fav:38,gold:700,  st:20},
 {reg:5, pop:110000, prs:34,leg:32,fav:46,gold:2100, st:32},
 {reg:7, pop:250000, prs:46,leg:44,fav:55,gold:4800, st:45},
 {reg:10,pop:520000, prs:58,leg:55,fav:63,gold:10500,st:58},
 {reg:14,pop:950000, prs:70,leg:67,fav:73,gold:21000,st:71,pap:55},
 {reg:19,pop:1700000,prs:84,leg:81,fav:87,gold:44000,st:85,pap:70,king:1}];

/* A free city of fifteen thousand outranks a county of forty, and an abbey is
   not judged on acres. The thresholds are read against the kind of estate. */
function kindScale(k){return {urb:0.26,chr:0.58,sec:1}[rankRow(k||myRank()).k]||1;}
function scaleReq(R,k){
 var f=kindScale(k);
 return {reg:Math.max(2,Math.round(R.reg*(f<1?0.62:1))),pop:Math.round(R.pop*f),
  prs:R.prs,leg:R.leg,fav:R.fav,gold:Math.round(R.gold*(f<1?0.8:1)),st:R.st,
  pap:R.pap,king:R.king};
}
function rupReq(){
 var up=nextRank(myRank());if(!up)return null;
 var t=rankRow(up).t, R=RUP[t];if(!R)return null;
 return {rank:up,tier:t,R:scaleReq(R,up)};
}
function rupChecks(){
 var q=rupReq();if(!q)return null;
 var R=q.R, out=[];
 out.push(["Regions held",G.regions.length,R.reg,G.regions.length>=R.reg,fmt(R.reg)]);
 out.push(["Population",Math.round(G.pop),R.pop,G.pop>=R.pop,fmt(R.pop)]);
 out.push(["Prestige",Math.round(G.prs),R.prs,G.prs>=R.prs,Math.round(R.prs)]);
 out.push(["Legitimacy",Math.round(G.leg),R.leg,G.leg>=R.leg,Math.round(R.leg)]);
 out.push(["Imperial favour",Math.round(G.impFav),R.fav,G.king||G.impFav>=R.fav,Math.round(R.fav)]);
 out.push(["Standing",Math.round(standing()),R.st,standing()>=R.st,Math.round(R.st)]);
 out.push(["In the chamber",Math.round(G.tr),R.gold,G.tr>=R.gold,fmt(R.gold)]);
 if(R.pap!==undefined)out.push(["Papal goodwill",Math.round(G.pap),R.pap,G.pap>=R.pap,Math.round(R.pap)]);
 if(R.king)out.push(["Crowned king of the Romans",G.king?"yes":"no",1,!!G.king,"required"]);
 return {q:q,rows:out,ok:out.every(function(r){return r[3];})};
}
function rupBlocked(){
 var c=rupChecks();

function petitionRank(){

   +(G.king?16:0)+G.ruler.sk[0]*1.6,12,94);
 if(G.rnd()*100<odds){
  var old=rankName(myRank());
  G.rank=q.rank;
  G.title=newTitle(q.rank);
  G.ruler.title=G.title;
  G.prs=cl0(G.prs+11,0,100);G.leg=cl0(G.leg+8,0,100);G.impFav=cl0(G.impFav-6,0,100);
  rankSync();recalcAll();
  chron(G.yr,"<b>The Empire raises you.</b> What was a "+old.toLowerCase()+" is a "+
   rankName(q.rank).toLowerCase()+", and you are styled "+G.title+" from the reading of the charter.");
  return "Raised to "+rankName(q.rank)+".";
 }
 G.tr+=Math.round(q.R.gold*0.5);
 G.impFav=cl0(G.impFav-4,0,100);G.rupCool=G.yr+3;
 chron(G.yr,"<b>The petition is refused.</b> The chancery keeps half the fee and the matter may not be raised again for three years.");

}
function newTitle(k){
 var seat=SUBS[G.nat][0], base=TITLES[G.nat];
 var of=base.replace(/^[^ ]+( of | )?/,"");
 if(/ of /.test(base))of=base.slice(base.indexOf(" of ")+4);
 var head={I:"Emperor of",K:"King of",D:"Duke of",P:"Prince of",V:"Count Palatine of",
  M:"Margrave of",L:"Landgrave of",C:"Count of",G:"Burgrave of",S:"Lord of",
  Y:"Patriarch of",A:"Archbishop of",E:"Bishop of",B:"Abbot of",
  W:"Doge of",R:"Gonfalonier of",T:"Consuls of"}[k];

/* the floor under your present rank: hold less than this for three years and

 return {reg:Math.max(1,Math.round(R.reg*0.45*(f<1?0.62:1))),pop:Math.round(R.pop*0.4*f)};

/* ---------- getting out ---------- */

   promises, spent on your own men rather than on anybody else's. */

function sueCost(){return Math.round(80+G.income*0.25);}
function pushBlocked(){
 if(!amVassal())return "you hold of nobody";
 if(G.acted&&G.acted.push)return "already done this year";

}

 var gain=5+Math.round(G.ruler.sk[0]*0.7+G.rnd()*4);
 G.ldPush=cl0((G.ldPush||0)+gain,0,34);
 G.ld=cl0((G.ld||0)+gain*0.6,0,100);
 var L=myLiege();if(L)L.rel=cl0(L.rel-3,0,100);
 chron(G.yr,"<b>The knights are bound to you</b> by grants, remissions and a quiet word about what happens afterwards. "+
  fmt(c)+" marks, and your household is readier than it was.");
 recalcAll();
 return "Liberty desire +"+Math.round(gain*0.6)+".";
}
function sueBlocked(){
 if(!amVassal())return "you hold of nobody";
 if(G.acted&&G.acted.sue)return "already tried this year";
 var L=myLiege();
 if(G.wars&&G.wars[G.liege])return "you are in revolt; finish it";
 if((G.ld||0)<45)return "there is no appetite for it yet";

}
function sueIndep(){
 if(sueBlocked())return "";

/* ---------- offering a defeated enemy vassalage instead of annexation ---------- */
function canVassalise(ix){
 var s=G.states[ix];if(!s||isMine(s)||!indep2(s))return 0;
 if(s.liege===G.nat)return 0;

}

 var s=G.states[ix];
 s.liege=G.nat;s.ld=cl0(34+G.rnd()*22,0,100);s.vassYrs=0;s.rel=cl0(s.rel+22,0,100);s.claim=0;
 if(G.wars&&G.wars[ix])delete G.wars[ix];
 if(G.peaceOffer===ix)G.peaceOffer=null;
 if(G.peaceDemand===ix)G.peaceDemand=null;
 G.prs=cl0(G.prs+7,0,100);
 chron(G.yr,"<b>"+shortName(s.n)+" does homage.</b> The territory stays in its own hands and its lord is your man, which is cheaper than garrisoning it.");

/* ---------- the yearly pass ---------- */

 s.rank=myRank();s.liege=amVassal()?G.liege:null;s.ld=G.ld||0;
 G.diplMax=cl0(myTierRow().dipl+(amVassal()?-1:0)+Math.round((G.ruler.sk[0]-5)*0.3),1,7);
}
function rankTurn(){
 if(!G||G.over)return;
 /* your own liberty, and your own men's */
 if(amVassal()){
  G.vassYrs=(G.vassYrs||0)+1;

  G.ld=cl0((G.ld||0)+(t-(G.ld||0))*0.2,0,100);
  liegeYear();
 }else{G.ld=0;G.vassYrs=0;}

 G.states.forEach(function(s){
  if(s.me||!indep2(s))return;
  if(!isVass(s.ix)){s.ld=0;s.vassYrs=0;return;}
  s.vassYrs=(s.vassYrs||0)+1;
  var t2=ldTarget(s.ix);
  s.ld=cl0((s.ld||0)+(t2-(s.ld||0))*0.18,0,100);
  if(s.liege===G.nat){ if(s.ld>=72&&G.rnd()<0.045+(s.ld-72)*0.006)vassalRises(s); }
  else if(s.ld>=60&&G.rnd()<(s.ld-60)*0.0045)aiVassalBreaks(s);
 });

 /* a great man who has beaten a small neighbour may take his homage instead */
 if(G.rnd()<0.30)aiVassalise();
 if(G.rnd()<0.14)aiVassalise();

 if(G.ldPush)G.ldPush=Math.max(0,G.ldPush-1.5);
 /* a rank is only kept up if there is something under it */
 rankCheck();
 rankSync();
}

   cost:function(){return 0;}},

   cost:function(){return Math.round(G.income*0.08);}},
  {i:"ward",n:"Your heir as his ward",d:"Raised in his household. A courtesy that is also a hostage.",

 ];

   '<p class="lead">You hold of the Empire and of nobody else. Whatever the Emperor asks of you he asks as Emperor, and there is no man standing between.</p>';
 var L=myLiege(), h='';
 h+='<div class="sh" style="margin-top:16px"><h3 style="font-size:15px">Your lord</h3>'+
   '<span class="hr">'+esc(rankRow(rankKey(G.liege)).sh)+'</span></div>';
 h+='<div class="card">';
 h+='<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:6px">'+armsSVG(T[G.liege].g,34)+
  '<div style="min-width:0"><h4 style="font-size:15px;margin-bottom:1px">'+esc(TITLES[G.liege])+'</h4>'+
  '<div style="font-size:11.5px;color:var(--ink-3)">'+esc(L.rule?L.rule.n:L.n)+'</div></div></div>';
 h+=kv("His regard for you",Math.round(L.rel),cls(L.rel));
 h+=kv("Tribute you owe",pc(tribRate()*100)+" \u00b7 "+fmt(tributeDue())+" marks");
 h+=kv("Years as his man",G.vassYrs||0);
 h+='<div class="kv"><span class="k">Liberty desire</span><span class="v '+
   ((G.ld||0)>60?"b":(G.ld||0)>35?"w":"g")+'">'+Math.round(G.ld||0)+'</span></div>';
 h+=barHtml(G.ld||0,(G.ld||0)>60?"bad":(G.ld||0)>35?"warn":"good");
 h+='<p class="fine">'+esc(ldWord(G.ld||0))+'</p>';
 h+='</div>';

 h+='<div class="sh" style="margin-top:13px"><h3 style="font-size:15px">What is closed to you</h3></div>';
 vassLocks().forEach(function(l){
  h+='<div class="tr"><div class="trh"><span class="n">'+esc(l[0])+'</span>'+
   '<span class="pill b">closed</span></div><div class="d">'+esc(l[1])+'</div></div>';
 });

 h+='<div class="sh" style="margin-top:13px"><h3 style="font-size:15px">Getting out</h3></div>';
 var sb=sueBlocked(), rb=revoltBlocked();
 var pb=pushBlocked();
 h+='<div class="tr"><div class="trh"><span class="n">Bind the knights to you</span>'+
  (pb?'<span class="pill mu">'+esc(pb)+'</span>':'<span class="pill w">open</span>')+'</div>'+
  '<div class="d">Grants, remissions and a quiet word about what happens when the homage is gone. It does not free you; it makes your own men willing to be freed.</div>'+
  '<div class="kv"><span class="k">Ground prepared</span><span class="v">'+Math.round(G.ldPush||0)+' of 34</span></div>'+
  (pb?'':'<div class="btns"><button class="btn" id="bpush">Bind them \u00b7 '+fmt(pushCost())+' marks</button></div>')+'</div>';
 h+='<div class="tr"><div class="trh"><span class="n">Sue to be released</span>'+
  (sb?'<span class="pill mu">'+esc(sb)+'</span>':'<span class="pill w">open</span>')+'</div>'+
  '<div class="d">Buy the cancellation of your homage: a fee to him, a fee to the chancery, and an argument at the Diet. Expensive, lawful, and it does not burn the country.</div>'+
  (sb?'':'<div class="btns"><button class="btn" id="bsue">Sue \u00b7 '+fmt(sueCost())+' marks</button></div>')+'</div>';
 h+='<div class="tr"><div class="trh"><span class="n">Renounce the homage</span>'+
  (rb?'<span class="pill mu">'+esc(rb)+'</span>':'<span class="pill b">war</span>')+'</div>'+
  '<div class="d">Burn the oath and hold what you have against him. His other men may rise with you. If he beats you he will take the style off you and fine the realm.</div>'+
  (function(){var RS=revStrength();
   return '<div class="kv"><span class="k">A rising would stand</span><span class="v '+
    (RS.odds>58?"g":RS.odds>34?"w":"b")+'">'+Math.round(RS.odds)+' in a hundred</span></div>'+
    '<p class="fine">You could put '+fmt(RS.mine)+' into the field against his '+fmt(RS.theirs)+
    (RS.risers?('. '+RS.risers+' of his other men are ready to rise with you'):'. None of his other men would move')+
    (RS.busy?('. He has '+RS.busy+' other war'+(RS.busy>1?'s':'')+' on his hands'):'')+'.</p>';})()+
  (rb?'':'<div class="btns"><button class="btn d" id="brev">Revolt against '+esc(shortName(L.n))+'</button></div>')+'</div>';
 return h;
}
function ldWord(v){
 if(v<18)return "The arrangement suits you well enough, and nobody at your court says otherwise out loud.";
 if(v<35)return "Your household grumbles about the dues and the summonses. Nothing more than that.";
 if(v<52)return "Your men talk openly about what the realm would be if it held of nobody.";
 if(v<70)return "Your council is divided between those who want it put to him and those who want it put to the sword.";
 if(v<85)return "Your knights are waiting for a word. If you do not give it they will find another lord who will.";
 return "This cannot hold another five years. Either he releases you or you take it.";
}

function standVassals(){
 var vs=myVassals();
 var h='<div class="sh" style="margin-top:16px"><h3 style="font-size:15px">Your own men</h3>'+
  '<span class="hr">'+(vs.length?vs.length+" holding of you":"none")+'</span></div>';
 if(!vs.length){
  h+='<p class="lead">Nobody holds of you. A state beaten badly enough in war may be offered homage instead of annexation, which costs nothing to garrison and brings men and money every year.</p>';
  return h;
 }
 h+=kv("Dues from your men",fmt(vassalDues())+" marks");
 h+=kv("Men they would bring",vassalLevy()+" companies");
 vs.forEach(function(j){
  var s=G.states[j], ld=Math.round(s.ld||0);
  h+='<div class="tr"><div class="trh" style="gap:8px">'+
   '<span style="flex:0 0 auto">'+armsSVG(T[j].g,18)+'</span>'+
   '<span class="n">'+esc(shortName(s.n))+'</span>'+rankPill(rankKey(j))+
   '<span class="pill '+(ld>60?"b":ld>35?"w":"g")+'">liberty '+ld+'</span></div>'+
   '<div class="d">'+fmt(s.pop)+' \u00b7 '+s.army+' companies \u00b7 regard '+Math.round(s.rel)+
   ' \u00b7 '+(s.vassYrs||0)+' years your man'+(s.hostage?' \u00b7 heir at your court':'')+
   (s.wed?' \u00b7 married into your house':'')+'</div>'+
   barHtml(100-ld,ld>60?"bad":ld>35?"warn":"good")+
   '<div class="btns">';
  VACT.forEach(function(a){
   var bl=vactBlocked(j,a.i);
   h+='<button class="btn sm'+(a.strip?" d":"")+'" data-va="'+j+':'+a.i+'"'+
    (bl?' disabled title="'+esc(bl)+'"':' title="'+esc(a.d)+(a.c?" "+fmt(a.c)+" marks":"")+'"')+
    '>'+esc(a.n)+'</button>';
  });
  h+='</div></div>';
 });
 return h;
}
function wireStanding(){
 var p=$("p-standing");
 var b1=$("brankup");if(b1)b1.onclick=function(){var m2=petitionRank();bar();paneStanding();if(m2)toast(m2);};
 var b2=$("bsue");if(b2)b2.onclick=function(){var m2=sueIndep();bar();paneStanding();if(m2)toast(m2);};
 var b3=$("brev");if(b3)b3.onclick=function(){var m2=revolt();bar();paneStanding();if(m2)toast(m2);};
 var b4=$("bpush");if(b4)b4.onclick=function(){var m2=pushLiberty();bar();paneStanding();if(m2)toast(m2);};
 Array.prototype.forEach.call(p.querySelectorAll("[data-va]"),function(b){
  b.onclick=function(){var a=b.getAttribute("data-va").split(":");
   var m2=doVact(+a[0],a[1]);bar();paneStanding();if(m2)toast(m2);};});
}

/* a law group you are not grand enough to legislate for */
function lawTierOK(g){
 var need=LAWT[g]||1;
 if(amVassal()&&g==="gov")return 0;
 return myTier()>=need;
}
function lawGate(g){
 if(amVassal()&&g==="gov")return "your liege legislates; you administer";
 var need=LAWT[g]||1;
 if(myTier()<need)return "no "+rankRow(myRank()).sh.toLowerCase()+" legislates on this";
 return "";
}

/* the liege's demand, as an event card */
function liegeAskModal(){
 var a=G.liegeAsk;if(!a)return;
 modal('<h2>'+esc(a.from)+' asks</h2>'+
  '<p class="lead">'+esc(a.n)+'. '+esc(a.d)+'</p>'+
  (a.c?'<div class="kv"><span class="k">It will cost</span><span class="v">'+fmt(a.c)+' marks</span></div>':'')+
  '<div class="kv"><span class="k">Granting it</span><span class="v g">his regard +9, liberty -7</span></div>'+
  '<div class="kv"><span class="k">Refusing it</span><span class="v b">his regard -14, liberty +9</span></div>'+
  '<p class="fine">A lord who is refused often enough declares the fief forfeit and comes for it.</p>'+
  '<div class="btns"><button class="btn p" id="bask1">Grant it</button>'+
  '<button class="btn d" id="bask0">Refuse</button></div>');
 $("bask1").onclick=function(){var m2=liegeAnswer(1);closeModal();bar();showPane();if(m2)toast(m2);};
 $("bask0").onclick=function(){var m2=liegeAnswer(0);closeModal();bar();showPane();if(m2)toast(m2);};
}


/* ---- a revolt is settled by the fighting, not by a pane ---- */
function revoltWatch(){
 if(!G||G.over||!amVassal())return;
 var lx=G.liege, w=G.wars&&G.wars[lx];
 if(!w||!w.rev)return;
 if(w.sc>=50&&G.rnd()<0.6){
  delete G.wars[lx];
  freeMe("<b>The rising has carried.</b> "+shortName(G.states[lx].n)+
   " cannot bring another host into the field this year and the homage is renounced for good.");
  return;
 }
 if(w.sc<=-50&&G.rnd()<0.6){
  delete G.wars[lx];
  var L=G.states[lx];
  L.rel=cl0(L.rel+26,0,100);G.ld=cl0((G.ld||0)-48,0,100);
  var loss=Math.round(G.income*1.2);G.tr=Math.max(0,G.tr-loss);
  chron(G.yr,"<b>The rising is broken.</b> "+shortName(L.n)+
   " takes your submission, a fine of "+fmt(loss)+" marks, and your word in writing.");
  demote("A rising put down is a title forfeit in all but name.");
 }
}

/* ================= BOOT ================= */
function begin(natIx,recog){
 selMode=0;document.body.classList.remove("sel");
 initGame(natIx,recog);closeModal();
 $("end").textContent="End Year";
 $("end").onclick=endYear;
 tab="realm";buildTabs();buildOvBtns();paintMap();bar();showPane();save();
}
function endYear(){
 if(!G||G.over)return;
 endTurn();bar();paintMap();buildTabs();showPane();
 if(G.over){overModal();save();return;}
 if(G.ev)eventModal();
 else if(G.liegeAsk)liegeAskModal();
 else saveSoon();
}
function boot(){
 indexTech();
 $("imparms2").innerHTML=armsSVG({f:"#d6a62c",ch:["eagle","#1e1c19"]},30);
 buildOvBtns();
 $("end").onclick=endYear;
 $("themeb").onclick=function(){
  var r=document.documentElement,cur=r.getAttribute("data-theme");
  var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
  try{localStorage.setItem("rextheme",dark?"light":"dark");}catch(x){}
 };
 try{var th=localStorage.getItem("rextheme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(x){}
 if(load()){tab="realm";buildTabs();paintMap();bar();showPane();if(G.over)overModal();}
 else selStart();
}
boot();


</script>
